  return { start: s.night_start || '22:00', end: s.night_end || '12:00' };
}
function isNightSlot(iso) {
  if (!iso) return false;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return false;
  const hm = d.getHours() * 60 + d.getMinutes();
  const { start, end } = nightRange();
  const s = hmToMinutes(start), e = hmToMinutes(end);
  return s <= e ? (hm >= s && hm < e) : (hm >= s || hm < e);
}
/* Minimum de commande applicable pour ce mode, selon que le créneau choisi
   tombe ou non dans la tranche de nuit. Sans créneau sélectionné (aperçu
   avant choix), on retombe sur le minimum de jour. */
/* Message rouge quand le panier n'atteint pas le minimum : on dit au client
   comment passer quand même. Sous le minimum de livraison de jour : passer en
   « Aucune préférence ». Au-dessus, c'est le créneau de nuit qui bloque :
   « Aucune préférence », ou un créneau avant le début de la tranche de nuit. */
function minAmountError(min) {
  const base = 'Minimum ' + fmt(min) + ' requis';
  if (state.noPreference) return base;
  const total = cartMinBase();
  const jour = minForMode('delivery', null);
  const sansPref = minForMode('pickup', null);
  if (total < sansPref) return base;
  const noPref = 'cliquez sur « Aucune préférence »';
  if (total < jour) return base + ' — ' + noPref;
  const h = String(nightRange().start || '21:00').split(':');
  const heure = Number(h[0]) + 'h' + (h[1] && h[1] !== '00' ? h[1] : '');
  return base + ' — ' + noPref + ' ou choisissez un créneau avant ' + heure;
}
function minForMode(mode, slotIso) {
  const s = catalog.settings || {};
  const night = isNightSlot(slotIso);
  if (mode === 'pickup') return night ? (s.min_pickup_night || s.min_pickup || 1000) : (s.min_pickup || 1000);
  // Livraison et boîte aux lettres partagent le même montant minimum (une seule
  // case de réglage pour les deux, cf. Admin → Réglages).
  return night ? (s.min_delivery_night || s.min_delivery || 10000) : (s.min_delivery || 10000);
}
/* Créneaux rendus indisponibles un par un depuis l'admin. Stockés en ISO dans
   le catalogue : ils voyagent avec le fichier publié. Bloquer un créneau ne
   change PAS les horaires d'ouverture de la boutique. */
function blockedSlots() {
  const s = catalog.settings || (catalog.settings = {});
  if (!Array.isArray(s.blocked_slots)) s.blocked_slots = [];
  return s.blocked_slots;
}
/* Créneaux occupés par une commande SUR PLACE : ne bloquent que les deux
   AUTRES modes (livraison, boîte), jamais le sur place lui-même — plusieurs
   retraits en boutique peuvent partager le même créneau. */
function blockedSlotsPickup() {
  const s = catalog.settings || (catalog.settings = {});
  if (!Array.isArray(s.blocked_slots_pickup)) s.blocked_slots_pickup = [];
  return s.blocked_slots_pickup;
}
/* Fenêtres continues (30 min avant → 30 min après un créneau commandé, 1 h en
   tout) : indépendantes du réglage « créneaux par heure », donc elles
   bloquent bien tous les créneaux de cette heure quelle que soit la grille
   affichée — avant, un décalage basé sur ce réglage ne correspondait plus à
   la grille dès que le réglage changeait entre la commande et la consultation. */
function blockedWindows() {
  const s = catalog.settings || (catalog.settings = {});
  if (!Array.isArray(s.blocked_windows)) s.blocked_windows = [];
  return s.blocked_windows;
}
function isTimeInBlockedWindow(t) {
  // Bornes INCLUSES des deux côtés : un créneau posé pile sur la fin d'une
  // fenêtre serait sinon proposé alors qu'il touche encore le blocage.
  return blockedWindows().some(w => t >= new Date(w.start).getTime() && t <= new Date(w.end).getTime());
}
/* mode omis (ou 'pickup') : seuls les blocages globaux comptent (admin, ou une
   livraison/boîte déjà casée sur ce créneau). Pour 'delivery'/'mailbox', un
   retrait sur place posé sur ce créneau le bloque aussi. */
function isSlotBlocked(iso, mode) {
  mode = mode || 'pickup';
  if (blockedSlots().indexOf(iso) !== -1) return true;
  if (mode !== 'pickup' && blockedSlotsPickup().indexOf(iso) !== -1) return true;
  const t = new Date(iso).getTime();
  if (!isNaN(t) && isTimeInBlockedWindow(t)) return true;
  return false;
}
// On oublie les créneaux déjà passés pour ne pas gonfler le fichier
function pruneBlockedSlots() {
  const now = Date.now();
  catalog.settings.blocked_slots = blockedSlots().filter(x => new Date(x).getTime() > now - 86400000);
  catalog.settings.blocked_slots_pickup = blockedSlotsPickup().filter(x => new Date(x).getTime() > now - 86400000);
  catalog.settings.blocked_windows = blockedWindows().filter(w => new Date(w.end).getTime() > now - 86400000);
}
/* Blocage manuel d'un créneau depuis l'admin. Comme pour une livraison, on pose
   une fenêtre de 20 min de part et d'autre plutôt qu'un point isolé : le créneau
   voisin de chaque côté tombe donc aussi, quel que soit le pas de la grille. La
   fenêtre est marquée « manual » pour la distinguer de celles d'une commande —
   retoucher le créneau retire la fenêtre entière, alors qu'un créneau réservé
   par une commande ne se libère qu'en touchant la commande. */
function toggleBlockedSlot(iso) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return;
  const arr = blockedSlots();
  // Blocage ponctuel hérité (ancien format, ou pose « tout le jour ») : on le retire.
  const i = arr.indexOf(iso);
  if (i !== -1) { arr.splice(i, 1); pruneBlockedSlots(); saveCatalog(); render(); return; }
  const wins = blockedWindows();
  const wi = wins.findIndex(w => w.manual && t >= new Date(w.start).getTime() && t <= new Date(w.end).getTime());
  if (wi !== -1) { wins.splice(wi, 1); pruneBlockedSlots(); saveCatalog(); render(); showToast('Créneaux libérés'); return; }
  if (isTimeInBlockedWindow(t)) { showToast('Déjà bloqué par une commande'); return; }
  wins.push({
    start: new Date(t - BLOCK_AROUND_MIN * 60000).toISOString(),
    end: new Date(t + BLOCK_AROUND_MIN * 60000).toISOString(),
    manual: true,
  });
  pruneBlockedSlots();
  saveCatalog(); render();
}
/* Bloque d'un coup tous les créneaux ENCORE libres d'un jour (comme ❌️ sur
   chacun). */
function blockAllFreeSlotsForDay(dayLabel) {
  const day = availableSlotsAdmin().find(x => x.dayLabel === dayLabel);
  if (!day) return;
  const allArr = blockedSlots();
  let changed = false;
  day.slots.forEach(sl => {
    if (allArr.indexOf(sl.iso) === -1) { allArr.push(sl.iso); changed = true; }
  });
  if (changed) { pruneBlockedSlots(); saveCatalog(); render(); showToast('Créneaux libres bloqués ✓'); }
  else showToast('Rien à bloquer sur ce jour');
}
// Ne mémorise QUE les créneaux réellement ajoutés : une annulation ne débloquera
// jamais un créneau que le vendeur avait fermé lui-même.
/* --- Créneaux occupés par une commande validée ---------------------------
   Livraison ou boîte aux lettres : bloquent une fenêtre continue de 1 h (30 min
   avant → 30 min après le créneau retenu), pour TOUS les modes — le sur place
   doit alors attendre lui aussi que ce créneau se libère. Une fenêtre plutôt
   qu'un décalage en nombre de créneaux : ça bloque la bonne plage horaire quel
   que soit le réglage « créneaux par heure » au moment où on la consulte.
   Sur place : bloque uniquement SON créneau (aucun voisin), et seulement
   pour les deux autres modes ; d'autres retraits peuvent s'y ajouter. */
/* Marge bloquée de part et d'autre d'une livraison / boîte aux lettres. */
const BLOCK_AROUND_MIN = 20;
function applySlotBlock(o) {
  if (!o || o.slots_blocked || o.slots_blocked_window) return 0;
  if (o.delivery_mode === 'pickup') {
    if (!o.slot) return 0;
    const t = new Date(o.slot).getTime(); if (isNaN(t)) return 0;
    const iso = new Date(t).toISOString();
    const arr = blockedSlotsPickup(), added = [];
    if (arr.indexOf(iso) === -1) { arr.push(iso); added.push(iso); }
    o.slots_blocked = added;
    o.slots_blocked_pickup = true;
    if (added.length) { pruneBlockedSlots(); saveCatalog(); }
    return added.length;
  }
  if (o.delivery_mode !== 'delivery' && o.delivery_mode !== 'mailbox') return 0;
  if (!o.slot) return 0;
  const t = new Date(o.slot).getTime(); if (isNaN(t)) return 0;
  // 20 min avant et après l'heure exacte : juste de quoi neutraliser le créneau
  // voisin de chaque côté, et ce quel que soit le pas de la grille — 20 min
  // couvre pile le voisin en 3 créneaux/heure (bornes incluses), et n'en prend
  // qu'un seul de chaque côté en 4 créneaux/heure.
  const win = { start: new Date(t - BLOCK_AROUND_MIN * 60000).toISOString(), end: new Date(t + BLOCK_AROUND_MIN * 60000).toISOString() };
  blockedWindows().push(win);
  o.slots_blocked_window = win;
  o.slots_blocked_pickup = false;
  pruneBlockedSlots(); saveCatalog();
  return 1;
}
function releaseSlotBlock(o) {
  if (!o) return 0;
  let n = 0;
  if (o.slots_blocked && o.slots_blocked.length) {
    const key = o.slots_blocked_pickup ? 'blocked_slots_pickup' : 'blocked_slots';
    const set = new Set(o.slots_blocked);
    n += o.slots_blocked.length;
    catalog.settings[key] = (Array.isArray(catalog.settings[key]) ? catalog.settings[key] : []).filter(x => !set.has(x));
    o.slots_blocked = null; o.slots_blocked_pickup = false;
  }
  if (o.slots_blocked_window) {
    const w = o.slots_blocked_window;
    catalog.settings.blocked_windows = blockedWindows().filter(x => !(x.start === w.start && x.end === w.end));
    o.slots_blocked_window = null;
    n += 1;
  }
  if (n) saveCatalog();
  return n;
}
function availableSlots(forDelivery, maxDays, mode, opts) {
  const s = catalog.settings;
  const per = s.slots_per_hour || 3;
  const advMin = advanceMinutesFor(mode || (forDelivery ? 'delivery' : 'pickup'));
  const earliest = new Date(Date.now() + advMin * 60 * 1000);
  const limit = maxDays || 4;
  // Heure limite du jour même dépassée : la journée en cours (service de
  // nuit compris) n'est plus proposée, on commence au lendemain.
  const sauteAujourdhui = !(opts && opts.ignoreCutoff) && pastSameDayCutoff();
  const out = [];
  for (let d = 0; d < 10; d++) {
    if (d === 0 && sauteAujourdhui) continue;
    const day = new Date(); day.setDate(day.getDate() + d); day.setHours(0, 0, 0, 0);
    const dh = (s.hours || {})[day.getDay()];
    if (!dh || !dh.open) continue;
    if (forDelivery && dh.no_delivery) continue;
    const [sh, sm] = dh.start.split(':').map(Number);
    const [eh] = dh.end.split(':').map(Number);
    // Fermeture après minuit (ex: 02:00) : l'heure de fin appartient au jour suivant
    const endH = eh <= sh ? eh + 24 : eh;
    const daySlots = [];
    for (let hr = sh; hr < endH; hr++) {
      for (let k = 0; k < per; k++) {
        const mins = Math.round((k / per) * 60);
        const dt = new Date(day); dt.setHours(hr, mins, 0, 0);
        if (dt < earliest) continue;
        const label = String(hr % 24).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
        const iso = dt.toISOString();
        if (isSlotBlocked(iso, mode)) continue;   // créneau marqué indisponible (selon le mode)
        daySlots.push({ iso: iso, label });
      }
    }
    if (daySlots.length) out.push({ dayLabel: DAY_NAMES[day.getDay()] + ' ' + day.getDate() + '/' + (day.getMonth() + 1), slots: daySlots });
    if (out.length >= limit) break;
  }
  return out;
}
function slotLabel(iso) { if (!iso) return ''; const d = new Date(iso); return DAY_NAMES[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + ' à ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

/* ===== TELEGRAM ===== */
/* Prêt à notifier : soit par le relais (qui détient token et destinataires),
   soit en direct avec token + chat ID dans le fichier. */
function tgReady() { const s = catalog.settings || {}; return !!(relayUrl() || ((s.telegram_token || '').trim() && (s.telegram_chat_id || '').trim())); }
/* Vrai quand le token réglé ici diffère de celui gravé dans le fichier déployé.
   Le portail d'entrée n'utilise QUE celui du fichier : tant que l'export n'est
   pas refait, changer le token ici laisse les notifications d'entrée muettes. */
function tokenDesync() {
  const ici = ((catalog.settings || {}).telegram_token || '').trim();
  const fichier = ((EMBEDDED.settings || {}).telegram_token || '').trim();
  return !!(ici && fichier && ici !== fichier);
}
function stockChatId() { const s = catalog.settings || {}; return (s.telegram_chat_id_stock || '').trim() || (s.telegram_chat_id || '').trim(); }
function stockTgReady() { return !!(relayUrl() || ((catalog.settings.telegram_token || '').trim() && stockChatId())); }

/* Relais : quand il est configuré, le token ne vit plus dans ce fichier — donc
   plus dans la page servie aux visiteurs. L'appli n'envoie que le texte, le
   relais y ajoute le token côté serveur. Sans relais, on garde l'envoi direct :
   rien ne change tant que le champ est vide. */
function relayUrl() { return String((catalog.settings || {}).relay_url || '').trim().replace(/\/+$/, ''); }
function relayKey() { return String((catalog.settings || {}).relay_key || '').trim(); }
/* Destination symbolique : le relais résout « seller » et « stock » lui-même,
   ces identifiants n'ont donc plus à figurer dans le fichier publié. Un chat de
   client, lui, reste transmis tel quel — il vient de la commande. */
function relayTarget(chatId) {
  const s = catalog.settings || {};
  const v = String(chatId == null ? '' : chatId).trim();
  if (!v || v === String(s.telegram_chat_id || '').trim()) return 'seller';
  if (v === String(s.telegram_chat_id_stock || '').trim()) return 'stock';
  return v;
}
async function sendTelegram(text, chatId, extra) {
  const s = catalog.settings;
  const url = relayUrl();
  if (url) {
    const payload = Object.assign({ key: relayKey(), to: relayTarget(chatId), text }, extra || {});
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.ok) throw new Error((data && data.description) || 'relais HTTP ' + res.status);
    return;
  }
  // chatId peut être un NOMBRE (id Telegram du client) → String() avant trim(),
  // sinon Number.trim n'existe pas et l'envoi échoue silencieusement.
  const target = String(chatId || s.telegram_chat_id || '').trim();
  const body = Object.assign({ chat_id: target, text }, extra || {});
  const res = await fetch('https://api.telegram.org/bot' + s.telegram_token.trim() + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || !data.ok) throw new Error((data && data.description) || 'HTTP ' + res.status);
}

/* Lien profond « Ajouter à mon appli » : encode la commande (base64url) dans un
   bouton-lien du message Telegram. Un bouton URL n'exige AUCUN serveur (au
   contraire d'un bouton callback). En le touchant, l'admin ouvre l'app qui
   importe la commande dans son historique local — puis il peut la gérer/exporter.
   La photo de boîte aux lettres (data URI lourd) est retirée du lien. */
function b64urlEncode(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function appBaseUrl() { return location.href.split('#')[0].split('?')[0]; }
/* Le lien doit rester court : Telegram refuse les boutons dont l'URL dépasse
   ~2000 caractères, et le message perdait alors TOUS ses boutons. On encode donc
   la commande avec des clés courtes, en omettant les champs vides. */
const LINK_O = { id:'i', created_at:'c', total:'t', status:'s', guest_id:'g', customer_name:'cn', phone:'ph', telegram_id:'tg', tg_username:'tu', address:'a', notes:'no', delivery_mode:'dm', slot:'sl', mailbox_photo:'mp', promo_code:'pc', loyalty_used:'lu', loyalty_earned:'le', tg_chat_id:'ci', loyalty_advance:'la' };
const LINK_I = { product_id:'i', name:'n', quantity:'q', variant_label:'v', price:'p', free:'f', units:'u', diluent:'d', diluents:'dl', custom:'cu', mixId:'m' };
function orderForLink(o) {
  const c = {};
  Object.keys(LINK_O).forEach(k => {
    let v = o[k];
    if (k === 'mailbox_photo' && typeof v === 'string') v = true;
    if (v === undefined || v === null || v === '' || v === false || v === 0) return;
    c[LINK_O[k]] = v;
  });
  // Les parts d'un même mix gardent leur regroupement, sous un simple numéro
  const mixNo = {};
  c.it = (o.items || []).map(it => {
    const x = {};
    Object.keys(LINK_I).forEach(k => {
      const v = it[k];
      if (v === undefined || v === null || v === '' || v === false) return;
      x[LINK_I[k]] = v;
    });
    if (it.mixId) x.m = mixNo[it.mixId] || (mixNo[it.mixId] = Object.keys(mixNo).length + 1);
    return x;
  });
  return c;
}
/* Relit un lien compact (et reste compatible avec l'ancien format complet) */
function orderFromLink(raw) {
  if (!raw || typeof raw !== 'object') return raw;
  if (Array.isArray(raw.items)) return raw;          // ancien format
  if (!Array.isArray(raw.it)) return raw;
  const o = {};
  Object.keys(LINK_O).forEach(k => { const v = raw[LINK_O[k]]; if (v !== undefined) o[k] = v; });
  o.items = raw.it.map(x => { const it = {}; Object.keys(LINK_I).forEach(k => { const v = x[LINK_I[k]]; if (v !== undefined) it[k] = v; }); if (it.mixId != null) it.mixId = 'mix_' + (o.id || '') + '_' + it.mixId; return it; });
  if (!o.status) o.status = 'preparation';
  return o;
}
// Commande passée en paramètre de requête (?order=…) : préservé par Telegram
// même quand il ouvre en Mini App (il ajoute ses données dans le #, pas le ?).
function orderDeepLink(o, action) { try { return appBaseUrl() + '?order=' + b64urlEncode(JSON.stringify(orderForLink(o))) + (action ? '&action=' + action : ''); } catch (e) { return null; } }

/* Identifiant Telegram du client : quand la page est ouverte en Mini App,
   Telegram place ses données d'init dans le hash (#tgWebAppData=…). On y lit
   user.id (= chat_id du client auprès du bot) et on le mémorise sur l'appareil.
   Il voyage ensuite avec chaque commande (tg_chat_id) pour pouvoir notifier
   CE client quand sa commande est validée. */
function captureTgUserId() {
  try {
    // 1) Source la plus fiable : le SDK Telegram (initDataUnsafe). Résiste au fait
    //    que le SDK nettoie parfois le hash de l'URL.
    const wa = window.Telegram && window.Telegram.WebApp;
    const su = wa && wa.initDataUnsafe && wa.initDataUnsafe.user;
    if (su && su.id) { store('cave420_tg_uid', su.id); if (su.username) store('cave420_tg_username', su.username); return; }
    // 2) Repli : lecture manuelle du hash #tgWebAppData=…
    const m = (location.hash || '').match(/tgWebAppData=([^&]+)/);
    if (!m) return;
    const q = decodeURIComponent(m[1]);
    const um = q.match(/(?:^|&)user=([^&]+)/);
    if (!um) return;
    const u = JSON.parse(decodeURIComponent(um[1]));
    if (u && u.id) { store('cave420_tg_uid', u.id); if (u.username) store('cave420_tg_username', u.username); }
  } catch (e) {}
}
/* Demande au client l'autorisation de recevoir des messages du bot (popup native
   Telegram). Sans ça, un bot ne peut PAS écrire à quelqu'un qui n'a jamais démarré
   la conversation. Appelé au moment de valider le panier. Ne bloque jamais la
   commande : si refus, indisponible ou pas de réponse (8 s), on continue. */
function requestTgWriteAccess() {
  return new Promise(resolve => {
    try {
      const wa = window.Telegram && window.Telegram.WebApp;
      if (!wa || typeof wa.requestWriteAccess !== 'function') return resolve(false);
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(!!v); } };
      wa.requestWriteAccess(finish);
      setTimeout(() => finish(false), 8000);
    } catch (e) { resolve(false); }
  });
}
function tgUserId() { return loadJSON('cave420_tg_uid', null); }
function tgUsername() { return loadJSON('cave420_tg_username', null); }
/* Petit accusé de réception dans le chat du CLIENT après un bouton du bot
   (annuler, réponse créneau, mise à jour suite à une action du vendeur…) :
   la mini-app se referme souvent sans que le toast affiché ait le temps
   d'être vu, donc un message séparé confirme que ça a bien été pris en compte. */
function sendClientActionConfirmation(emoji) {
  try {
    const chat = tgUserId();
    if (chat && tgReady()) sendTelegram(emoji || '✅️', chat).catch(e => console.error('accusé client:', e));
  } catch (e) {}
}

function orderMessage(o) {
  const L = [];
  L.push('🛒 Nouvelle commande #' + String(o.id).slice(-6).toUpperCase());
  // Identité allégée : un seul pseudo (saisi/authentifié) + tél si fourni ; le @
  // Telegram public n'est ajouté que s'il a été capté ET qu'il diffère du pseudo.
  const pseudo = o.telegram_id || o.customer_name || o.guest_id || 'inconnu';
  L.push('👤 ' + pseudo + (o.phone ? ' — 📞 ' + o.phone : ''));
  const uname = o.tg_username ? '@' + o.tg_username : '';
  if (uname && uname.toLowerCase() !== String(pseudo).toLowerCase()) L.push('✅ Telegram : ' + uname);
  const mode = { pickup: '🏪 Retrait en boutique', delivery: '🚗 Livraison', mailbox: '📬 Boîte aux lettres' }[o.delivery_mode];
  L.push(mode + (o.delivery_mode !== 'pickup' && o.address ? ' — ' + o.address : ''));
  if (o.slot) L.push('🕐 Créneau : ' + slotLabel(o.slot));
  else if (o.no_preference) L.push('🤷 Aucune préférence d\'horaire' + (o.after_cutoff ? ' — pour demain au plus tôt (commande passée après ' + fmtHourShort(sameDayCutoff() || '18:00') + ')' : ''));
  if (o.delivery_mode === 'mailbox') L.push('📸 Preuve de dépôt jointe par le client');
  L.push('');
  o.items.forEach(i => { L.push('• ' + i.quantity + '× ' + i.name + (i.variant_label ? ' (' + i.variant_label + ')' : '') + (i.diluent ? ' + ' + i.diluent : '') + (i.free ? ' 🎁 OFFERT' : ' — ' + fmt(i.price * i.quantity))); });

async function sendOrderNotification(order) {
  const text = orderMessage(order);
  const link = orderDeepLink(order);
  if (!link || !/^https?:\/\//.test(link) || link.length > 2000) { await sendTelegram(text); return; }
  // Un seul bouton : importer la commande dans l'appli. La validation et
  // l'annulation se font ensuite depuis la page Commandes.
  const btn = (label, url, kind) => kind === 'web_app' ? { text: label, web_app: { url } } : { text: label, url };
  const rows = kind => [[btn('📲 Ajouter à mon appli', link, kind)]];
  // 1) Boutons Mini App (web_app) : ouvrent le site DANS la mini-app (même contexte
  //    que l'app principale → la commande importée atterrit au même endroit).
  try {
    await sendTelegram(text, null, { reply_markup: { inline_keyboard: rows('web_app') } });
    return;
  } catch (e) {
    // Telegram refuse parfois un bouton web_app envoyé côté client → repli sur des
    // boutons-liens classiques (navigateur intégré), puis message sans bouton. On
    // garde la raison exacte du refus sur la commande pour pouvoir diagnostiquer
    // (sinon ce basculement est invisible : le message part quand même, avec un
    // bouton qui marche, juste pas dans la mini-app).
    order.web_app_fallback = String((e && e.message) || e || '').slice(0, 300);
    try {
      await sendTelegram(text, null, { reply_markup: { inline_keyboard: rows('url') } });
      return;
    } catch (e2) { await sendTelegram(text); }
  }
}

function orderEditForLink(req) {
  const c = {};
  ['delivery_mode', 'address', 'notes', 'slot', 'no_preference', 'total'].forEach(k => {
    const v = req[k];
    if (v === undefined || v === null || v === '' || v === false || v === 0) return;
    c[k] = v;
  });
  c.items = (req.items || []).map(it => {
    const x = {};
    Object.keys(LINK_I).forEach(k => { const v = it[k]; if (v === undefined || v === null || v === '' || v === false) return; x[LINK_I[k]] = v; });
    return x;
  });
  return c;
}
function orderEditFromLink(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const req = {};
  ['delivery_mode', 'address', 'notes', 'slot', 'no_preference', 'total'].forEach(k => { if (raw[k] !== undefined) req[k] = raw[k]; });
  req.items = (raw.items || []).map(x => { const it = {}; Object.keys(LINK_I).forEach(k => { const v = x[LINK_I[k]]; if (v !== undefined) it[k] = v; }); return it; });
  return req;
}

/* Solde minimum pour utiliser la cagnotte. Le bouton reste toujours visible dans

/* ===== DRAG & DROP ===== */
let dragData = null;

function handleDragStart(e, type, index) {
  dragData = { type, index };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', type + '|' + index);
  e.target.closest('.prod-row, .cat-row')?.classList.add('dragging');
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const targetRow = e.target.closest('.prod-row, .cat-row');
  if (targetRow) targetRow.classList.add('drag-over');
}
function handleDragLeave(e) {
  const targetRow = e.target.closest('.prod-row, .cat-row');
  if (targetRow) targetRow.classList.remove('drag-over');
}
function handleDrop(e, type, targetIndex) {
  e.preventDefault();
  const targetRow = e.target.closest('.prod-row, .cat-row');
  if (targetRow) targetRow.classList.remove('drag-over');
  if (!dragData) return;
  if (dragData.type !== type) return;
  if (dragData.index === targetIndex) { dragData = null; return; }
  // Réorganiser le tableau
  const arr = type === 'product' ? catalog.products : catalog.categories;
  const [moved] = arr.splice(dragData.index, 1);
  arr.splice(targetIndex, 0, moved);
  saveCatalog();
  // Mise à jour des vues
  if (type === 'product') state.adminView = 'products';
  else state.adminView = 'categories';
  render();
  dragData = null;
}
function handleDragEnd(e) {
  e.target.closest('.prod-row, .cat-row')?.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragData = null;
}

/* ===== DUPLICATION ===== */
function duplicateProduct(id) {
  const idx = catalog.products.findIndex(p => p.id === id);
  if (idx === -1) return;
  const orig = catalog.products[idx];
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  copy.name = 'Copie de ' + orig.name;
  copy.created_at = Date.now(); // une copie est un nouveau produit, pas l'original
  catalog.products.splice(idx + 1, 0, copy);
  saveCatalog();
  render();
  showToast('Produit dupliqué ✓');
}
function duplicateCategory(id) {
  const idx = catalog.categories.findIndex(c => c.id === id);
  if (idx === -1) return;
  const orig = catalog.categories[idx];
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  copy.name = 'Copie de ' + orig.name;
  catalog.categories.splice(idx + 1, 0, copy);
  saveCatalog();
  render();
  showToast('Catégorie dupliquée ✓');
}

/* ===== SUPPRESSION EN MASSE DES COMMANDES ===== */
function deleteSelectedOrders() {
  if (state.selectedOrders.length === 0) { showToast('Aucune commande sélectionnée'); return; }
  if (!confirm('Supprimer définitivement les ' + state.selectedOrders.length + ' commandes sélectionnées ?')) return;
  const list = loadJSON('cave420_orders', []);
  const idsToDelete = new Set(state.selectedOrders);
  // Suppression PURE : on retire simplement les commandes de l'historique. Ce
  // n'est pas une annulation → on ne restitue NI le stock NI la cagnotte.
  const remaining = Array.isArray(list) ? list.filter(o => !idsToDelete.has(o.id)) : [];
  store('cave420_orders', remaining);
  // Comme pour la suppression depuis l'archive : on bloque leur réimport tant
  // que le fichier déployé les liste encore dans orders-data (sinon elles
  // reviennent au rechargement suivant, avant tout redéploiement).
  const inOrders = embeddedOrderIds();
  store('cave420_archive_removed', [...new Set(archiveRemovedIds().map(String).concat([...idsToDelete].map(String)))].filter(k => inOrders.has(k)));
  state.selectedOrders = [];
  loadOrders();
  showToast('Commandes supprimées ✓');
}
function toggleOrderSelection(id) {
  const idx = state.selectedOrders.indexOf(id);
  if (idx >= 0) state.selectedOrders.splice(idx, 1);
  else state.selectedOrders.push(id);
  render();
}
function toggleAllOrders(checked) {
  if (checked) {
    state.selectedOrders = visibleOrders().map(o => o.id);
  } else {
    state.selectedOrders = [];
  }
  render();
}

/* ===== RENDER ===== */

/* Déconnexion : après confirmation, on oublie le pseudo mémorisé et on ferme

   tout seul et refait entrer directement. */
function logoutSession() {
  const pseudo = String(window.__sessionPseudo || '').trim();
  const auto = pseudo.startsWith('@');
  const msg = auto
    ? `Se déconnecter et fermer l'appli ?\n\nTu es entré avec ton pseudo Telegram ${pseudo} : à la réouverture, tu seras reconnu automatiquement.`
    : `Se déconnecter et fermer l'appli ?${pseudo ? `\n\nÀ la réouverture, il faudra ressaisir ton pseudo (${pseudo}).` : ''}`;
  if (!confirm(msg)) return;
  try { localStorage.removeItem('cave420_gate_auth'); } catch (e) {}
  window.__sessionPseudo = '';

  try { window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); } catch (e) {}

  if (!ferme) location.reload();
}

/* Accueil : UN seul choix parmi les catégories, les filtres ❤️ % 🆕 🔜 et les

   10 g, Nouveautés) se combine avec lui. state.sortKeys et state.sortProv
   contiennent donc chacun au plus un élément. dir 1 = valeur croissante. */
const SORT_DEFS = {
  prix: { label: 'Prix', dir: 1, asc: "les moins chers d'abord", desc: "les plus chers d'abord" },
  prix10: { label: 'Prix pour 10 g', dir: 1, asc: "les 10 g les moins chers d'abord", desc: "les 10 g les plus chers d'abord" },

   mise en rayon, sinon création. */
function sortVal(p, k) {
  if (k === 'prix') return bestUnitPrice(p);
  if (k === 'prix10') { const t = shown10g(p); return t ? t.v.price : null; }
  return newBadgeSince(p) || 0;

function applySorts(list) {
  const tri = state.sortKeys[0];
  if (!tri) return list.sort((a, b) => productRank(a) - productRank(b));
  const vals = new Map(list.map(p => [p, sortVal(p, tri.k)]));
  return list.sort((a, b) => {
    // Les ruptures restent en bas, quel que soit le tri.
    const ra = inStock(a) ? 0 : 1, rb = inStock(b) ? 0 : 1;
    if (ra !== rb) return ra - rb;
    const va = vals.get(a), vb = vals.get(b);
    if (va !== vb) {
      if (va === null) return 1;
      if (vb === null) return -1;
      return (va - vb) * tri.dir;
    }
    return productRank(a) - productRank(b);
  });
}
/* Provenances proposées : celles des articles des cases cochées, plus

   après chaque rendu : cocher une provenance raccourcit la liste derrière et
   peut déplacer le bouton. */

  const menu = document.querySelector('.sort-menu');

  if (!menu || !btn) return;
  const r = btn.getBoundingClientRect();
  const vh = window.innerHeight, vw = document.documentElement.clientWidth || window.innerWidth;
  const below = vh - r.bottom - 18, above = r.top - 18;
  menu.style.right = Math.max(8, Math.round(vw - r.right)) + 'px';
  if (below >= 340 || below >= above) { menu.style.top = Math.round(r.bottom + 6) + 'px'; menu.style.bottom = ''; menu.style.maxHeight = Math.round(below) + 'px'; }
  else { menu.style.bottom = Math.round(vh - r.top + 6) + 'px'; menu.style.top = ''; menu.style.maxHeight = Math.round(above) + 'px'; }

/* ===== MONTANT PRÉCIS DÉSIRÉ =====
   Le client saisit n'importe quelle somme (à partir de 1 €). La quantité est
   calculée au tarif du palier dont le prix est le PLUS PROCHE EN DESSOUS de
   cette somme (jamais un palier plus cher). Ex. paliers 10€/1g, 20€/2g, 50€/6g…
   → 30 € retombe sur le palier 20€/2g, soit 10 €/g, donc 3 g.
   SOUS le plus petit palier, c'est le « Prix min. » de la fiche article qui sert
   de tarif de référence (prix par unité) ; s'il n'est pas renseigné, on garde le
   tarif du plus petit palier. */

function parseWholeEuros(s) {
  // On ne garde que les chiffres du DÉBUT : « 12,5 » vaut 12 € (la partie
  // décimale est ignorée, pas recollée — sinon 12,5 deviendrait 125 €).
  const digits = (String(s || '').trim().match(/^\d*/) || [''])[0];
  if (!digits) return null;
  const n = parseInt(digits, 10);
  return isNaN(n) || n <= 0 ? null : n * 100;

  const vs = (p.variants || []).filter(v => v && v.price > 0);
  if (!vs.length) return p.price > 0 ? { price: p.price, units: 1 } : null;
  const sorted = vs.slice().sort((a, b) => a.price - b.price);
  let tier = sorted[0];
  sorted.forEach(v => { if (v.price <= amountCents) tier = v; });

  const smallest = vs.length ? vs.slice().sort((a, b) => a.price - b.price)[0] : null;

   premier montant accepté. 0 = plus rien de possible. */

  const vs = (p.variants || []).filter(v => v && v.price > 0).sort((a, b) => a.price - b.price);

  vs.forEach((v, i) => {
    const u = variantUnits(v), tarif = v.price / u;
    let stock = Math.max(0, rem);

/* Après chaque affichage : un logo qui toucherait le nom, le prix ou un
   bouton de la carte est masqué — seuls restent ceux posés dans le vide. */
/* % des cartes : noir, ou blanc quand la photo est sombre dessous. La
   luminosité est mesurée une fois par photo et par vue (grille / liste),
   puis gardée : les rendus suivants posent la bonne couleur d'emblée. */
const _fondPromo = new Map();
function marquerFondsPromo(root) {
  (root || document).querySelectorAll('.product-card .badge-round.b-promo').forEach(badge => {
    const wrap = badge.closest('.img-wrap'); const img = wrap && wrap.querySelector('img');
    if (!img) return;
    const cle = img.getAttribute('src') + (badge.closest('.list-view') ? '|liste' : '|grille');
    if (_fondPromo.has(cle)) { badge.classList.toggle('sur-sombre', _fondPromo.get(cle)); return; }
    const mesurer = () => { const sombre = fondSombreSous(img, badge); if (sombre === null) return; _fondPromo.set(cle, sombre); badge.classList.toggle('sur-sombre', sombre); };
    if (img.complete && img.naturalWidth) mesurer(); else img.addEventListener('load', mesurer, { once: true });
  });
}
/* Luminance moyenne de la photo sous le % (object-fit: cover). Sombre =
   le blanc y contraste mieux que le noir. */
function fondSombreSous(img, badge) {
  try {
    const ir = img.getBoundingClientRect(), br = badge.getBoundingClientRect();
    if (!ir.width || !ir.height || !img.naturalWidth || !img.naturalHeight) return null;
    const sc = Math.max(ir.width / img.naturalWidth, ir.height / img.naturalHeight);
    const ox = (ir.width - img.naturalWidth * sc) / 2, oy = (ir.height - img.naturalHeight * sc) / 2;
    const c = document.createElement('canvas'); c.width = 8; c.height = 8;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, (br.left - ir.left - ox) / sc, (br.top - ir.top - oy) / sc, br.width / sc, br.height / sc, 0, 0, 8, 8);
    const d = x.getImageData(0, 0, 8, 8).data;
    const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    let y = 0;
    for (let i = 0; i < d.length; i += 4) y += 0.2126 * lin(d[i]) + 0.7152 * lin(d[i + 1]) + 0.0722 * lin(d[i + 2]);
    return y / 64 < 0.18;
  } catch (e) { return null; }
}
/* Ligne du bas des cartes : tout est écrit en entier (« Plus que 3 g »,
   « 10g · 90€ ») tant que ça tient. Sinon, dans l'ordre : espacements
   resserrés, cadre jaune réduit au prix, texte des cadres un rien plus
   petit, 📷 et 🎥 remontés d'un cran — et
   « Plus que » ne disparaît qu'en tout dernier recours, pour qu'on ne lise
   jamais un « 3 g » ambigu tant qu'il y a moyen de l'éviter. */
/* 💰 de la bannière cagnotte : le plus gros possible (24 px max) dans l'espace
   libre, sur 1 à 3 lignes ; plus petits quand la place manque. */
function ajusterSacs(root) {
  const libre = (root || document).querySelector('.loyalty-gauge .lg-libre');
  if (libre) { libre.style.visibility = ''; if (libre.scrollWidth > libre.clientWidth + 1) libre.style.visibility = 'hidden'; }
  const el = (root || document).querySelector('.lb-sacs'); if (!el) return;
  const n = el.children.length, w = el.clientWidth, h = el.clientHeight;
  let best = { s: 0, cols: n };
  for (let rows = 1; rows <= 3; rows++) {
    const cols = Math.ceil(n / rows);
    const s = Math.min(24, w / (cols * 1.2), h / (rows * 1.15));
    if (s > best.s + 0.5) best = { s, cols };
  }
  el.style.fontSize = Math.floor(best.s) + 'px';
  el.style.gridTemplateColumns = `repeat(${best.cols}, auto)`;
  // La largeur réelle d'un emoji varie selon le téléphone : on mesure et on
  // réduit si la rangée dépasse (sinon elle déborderait sur le montant).
  const cw = el.firstElementChild ? el.firstElementChild.getBoundingClientRect().width : 0;
  const besoin = best.cols * cw + (best.cols - 1);
  if (cw && besoin > w) best.s = Math.floor(best.s * w / besoin);
  el.style.fontSize = Math.floor(best.s) + 'px';
  el.style.visibility = best.s < 7 ? 'hidden' : '';
}
function ajusterBarres(root) {
  const r = root || document;
  r.querySelectorAll('.products .corner-bar').forEach(bar => {
    bar.classList.remove('compact', 'court', 'mini', 'serre', 'sans-pq');
    const deborde = () => bar.scrollWidth > bar.clientWidth + 1;
    const etapes = [['compact', true], ['court', !!bar.querySelector('.p10-lbl')], ['mini', true], ['serre', !!bar.querySelector('.media-dot')], ['sans-pq', !!bar.querySelector('.msgs-grille .pq-lbl')]];
    for (const [cls, utile] of etapes) {
      if (!deborde()) return;
      if (utile) bar.classList.add(cls);
    }
  });
  // Vue liste : « Plus que » reste tant que le cadre tient dans la vignette
  // (sur la ligne des logos s'il y a la place, sinon juste dessous), au
  // besoin un peu resserré.
  r.querySelectorAll('.products.list-view .top-bar').forEach(tb => {
    tb.classList.remove('compact', 'sans-pq');
    const msgs = tb.querySelector('.msgs-liste');
    if (!msgs || !msgs.querySelector('.pq-lbl')) return;
    const deborde = () => msgs.getBoundingClientRect().right > tb.getBoundingClientRect().right + 0.5;
    if (deborde()) tb.classList.add('compact');
    if (deborde()) tb.classList.add('sans-pq');

  const alcEntries = Object.keys(f.alcoholCounts || {}).filter(k => f.alcoholCounts[k] > 0).map(k => ({ n: k, q: f.alcoholCounts[k] }));
  const alcParts = alcEntries.map(e => (needed > 1 ? e.q + '× ' : '') + e.n);

  if (addToCart(f.product, f.variant, f.qty, label, false, null, null, entries)) { state.diluentFlow = null; }
  render();
}

/* Lignes du panier : les parts d'un même mix (même mixId, posé par confirmMix)

function renderCartItems() {

    }
    const total = g.parts.reduce((s, p) => s + (p.price || 0) * (p.quantity || 1), 0);
    const lines = g.parts.map(p => `<div class="mix-part"><span class="mix-part-nom">${esc(p.name)} — ${esc(p.variant_label || '')}</span><span>${fmt(p.price * p.quantity)}</span><button class="mix-part-x" data-action="remove-mix-part" data-idx="${state.cart.indexOf(p)}" aria-label="Retirer ${esc(p.name)} du mix">✕</button></div>`).join('');
    return `<div class="cart-item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;align-items:center"><div class="item-name">🔄 Mix (${g.parts.length} produits)</div><div class="item-price">${fmt(total)}</div></div>

    </div>`;

}

/* Une ligne d'article offert (image, nom/format, prix, +/-). */
function renderLoyaltyOptionRow(opt) {

/* Montant sur mesure en cagnotte : même mécanique que le montant sur mesure
   payant (customQtyFor/customRateFor), mais plafonné par ce qu'il reste sur
   la cagnotte plutôt que par le porte-monnaie. Un article ajouté ainsi
   n'est pas une « unité » comme les formats fixes : chaque clic sur
   « Ajouter » enregistre une ligne à part, listée et supprimable ci-dessous. */
function loyaltyCustomEligible(p) { return !!(p && p.variants && p.variants.length && !categoryBlocksCustomAmount(p)); }
/* Catégories dont les articles offerts se prennent UNIQUEMENT au montant sur
   demande : pas de formats fixes. Les extractions ont des formats qui
   dépassaient presque tous le plafond d'un article offert (20 €, puis 30 €) — le Rosin ne
   s'affichait donc jamais — et un montant libre colle mieux à leur prix au
   gramme. */
const LOYALTY_CUSTOM_ONLY_CATS = ['extractions'];
function loyaltyCustomOnly(p) {
  const cat = p && catalog.categories.find(c => c.id === p.category_id);
  return !!(cat && LOYALTY_CUSTOM_ONLY_CATS.indexOf(String(cat.name || '').trim().toLowerCase()) !== -1);
}
// Article au montant sur demande seulement : dans la liste s'il a du stock.
function loyaltyCustomOnlyAvailable(p) { return loyaltyCustomOnly(p) && loyaltyCustomEligible(p) && inStock(p) && remainingPool(p) > 0; }
function renderLoyaltyCustomOnlyRow(lp, p) {
  const picked = (state.loyaltyCustomPicks || []).filter(c => c.id === lp.id).length;
  const remaining = usableLoyaltyBalance() - loyaltyPicksTotal();
  const head = `<div class="loyalty-pick${remaining < customMinPrice(p) && !picked ? ' loyalty-unaffordable' : ''}" style="border-bottom:none;padding-bottom:0"><div style="display:flex;align-items:center;gap:10px"><img src="${esc(thumbSrc(lp.image || p.image) || PLACEHOLDER_IMG)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover" alt=""><div><div style="font-weight:600;font-size:14px">${esc(loyaltyName(lp))}${picked ? ` <span style="font-weight:400;color:var(--success)">— ${picked} choisi(s)</span>` : ''}</div><div style="font-size:12px;color:var(--muted)">🎯 Montant sur demande</div>${productTags(p) ? `<div class="tag-row">${productTags(p)}</div>` : ''}</div></div></div>`;
  return head + renderLoyaltyCustomRow(lp, p);
}
function renderLoyaltyCustomRow(lp, p) {
  const remaining = usableLoyaltyBalance() - loyaltyPicksTotal();
  const min = customMinPrice(p);
  const mine = (state.loyaltyCustomPicks || []).map((c, i) => ({ c, i })).filter(x => x.c.id === lp.id);
  const unit = p.stock_unit || 'g';
  const lines = mine.map(({ c, i }) => `<div class="loyalty-pick" style="padding:8px 0"><span>🎯 ${fmtQty2(c.qty, unit)} — ${fmt(c.amount)}</span><button class="qty-btn" data-action="loyalty-custom-remove" data-idx="${i}" style="margin-left:auto">×</button></div>`).join('');
  const maxHint = remaining > 0 ? `De ${fmt(min)} à ${fmt(Math.min(loyaltyMaxPrice(p), remaining))} (restant)` : `Cagnotte insuffisante`;
  return `<div class="custom-amount" style="margin-top:8px"><div class="ca-row"><input type="text" inputmode="numeric" pattern="[0-9]*" id="loyalty-custom-input-${esc(lp.id)}" placeholder="Montant désiré" aria-label="Montant désiré" ${remaining <= 0 ? 'disabled' : ''}><span class="ca-eur">€</span><button class="btn btn-secondary ca-add" data-action="loyalty-custom-add" data-id="${esc(lp.id)}" ${remaining <= 0 ? 'disabled' : ''}>Ajouter</button></div><span class="ca-hint">${maxHint}</span>${lines}</div>`;

function renderLoyaltyPicker() {
  const picks = state.loyaltyPicks;
  const lps = catalog.loyalty_products || [];
  const used = loyaltyPicksTotal();
  const usable = usableLoyaltyBalance();
  const remaining = Math.max(0, usable - used);
  // Un seul article par produit dans la liste (même s'il a plusieurs formats) :
  // on la déplie au clic pour choisir le format, comme la modale Horaires.
  const groups = lps.map(lp => {
    const p = catalog.products.find(x => x.id === lp.id);
    // Extractions : formats jusqu'à 30 € comme les autres, et si aucun format
    // ne passe sous le plafond (Rosin), le montant sur demande seul.
    const opts = loyaltyLineOptions(lp);
    if (loyaltyCustomOnly(p) && !opts.length) return { lp, opts: [], customOnly: loyaltyCustomOnlyAvailable(p) };
    return { lp, opts };
  }).filter(g => g.opts.length || g.customOnly);
  // Ordre : d'abord ce que la cagnotte permet de prendre (sur son montant total,
  // pour que la liste ne bouge pas pendant qu'on choisit), puis par prix du plus
  // petit format, puis comme sur l'accueil (promo/populaire en haut, à venir en
  // bas, ordre du catalogue).
  const ordreAccueil = new Map(catalog.products.map((p, i) => [p.id, i]));
  const cle = g => {
    const p = catalog.products.find(x => x.id === g.lp.id);
    const prix = g.opts.length ? Math.min(...g.opts.map(o => o.price)) : (p ? customMinPrice(p) : Infinity);
    return { dispo: prix <= usable ? 0 : 1, prix, rang: p ? productRank(p) : 9, idx: ordreAccueil.has(g.lp.id) ? ordreAccueil.get(g.lp.id) : 1e9 };
  };
  const cles = new Map(groups.map(g => [g, cle(g)]));
  groups.sort((a, b) => { const x = cles.get(a), y = cles.get(b); return x.dispo - y.dispo || x.prix - y.prix || x.rang - y.rang || x.idx - y.idx; });
  const groupsHtml = groups.map(g => {
    const p = catalog.products.find(x => x.id === g.lp.id);
    if (g.customOnly) return renderLoyaltyCustomOnlyRow(g.lp, p);
    const customRow = loyaltyCustomEligible(p) ? renderLoyaltyCustomRow(g.lp, p) : '';
    if (g.opts.length === 1) return renderLoyaltyOptionRow(g.opts[0]) + customRow;
    const isOpen = state.loyaltyGroupOpen === g.lp.id;
    const picked = g.opts.reduce((s, o) => s + picks.filter(x => x === o.key).length, 0);
    const minPrice = Math.min(...g.opts.map(o => o.price));
    const groupRemaining = usableLoyaltyBalance() - loyaltyPicksTotal();
    const groupUnaffordable = picked === 0 && minPrice > groupRemaining;
    const first = g.opts[0];
    const header = `<div class="loyalty-pick loyalty-group-header${groupUnaffordable ? ' loyalty-unaffordable' : ''}" data-action="toggle-loyalty-group" data-id="${esc(g.lp.id)}"><div style="display:flex;align-items:center;gap:10px"><img src="${esc(thumbSrc(first.image) || PLACEHOLDER_IMG)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover" alt=""><div><div style="font-weight:600;font-size:14px">${esc(first.name)}${picked ? ` <span style="font-weight:400;color:var(--success)">— ${picked} choisi(s)</span>` : ''}</div><div style="font-size:12px;color:var(--muted)">à partir de ${fmt(minPrice)} · ${g.opts.length} formats</div>${first.tags ? `<div class="tag-row">${first.tags}</div>` : ''}</div></div><span class="loyalty-chevron">${isOpen ? '▾' : '▸'}</span></div>`;
    const body = isOpen ? `<div class="loyalty-group-body">${g.opts.map(renderLoyaltyOptionRow).join('')}${customRow}</div>` : '';
    return header + body;
  }).join('');
  const mode = state.loyaltyPickerMode;
  const enTete = mode === 'proposee' ? `<button class="btn btn-secondary" data-action="cagnotte-rien" style="margin-bottom:12px">Ne rien ajouter</button>`
    : mode === 'obligatoire' ? `<div class="hint" style="margin-bottom:10px;padding:10px;border-radius:var(--radius);background:rgba(245,158,11,0.14);border:1px solid rgba(245,158,11,0.45);color:var(--warning)">🎁 Ta cagnotte atteint ${fmt(usable)} : choisis au moins un article offert pour passer commande.</div>` : '';
  const valider = mode ? `Valider et commander (${fmt(used)} utilisé)` : `Valider (${fmt(used)} utilisé)`;
  const bloque = mode === 'obligatoire' && used === 0;
  return `<div class="modal-overlay" data-action="close-loyalty"><div class="modal modal-cagnotte"><div class="modal-body">${enTete}<div class="modal-title">🎁 Articles offerts</div><div class="modal-desc">Votre cagnotte de ${fmt(usable)}${projectedLoyaltyBonus() > 0 ? ` (dont ${fmt(projectedLoyaltyBonus())} gagné avec cette commande)` : ''} — chaque article est déduit selon sa vraie valeur. Utilisé : ${fmt(used)}. Restant : ${fmt(remaining)}.</div>${groups.length === 0 ? '<div class="hint">Aucun article cagnotte configuré par le vendeur.</div>' : groupsHtml}<button class="btn btn-primary" data-action="confirm-loyalty" style="margin-top:12px" ${bloque ? 'disabled' : ''}>${valider}</button></div></div></div>`;
}
function toggleLoyalty() {

    state.useLoyalty = false; state.loyaltyPicks = []; state.loyaltyCustomPicks = [];

/* Bannière de la cagnotte (accueil) : ouvre directement les articles offerts,

function loyaltyPickChange(id, d) {

function addLoyaltyCustomAmount(lpId) {
  const lp = (catalog.loyalty_products || []).find(x => x.id === lpId);
  const p = catalog.products.find(x => x.id === lpId);
  if (!lp || !p) return;
  const el = document.getElementById('loyalty-custom-input-' + lpId);
  const raw = el ? el.value : '';
  const amount = parseWholeEuros(raw);
  if (amount === null || amount <= 0) { showToast('Entre un montant entier en €'); return; }
  if (amount > loyaltyMaxPrice(p)) { showToast('Maximum ' + fmt(loyaltyMaxPrice(p)) + ' pour cet article offert'); return; }
  const min = customMinPrice(p);
  if (amount < min) { showToast('Minimum ' + fmt(min) + ' pour cet article'); return; }

  if (amount > remaining) { showToast('Cagnotte insuffisante (reste ' + fmt(remaining) + ')'); return; }

  if (!qty) { showToast('Montant impossible pour cet article'); return; }

  if (rem < ceilStockStep(qty)) { showToast('Stock insuffisant (reste ' + fmtQty2(rem, p.stock_unit || 'g') + ')'); return; }
  if (!state.loyaltyCustomPicks) state.loyaltyCustomPicks = [];
  state.loyaltyCustomPicks.push({ id: lpId, amount, qty });

/* Bouton « Commander » du panier. Cagnotte (solde + ce que cette commande va

function confirmLoyalty() {

  state.cart = state.cart.filter(i => !i.free);
  const counts = {};
  state.loyaltyPicks.forEach(key => counts[key] = (counts[key] || 0) + 1);
  Object.keys(counts).forEach(key => {
    const id = key.split('::')[0];
    const lp = (catalog.loyalty_products || []).find(x => x.id === id);
    if (!lp) return;
    const p = catalog.products.find(x => x.id === id);
    const label = loyaltyItemLabel(key);
    const vIdx = key.indexOf('::') >= 0 ? Number(key.split('::')[1]) : null;
    let units = 1;

  });
  (state.loyaltyCustomPicks || []).forEach(c => {

/* ===== CHECKOUT ===== */
function renderCheckout() {
  if (state.cart.length === 0) return '<div class="empty"><h2>Panier vide</h2><p>Ajoutez des produits avant de commander</p></div>';
  const d = 'delivery'; const s = catalog.settings;
  // « Aucune préférence » réutilise le montant minimum autrefois réservé au
  // sur place (généralement plus bas) : le client laisse le vendeur choisir
  // l'horaire, en échange d'un minimum de commande réduit.
  const min = state.noPreference ? minForMode('pickup', state.selectedSlot) : minForMode(d, state.selectedSlot);
  const total = cartTotal();
  const amountOk = cartAmountOk();
  // Panier composé uniquement d'articles offerts (cagnotte) : pas de minimum à
  // atteindre, le client ne paie rien.
  const freeOnly = state.cart.every(i => i.free);
  const meetsMin = freeOnly || (cartMinBase() >= min && amountOk);
  const prof = loadJSON('cave420_profile', {}) || {};
  const dr = state.checkoutDraft || {};
  const vName = dr.name != null ? dr.name : (prof.name || '');
  const sessionPseudo = (window.__sessionPseudo || '').trim();
  const vTg = sessionPseudo || (dr.tg != null ? dr.tg : (prof.telegram_id || ''));
  const vAddr = dr.address != null ? dr.address : (prof.address || '');
  const vNotes = dr.notes != null ? dr.notes : '';
  // Grille du 1er jour disponible ; une case révèle le prochain jour OUVERT
  // (le 2e jour renvoyé par availableSlots, qui saute déjà fermés / no_delivery).
  const slotDays = availableSlots(true, 2, d);
  const nextDay = slotDays[1]; // prochain jour ouvert (undefined s'il n'y en a pas)
  const showNext = !!(state.showNextSlotDay && nextDay);
  // La livraison réserve aussi les deux créneaux collés : on les montre en
  // bleu pâle pour annoncer la marge horaire ET l'indisponibilité.
  const step = slotStepMinutes() * 60000;
  const selT = state.selectedSlot ? new Date(state.selectedSlot).getTime() : null;
  const isNeighbor = (iso) => selT !== null && Math.abs(new Date(iso).getTime() - selT) === step;
  const hm = (t) => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const dayBlock = (day) => `<div class="slot-day"><div class="slot-day-title">${day.dayLabel}</div><div class="slots">${day.slots.map(sl => `<button class="slot-btn ${state.selectedSlot === sl.iso ? 'selected' : (isNeighbor(sl.iso) ? 'neighbor' : '')}" data-action="pick-slot" data-iso="${sl.iso}">${sl.label}</button>`).join('')}</div></div>`;
  const spreadNote = selT === null
    ? `<div class="hint" style="margin-top:8px">🕐 L'heure reste approximative : le créneau choisi <b>et les deux qui l'encadrent</b> vous seront réservés.</div>`
    : `<div class="hint" style="margin-top:8px">🕐 Heure approximative — les créneaux <b>${hm(selT - step)}, ${hm(selT)} et ${hm(selT + step)}</b> vous sont réservés.</div>`;
  const shownDays = showNext ? slotDays.slice(0, 2) : slotDays.slice(0, 1);
  const nextToggle = nextDay ? `<label class="check-row" style="margin-top:12px"><input type="checkbox" ${showNext ? 'checked' : ''} data-action="toggle-next-day"> ☞ ${nextDay.dayLabel}</label>` : '';
  // « Aucune préférence » : le client n'a pas de préférence d'horaire — pas
  // de créneau à choisir dans ce cas.
  // Heure limite du jour même dépassée : on le dit clairement, la grille
  // commence déjà au lendemain.
  const limite = sameDayCutoff();
  const apresLimite = pastSameDayCutoff();
  const limiteNote = apresLimite ? `<div class="hint" style="margin:6px 0 8px;color:var(--warning)">⏰ Il est plus de ${fmtHourShort(limite)} : les commandes passées maintenant sont pour <b>demain au plus tôt</b>.</div>` : '';
  let slotHTML = state.noPreference
    ? `<div class="form-group"><label>Créneau</label></div>${limiteNote}<div class="hint">🤷 Aucune préférence : le vendeur choisit l'horaire${apresLimite ? ', à partir de demain' : ''}.</div>`
    : `<div class="form-group"><label>Créneau souhaité (min ${advanceLabel(d)})</label></div>${limiteNote}${slotDays.length === 0 ? '<div class="hint">Aucun créneau disponible (boutique fermée).</div>' : shownDays.map(dayBlock).join('') + spreadNote + nextToggle}`;
  const noPrefRow = `<label class="check-row" style="margin-top:12px"><input type="checkbox" ${state.noPreference ? 'checked' : ''} data-action="toggle-no-preference"> 🤷 Aucune préférence d'horaire (minimum de ${fmt(minForMode('pickup', state.selectedSlot))})</label>`;
  const editUnchanged = orderEditUnchanged();
  const editNotice = state.editingOrderId ? `<div class="hint" style="margin-bottom:12px;padding:10px;border-radius:var(--radius);background:rgba(234,179,8,0.12);border:1px solid rgba(234,179,8,0.4);color:var(--warning)">✏️ Cette demande remplacera la commande #${esc(String(state.editingOrderId).slice(-6).toUpperCase())} une fois acceptée par la boutique.</div>` : '';
  return `<h2 style="margin-bottom:16px;font-size:18px">${state.editingOrderId ? 'Modifier la commande' : 'Passer commande'}</h2>${editNotice}${noPrefRow}${slotHTML}<div class="form-group"><label>Pseudo</label><input type="text" id="co-tg" value="${esc(vTg)}" readonly style="opacity:.85;cursor:not-allowed"></div><div class="form-group" id="addr-group"><label>${state.noPreference ? 'Adresse (optionnel)' : 'Adresse de livraison'}</label><input type="text" id="co-address" value="${esc(vAddr)}" placeholder="Votre adresse" autocomplete="street-address"></div><div class="form-group"><label>Notes (optionnel)</label><textarea id="co-notes" placeholder="Instructions...">${esc(vNotes)}</textarea></div><div class="summary"><div class="summary-row"><span>Minimum (${state.noPreference ? 'aucune préférence' : 'livraison'})</span><span>${fmt(min)}</span></div>${appliedPromo() && promoDiscount(cartSubtotal()) > 0 ? `<div class="summary-row"><span>Sous-total</span><span>${fmt(cartSubtotal())}</span></div><div class="summary-row"><span>🏷️ ${esc(appliedPromo().code)}</span><span>-${fmt(promoDiscount(cartSubtotal()))}</span></div>` : ''}<div class="summary-row total"><span>Total</span><span>${fmt(total)}</span></div></div>${!freeOnly && cartMinBase() < min ? `<div style="color:var(--error);text-align:center;margin-bottom:10px;font-size:13px">Minimum ${fmt(min)} requis pour ce mode.</div>` : (!freeOnly && !amountOk ? `<div style="color:var(--error);text-align:center;margin-bottom:10px;font-size:13px">Le montant doit être un multiple de 10 € (sauf si vous utilisez votre cagnotte).</div>` : '')}${state.editingOrderId ? `<div id="co-nochange" class="hint" style="text-align:center;margin-bottom:10px;${editUnchanged ? '' : 'display:none'}">✋ Aucune modification par rapport à la commande actuelle : changez un article, le créneau, l'adresse ou les notes pour pouvoir l'envoyer.</div>` : ''}<button class="btn btn-primary" data-action="submit-order" id="submit-btn" data-meets="${meetsMin ? 1 : 0}" ${meetsMin && !editUnchanged ? '' : 'disabled'}>${state.editingOrderId ? 'Envoyer la modification' : 'Confirmer la commande'}</button><div id="co-error" style="color:var(--error);text-align:center;margin-top:12px;font-size:13px"></div>`;
}

let submitting = false;

  if (!tg) { err.textContent = 'Pseudo manquant — revenez à l\'accueil pour vous identifier'; return; }
  if (!state.noPreference && !address) { err.textContent = 'Adresse requise'; return; }

    // Affichage seulement : le vrai débit est appliqué par l'admin à la validation.

    if (pcUsed) { pcUsed.uses = (pcUsed.uses || 0) + 1; saveCatalog(); }
    state.cart = []; state.useLoyalty = false; state.loyaltyPicks = []; state.loyaltyCustomPicks = []; state.selectedSlot = null; state.checkoutDraft = {}; state.promoApplied = null; state.promoDraft = ''; state.noPreference = false;
    saveCart();
    const prevProf = loadJSON('cave420_profile', {}) || {};
    // Le pseudo n'est JAMAIS sauvegardé (il vient de l'authentification, à ressaisir à chaque visite). On garde juste tél/adresse.
    store('cave420_profile', { phone: phone || prevProf.phone || '', address: address || prevProf.address || '' });

async function placeOrder(data) {
  const order = {
    id: 'loc_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    created_at: new Date().toISOString(), total: cartTotal(), status: 'preparation',
    guest_id: guestId, ...data,
    items: state.cart.map(i => ({ product_id: i.product_id, name: i.name, quantity: i.quantity, variant_label: i.variant_label || undefined, diluent: i.diluent || undefined, diluents: (i.diluents && i.diluents.length) ? i.diluents : undefined, price: i.price, free: i.free || false, units: i.units || 1, custom: i.custom || undefined, mixId: i.mixId || undefined })),
    loyalty_used: data.loyalty_used || 0, loyalty_earned: 0,
    tg_chat_id: tgUserId() || undefined,
    tg_username: tgUsername() || undefined,
  };
  // Le stock ne bouge qu'à la VALIDATION (« Prête », voir setOrderStatus),
  // y compris pour une commande passée depuis l'appareil admin : une commande
  // annulée sans avoir été validée ne touche donc ni au stock ni à la cagnotte.
  // L'appareil admin réserve seulement le créneau tout de suite.
  if (state.adminUnlocked) applySlotBlock(order);
  saveCatalog();
  // Pas d'alerte stock ici : elle part UNIQUEMENT à la validation de la commande
  // (voir setOrderStatus), pour ne pas être prévenu deux fois pour la même vente.
  if (tgReady()) {
    try {
      await sendOrderNotification(order);
      order.notified = true;
    } catch (e) {
      console.error('Erreur envoi Telegram:', e);
      order.notified = false;
      order.notify_error = (e && e.message) ? e.message : 'erreur réseau';
    }
  } else {
    order.notified = false; // token/chat non configurés → rien n'est envoyé
    order.notify_error = 'token ou chat ID manquant (Admin → Telegram)';
  }
  // Confirmation au client dans son chat bot (en parallèle, sans bloquer)
  sendCustomerOrderConfirmation(order);
  const list = loadJSON('cave420_orders', []); const arr = Array.isArray(list) ? list : []; arr.unshift(order); store('cave420_orders', arr);
  autoSyncServerFile();
  return order;
}

/* ===== MODIFICATION D'UNE COMMANDE PAR LE CLIENT =====
   Le client reprend sa commande existante comme un panier normal (articles,
   créneau, adresse, notes) et la renvoie comme une DEMANDE de modification —
   la commande d'origine reste inchangée tant que le vendeur ne l'a pas
   acceptée. Une seule demande à la fois : le bouton disparaît le temps qu'elle
   soit traitée. */
function startOrderEdit(orderId) {
  const o = state.orders.find(x => String(x.id) === String(orderId));
  if (!o) return;
  if (o.edit_request) { showToast('Une modification est déjà en attente pour cette commande'); return; }
  state.cart = (o.items || []).map(it => {
    const p = catalog.products.find(x => String(x.id) === String(it.product_id));
    return { product_id: it.product_id, name: it.name, image: (p && p.image) || '', price: it.price, quantity: it.quantity, variant_label: it.variant_label, diluent: it.diluent, diluents: it.diluents, units: it.units || 1, custom: it.custom, free: it.free, mixId: it.mixId };
  });
  try { reparerMixOrphelins(); } catch (e) {}
  saveCart();
  state.checkoutDraft = { address: o.address || '', notes: o.notes || '' };
  state.selectedSlot = o.slot || null;
  state.noPreference = !!o.no_preference;
  state.editingOrderId = orderId;
  state.page = 'cart';
  render();
}
// Empreinte comparable d'une commande (articles + créneau + adresse + notes),
// indépendante de l'ordre des lignes et des champs vides/absents : sert à
// refuser une « modification » identique à la commande d'origine.
function orderEditFingerprint(items, address, notes, slot, noPref) {
  const lines = (items || []).map(i => JSON.stringify([String(i.product_id), i.variant_label || '', i.diluent || '', (i.diluents && i.diluents.length) ? i.diluents : '', Number(i.quantity) || 0, Number(i.price) || 0, Number(i.units) || 1, i.custom || '', !!i.free])).sort();
  return JSON.stringify([lines, String(address || '').trim(), String(notes || '').trim(), noPref ? null : (slot || null), !!noPref]);
}
function orderEditUnchanged() {
  if (!state.editingOrderId) return false;
  const o = state.orders.find(x => String(x.id) === String(state.editingOrderId)) || (loadJSON('cave420_orders', []) || []).find(x => String(x.id) === String(state.editingOrderId));
  if (!o) return false;
  const dr = state.checkoutDraft || {};
  return orderEditFingerprint(state.cart, dr.address, dr.notes, state.selectedSlot, state.noPreference) === orderEditFingerprint(o.items, o.address, o.notes, o.slot, o.no_preference);
}

function loadOrders() { purgeOldOrders(); const o = loadJSON('cave420_orders', []); state.orders = Array.isArray(o) ? o : []; render(); }

/* Import d'une commande reçue via le bouton « Ajouter à mon appli » du bot :
   l'app est ouverte avec #order=<base64url>. On adopte la commande sur CET
   appareil (guest_id réassigné → persistée, non purgée, gérable en admin). */
function clearOrderParam() {
  try {
    const u = new URL(location.href);
    u.searchParams.delete('order');
    u.searchParams.delete('action');
    let hash = (u.hash || '').replace(/([#&])(order|action)=[^&]*/g, '$1').replace(/#&/, '#').replace(/#$/, '');
    history.replaceState(null, '', u.pathname + (u.search || '') + hash);
  } catch (e) { try { history.replaceState(null, '', location.pathname); } catch (e2) {} }
}
function importOrderFromUrl() {
  try {
    let enc = null, m;
    if ((m = (location.search || '').match(/[?&]order=([^&#]+)/))) enc = m[1];
    else if ((m = (location.hash || '').match(/[#&]order=([^&]+)/))) enc = m[1];  // rétro-compat liens en #
    if (!enc) return null;
    // Action rapide demandée depuis les boutons Valider/Annuler du bot
    let act = null, am;
    if ((am = (location.search || '').match(/[?&]action=(pret|annule)/))) act = am[1];
    else if ((am = (location.hash || '').match(/[#&]action=(pret|annule)/))) act = am[1];
    const o = orderFromLink(JSON.parse(b64urlDecode(decodeURIComponent(enc))));
    if (!o || o.id == null || !Array.isArray(o.items)) { clearOrderParam(); return null; }
    if (act) state.pendingOrderAction = { id: String(o.id), st: act };
    const list = loadJSON('cave420_orders', []); const arr = Array.isArray(list) ? list : [];
    if (!arr.some(x => String(x.id) === String(o.id))) {
      o.orig_guest_id = o.guest_id;
      o.guest_id = guestId;      // adopté par cet appareil
      o.admin_imported = true;
      arr.unshift(o);
      arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      store('cave420_orders', arr);
    }
    recordPseudoChats([o]);
    clearOrderParam();
    return String(o.id);
  } catch (e) { clearOrderParam(); return null; }
}

// Applique un delta de stock pour tous les articles d'une commande (sign -1 = on
// décompte, +1 = on restitue). Ignore les articles sans pool de stock.
function applyStockDelta(order, sign) {
  (order.items || []).forEach(item => {
    const qty = item.quantity || 1;
    // Boisson (diluant) choisie pour un flash : son stock est décompté aussi,
    // à raison d'une boisson par flash. La saisie libre « Autre » ne correspond
    // à aucun produit et est ignorée naturellement.
    // Une boisson par flash servi. Depuis le choix multiple, le détail est dans
    // item.diluents ; les anciennes commandes n'ont qu'un nom pour tous les flashs.
    if (item.diluents && item.diluents.length) {
      item.diluents.forEach(dd => {
        const d = catalog.products.find(x => x.name === dd.n);
        if (d) consumeStock(d, -sign * (dd.q || 1) * qty);
      });
    } else if (item.diluent) {
      const d = catalog.products.find(x => x.name === item.diluent);
      if (d) consumeStock(d, -sign * flashCountOf(item) * qty);
    }
    const p = catalog.products.find(x => String(x.id) === String(item.product_id));
    if (!p) return;
    let units = item.units;
    if (units == null) { const v = (p.variants || []).find(x => x.label === item.variant_label); units = v ? variantUnits(v) : 1; }
    // Découpe sur mesure : le stock retire le cran de 0,05 au-dessus (5,13 → 5,15).
    if (item.custom) units = ceilStockStep(units);
    consumeStock(p, -sign * units * qty);
  });
}

function setOrderStatus(id, st) {
  const list = loadJSON('cave420_orders', []); if (!Array.isArray(list)) return;
  const o = list.find(x => x.id === id); if (!o) return;
  const prev = o.status;
  if (state.adminUnlocked) recordPseudoChats([o]);
  // Commande ajoutée depuis le bot (« Ajouter à mon appli ») puis annulée sans
  // avoir été validée ici : on fait comme si elle avait été validée avant — le
  // stock est remis et la cagnotte mise à jour (voir plus bas). Une seule fois
  // par commande : la réactiver puis l'annuler encore ne rend rien de plus.
  const commeValidee = state.adminUnlocked && st === 'annule' && prev !== 'annule' && o.admin_imported
    && !o.stock_applied && !o.loyalty_credited && !o.annulee_comme_validee;
  if (commeValidee) o.annulee_comme_validee = true;
  // ----- STOCK (mode admin uniquement) -----
  // Un drapeau stock_applied garantit qu'on décompte une seule fois par commande
  // et qu'on ne restitue QUE ce qui avait été décompté. Le stock est décompté à la
  // validation (Prête) et rendu à l'annulation (ou, pour une commande ajoutée
  // depuis le bot, à sa première annulation, cf. commeValidee).
  if (state.adminUnlocked) {
    if (st === 'annule' && (o.stock_applied || commeValidee)) { applyStockDelta(o, +1); o.stock_applied = false; saveCatalog(); }
    else if (st === 'pret' && !o.stock_applied) {
      applyStockDelta(o, -1); o.stock_applied = true; saveCatalog();
    }
    // ----- CRÉNEAUX -----
    // Livraison/boîte : occupe son créneau et les deux voisins, pour tous les
    // modes. Sur place : occupe seulement son créneau, pour les 2 autres
    // modes. Annuler la commande rouvre ce qui avait été bloqué.
    if (st === 'annule') { const n = releaseSlotBlock(o); if (n) showToast(n > 1 ? n + ' créneaux rouverts' : 'Créneau rouvert'); }
    else { const n = applySlotBlock(o); if (n) showToast(n > 1 ? n + ' créneaux bloqués' : 'Créneau bloqué'); }
  }
  // ----- CAGNOTTE + NOTIFICATIONS -----
  if (prev === 'annule' && st !== 'annule') {
    // Pas de débit de cagnotte ici : il se fait à la validation (Prête).
    if (st === 'preparation') sendStatusNotification(o, '♻️ La commande a été réactivée et repasse en préparation.');
  }
  if (st === 'annule' && prev !== 'annule') {
    // Cagnotte : on défait ce que la validation avait fait (ou, pour une
    // commande ajoutée depuis le bot, ce qu'elle aurait fait : cf. plus bas).
    if (commeValidee) {
      // Validation « virtuelle » défaite : cagnotte utilisée rendue, € qu'elle
      // aurait fait gagner retirés, jauge ramenée en arrière de son montant.
      const k = orderPseudoKey(o);
      if (k) {
        const rateCents = (catalog.settings.loyalty_rate || 10) * 100;
        const paid = (o.items || []).filter(i => !i.free).reduce((sum, i) => sum + (i.price || 0) * (i.quantity || 1), 0);
        const cur = loyaltyProgressOf(k);
        const paliers = paid > cur ? Math.ceil((paid - cur) / rateCents) : 0;
        setLoyaltyProgressOf(k, cur - paid + paliers * rateCents);
        if (k === currentPseudoKey()) state.loyaltyProgress = loyaltyProgressOf(k);
        const net = (o.loyalty_used || 0) - paliers * 100;
        if (net) addToPseudoLoyalty(k, net);
        showToast('Stock remis · cagnotte ' + k + ' : ' + fmt(loyaltyOf(k)));
      }
    } else if (state.adminUnlocked && o.loyalty_credited) {
      const k = orderPseudoKey(o);
      // Même logique que la validation (pret) : un seul ajustement NET, pour
      // ne pas laisser un plafonnage à 0 entre les deux appels fausser le
      // résultat.
      const net = (o.loyalty_used || 0) - (o.loyalty_earned || 0);
      if (net) addToPseudoLoyalty(k, net);
      if (o.loyalty_used) showToast('Cagnotte restituée : ' + fmt(o.loyalty_used));
      // Rend aussi la part qui n'avait fait qu'avancer la jauge (progression
      // cumulative) sans encore franchir un palier entier.
      // La jauge revient où elle était avant la validation : on retire ce que la
      // commande y avait ajouté, en y rendant les paliers qu'elle avait franchis
      // (transformés en € gagnés, repris juste au-dessus).
      if (o.loyalty_progress_added) {
        const cur = loyaltyProgressOf(k);
        const rateCents = (catalog.settings.loyalty_rate || 10) * 100;
        const avant = cur - o.loyalty_progress_added + Math.round((o.loyalty_earned || 0) / 100) * rateCents;
        setLoyaltyProgressOf(k, Math.max(0, Math.min(rateCents - 1, avant)));
        if (k === currentPseudoKey()) state.loyaltyProgress = loyaltyProgressOf(k);
      }
    }
    o.loyalty_earned = 0; o.loyalty_credited = false; o.loyalty_progress_added = 0;
    sendStatusNotification(o, '❌ La commande a été annulée.');
    // Si c'est le VENDEUR qui annule (admin), on prévient AUSSI le client dans son
    // chat bot, avec un lien qui met sa commande à jour côté client.
    if (state.adminUnlocked) sendCustomerCancelNotification(o);
  }
  // ----- ALERTE STOCK -----
  // Envoyée uniquement quand JE valide la commande (passage en « prête »), et
  // jamais au moment où le client la passe. Le client reçoit la même liste,
  // jointe à son message « commande prête ».
  let stockAlerts = [];
  if (st === 'pret' && prev !== 'pret' && state.adminUnlocked) {
    stockAlerts = checkStockAlertsForIds((o.items || []).map(it => it.product_id));
    if (stockAlerts.length && stockTgReady()) { sendTelegram(stockAlertMessage(stockAlerts), stockChatId()).catch(e => console.error('alerte stock:', e)); }
  }
  if (st === 'pret' && prev !== 'pret' && !o.loyalty_credited) {
    // ----- CAGNOTTE DU CLIENT -----
    // C'est ICI, à la validation, que tout se joue : la cagnotte du PSEUDO de la
    // commande est débitée de ce qu'il a dépensé puis créditée de ce qu'il gagne.
    // Le client n'a rien à faire : il retrouvera le bon montant au prochain export.
    // La progression vers le prochain euro est CUMULATIVE entre commandes : une
    // commande sous le seuil (loyalty_rate) fait quand même avancer la jauge au
    // lieu d'être perdue — elle ne se remet à zéro qu'en franchissant un palier.
    const rate = catalog.settings.loyalty_rate || 10;
    const rateCents = rate * 100;
    const paid = o.items.filter(i => !i.free).reduce((s, i) => s + i.price * i.quantity, 0);
    let earned = Math.floor(paid / rateCents) * 100; // repli si non-admin : pas de progression connue
    if (state.adminUnlocked) {
      const k = orderPseudoKey(o);
      if (k) {
        const totalProgress = loyaltyProgressOf(k) + paid;
        earned = Math.floor(totalProgress / rateCents) * 100;
        setLoyaltyProgressOf(k, totalProgress % rateCents);
        if (k === currentPseudoKey()) state.loyaltyProgress = loyaltyProgressOf(k);
        o.loyalty_progress_added = paid;
      }
      // Un seul ajustement NET (gagné − utilisé) : deux appels séparés
      // plafonnent chacun le solde à 0, ce qui fait disparaître le fait que
      // le client avait dépensé PAR AVANCE le bonus qu'il vient de gagner
      // (ex : 9 € de solde, 13 € utilisés en comptant sur les 4 € projetés
      // de cette commande -> le solde doit retomber à 0 €, pas remonter à 4 €).
      const net = earned - (o.loyalty_used || 0);
      if (net) addToPseudoLoyalty(k, net);
      if (k) showToast('Cagnotte ' + k + ' : ' + fmt(loyaltyOf(k)));
    }
    o.loyalty_earned = earned; o.loyalty_credited = true;
    // Notification prête
    sendStatusNotification(o, '✅ La commande est prête !');
    // Notification au client (chat du bot)
    sendCustomerReadyNotification(o, stockAlerts);
  }
  if (st === 'preparation' && prev === 'pret') {
    sendStatusNotification(o, '↩️ La commande est repassée en préparation.');
  }
  o.status = st;
  store('cave420_orders', list);
  loadOrders();
  autoSyncServerFile();
}

/* ===== ACCEPTER / REFUSER UNE DEMANDE DE MODIFICATION (admin) =====
   Accepter réconcilie le stock (restitue l'ancien, décompte le nouveau) et
   reprend le créneau si l'heure change, puis remplace le contenu de la
   commande. La cagnotte n'est PAS retouchée ici : elle a déjà été réglée à la
   validation initiale — à vérifier à la main (Pseudos & cagnottes) si le
   montant change beaucoup. */
function applyOrderEdit(orderId) {
  if (!state.adminUnlocked) return;
  const list = loadJSON('cave420_orders', []); if (!Array.isArray(list)) return;
  const o = list.find(x => x.id === orderId); if (!o || !o.edit_request) return;
  const req = o.edit_request;
  if (o.stock_applied) {
    applyStockDelta(o, +1);
    applyStockDelta({ items: req.items }, -1);
    saveCatalog();
  }
  const slotChanged = (o.slot || null) !== (req.slot || null);
  if (slotChanged && (o.slots_blocked || o.slots_blocked_window)) releaseSlotBlock(o);
  o.items = req.items;
  o.address = req.address || '';
  o.notes = req.notes || '';
  o.no_preference = !!req.no_preference;
  o.total = req.total;
  o.slot = req.slot || null;
  if (req.delivery_mode) o.delivery_mode = req.delivery_mode;
  if (slotChanged) applySlotBlock(o);
  o.edit_request = null;
  store('cave420_orders', list);
  showToast('Modification acceptée ✓');
  sendCustomerEditAcceptedNotification(o);
  loadOrders();
}
function rejectOrderEdit(orderId) {
  if (!state.adminUnlocked) return;
  const list = loadJSON('cave420_orders', []); if (!Array.isArray(list)) return;
  const o = list.find(x => x.id === orderId); if (!o || !o.edit_request) return;
  o.edit_request = null;
  store('cave420_orders', list);
  showToast('Modification refusée');
  sendCustomerEditRejectedNotification(o);
  loadOrders();
}
/* Réception du bouton « 📲 Ajouter à mon appli » d'une DEMANDE DE MODIFICATION :
   attache la proposition à la commande locale correspondante (aucune nouvelle
   commande créée). Revue et acceptation/refus se font depuis Commandes. */
function importOrderEditFromUrl() {
  try {
    let m, enc = null;
    if ((m = (location.search || '').match(/[?&]orderedit=([^&#]+)/))) enc = m[1];
    else if ((m = (location.hash || '').match(/[#&]orderedit=([^&]+)/))) enc = m[1];
    if (!enc) return null;
    try {
      const u = new URL(location.href);
      u.searchParams.delete('orderedit');
      let hash = (u.hash || '').replace(/([#&])orderedit=[^&]*/g, '$1').replace(/#&/, '#').replace(/#$/, '');
      history.replaceState(null, '', u.pathname + (u.search || '') + hash);
    } catch (e) {}
    const raw = JSON.parse(b64urlDecode(decodeURIComponent(enc)));
    if (!raw || raw.id == null) return null;
    const req = orderEditFromLink(raw.req);
    if (!req) return null;
    const list = loadJSON('cave420_orders', []); const arr = Array.isArray(list) ? list : [];
    const o = arr.find(x => String(x.id) === String(raw.id));
    if (!o) { showToast('Commande d\'origine introuvable sur cet appareil'); return null; }
    req.requested_at = new Date().toISOString();
    o.edit_request = req;
    store('cave420_orders', arr);
    return String(o.id);
  } catch (e) { return null; }
}
/* Bouton « ❌ Refuser » depuis Telegram : refuse directement (nécessite quand
   même le déverrouillage admin, comme Valider/Annuler — le refus touche la
   commande du vendeur). */
function importRejectEditFromUrl() {
  try {
    let m, enc = null;
    if ((m = (location.search || '').match(/[?&]rejectedit=([^&#]+)/))) enc = m[1];
    else if ((m = (location.hash || '').match(/[#&]rejectedit=([^&]+)/))) enc = m[1];
    if (!enc) return;
    try {
      const u = new URL(location.href);
      u.searchParams.delete('rejectedit');
      let hash = (u.hash || '').replace(/([#&])rejectedit=[^&]*/g, '$1').replace(/#&/, '#').replace(/#$/, '');
      history.replaceState(null, '', u.pathname + (u.search || '') + hash);
    } catch (e) {}
    const raw = JSON.parse(b64urlDecode(decodeURIComponent(enc)));
    if (!raw || raw.id == null) return;
    if (state.adminUnlocked) { rejectOrderEdit(String(raw.id)); return; }
