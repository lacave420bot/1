/* Le CLIENT tape « Mettre à jour mon appli » suite à l'acceptation : sa copie
   locale porte déjà la demande (il l'a créée) — il suffit de la fusionner
   dans la commande de base. */
function importEditAcceptedFromUrl() {
  try {
    let m, enc = null;
    if ((m = (location.search || '').match(/[?&]editaccepted=([^&#]+)/))) enc = m[1];
    else if ((m = (location.hash || '').match(/[#&]editaccepted=([^&]+)/))) enc = m[1];
    if (!enc) return;
    try {
      const u = new URL(location.href);
      u.searchParams.delete('editaccepted');
      let hash = (u.hash || '').replace(/([#&])editaccepted=[^&]*/g, '$1').replace(/#&/, '#').replace(/#$/, '');
      history.replaceState(null, '', u.pathname + (u.search || '') + hash);
    } catch (e) {}
    const raw = JSON.parse(b64urlDecode(decodeURIComponent(enc)));
    if (!raw || raw.id == null) return;
    const list = loadJSON('cave420_orders', []); const arr = Array.isArray(list) ? list : [];
    const o = arr.find(x => String(x.id) === String(raw.id));
    if (!o || !o.edit_request) { showToast('Rien à mettre à jour'); return; }
    const req = o.edit_request;
    o.items = req.items; o.address = req.address || ''; o.notes = req.notes || '';
    o.no_preference = !!req.no_preference; o.total = req.total; o.slot = req.slot || null;
    if (req.delivery_mode) o.delivery_mode = req.delivery_mode;
    o.edit_request = null;
    store('cave420_orders', arr);
    showToast('Commande mise à jour ✓');
    sendClientActionConfirmation();
  } catch (e) {}
}
function importEditRejectedFromUrl() {
  try {
    let m, enc = null;
    if ((m = (location.search || '').match(/[?&]editrejected=([^&#]+)/))) enc = m[1];
    else if ((m = (location.hash || '').match(/[#&]editrejected=([^&]+)/))) enc = m[1];
    if (!enc) return;
    try {
      const u = new URL(location.href);
      u.searchParams.delete('editrejected');
      let hash = (u.hash || '').replace(/([#&])editrejected=[^&]*/g, '$1').replace(/#&/, '#').replace(/#$/, '');
      history.replaceState(null, '', u.pathname + (u.search || '') + hash);
    } catch (e) {}
    const raw = JSON.parse(b64urlDecode(decodeURIComponent(enc)));
    if (!raw || raw.id == null) return;
    const list = loadJSON('cave420_orders', []); const arr = Array.isArray(list) ? list : [];
    const o = arr.find(x => String(x.id) === String(raw.id));
    if (!o) return;

    showToast('Ta modification a été refusée');

// Gestion du sélecteur d'heure pour l'admin : date + heure natives (roue du
// système), comme pour les horaires généraux — plus de grille de créneaux
// prédéfinis ici, cet outil sert justement à s'en affranchir.
function openOrderSlotPicker(orderId) {
  state.orderSlotPicker = orderId;
  render();
}
function closeOrderSlotPicker() {
  state.orderSlotPicker = null;
  render();
}
function confirmOrderSlot() {
  if (!state.orderSlotPicker) return;
  const dEl = document.getElementById('ord-slot-date');
  const tEl = document.getElementById('ord-slot-time');
  const dv = dEl ? dEl.value : '';
  const tv = tEl ? tEl.value : '';
  if (!dv || !tv) { showToast('Choisissez une date et une heure'); return; }
  const dt = new Date(dv + 'T' + tv + ':00');
  if (isNaN(dt.getTime())) { showToast('Date ou heure invalide'); return; }
  const list = loadJSON('cave420_orders', []);
  const o = list.find(x => x.id === state.orderSlotPicker);
  if (o) {
    // L'ancien créneau se rouvre, le nouveau se bloque (si la commande était validée).
    const wasBlocked = !!(o.slots_blocked || o.slots_blocked_window);
    releaseSlotBlock(o);
    o.slot = dt.toISOString();
    if (wasBlocked) applySlotBlock(o);
    store('cave420_orders', list);
    showToast('Heure mise à jour ✓');
    // Notification de mise à jour de l'heure : au vendeur ET au client
    sendStatusNotification(o, '🕐 L\'heure de retrait/livraison a été définie : ' + slotLabel(o.slot));
    sendCustomerSlotUpdate(o);
  }
  closeOrderSlotPicker();
  loadOrders(); // recharge la liste
}

function renderBlockedSlotsSection() {
  const openDays = availableSlotsAdmin();

  // Grisé si bloqué individuellement (ancien format) OU si le créneau tombe dans
  // une fenêtre bloquée — commande ou blocage manuel, 20 min avant/après.
  const isOff = sl => allArr.indexOf(sl.iso) !== -1 || isTimeInBlockedWindow(new Date(sl.iso).getTime());
  const blockedCount = openDays.reduce((sum, d) => sum + d.slots.filter(isOff).length, 0);

        }).join('')}</div>`

      ${grid}

  }).join('');
  return `<div class="admin-section" style="margin-top:22px"><h3>❌ Créneaux indisponibles</h3>
    <p class="hint" style="margin-top:0">Cochez un jour pour dérouler ses créneaux, puis touchez un créneau pour le rendre indisponible : 20 min sont bloquées de part et d'autre, donc le créneau voisin de chaque côté tombe aussi. Retouchez-le pour tout libérer.</p>

/* ===== HISTORIQUE ARCHIVÉ (lecture seule) =====
   Commandes conservées sur l'appareil (le bloc <script id="orders-archive"> du fichier
   publié reste vide : le site est public), en
   dehors de l'historique vivant : elles ne réapparaissent pas dans la page
   Commandes et ne touchent ni au stock ni à la cagnotte. Liste compacte, chaque
   ligne se déplie pour voir le détail. */
function loadArchivedOrders() {
  try { const raw = document.getElementById('orders-archive'); const a = raw ? JSON.parse(raw.textContent) : []; return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
const ORDERS_ARCHIVE = loadArchivedOrders();
/* Suppressions faites depuis l'admin : mémorisées sur l'appareil et appliquées à
   l'export (le bloc archive est réécrit), pour qu'elles soient définitives une
   fois le fichier redéployé. */
function archiveHiddenIds() { const a = loadJSON('cave420_archive_hidden', []); return Array.isArray(a) ? a : []; }
/* Commandes archivées à la main depuis la page Commandes : elles rejoignent
   l'archive et quittent la liste vivante. Elles sont réécrites dans le fichier
   au prochain export. */
function archiveAddedOrders() { const a = loadJSON('cave420_archive_added', []); return Array.isArray(a) ? a : []; }
function archiveRemovedIds() { const a = loadJSON('cave420_archive_removed', []); return Array.isArray(a) ? a : []; }
/* Identifiants encore présents dans les blocs embarqués du fichier déployé.
   Au-delà, garder un identifiant ne sert plus à rien : c'est une trace inutile. */
function embeddedArchiveIds() { return new Set(loadArchivedOrders().map(o => String(o && o.id))); }
function embeddedOrderIds() {
  try { const raw = document.getElementById('orders-data'); const a = raw ? JSON.parse(raw.textContent) : []; return new Set((Array.isArray(a) ? a : []).map(o => String(o && o.id))); }
  catch (e) { return new Set(); }
}
/* SUPPRESSION DÉFINITIVE.
   Le contenu de la commande (client, téléphone, adresse, articles, notes) est
   effacé partout où il traîne sur l'appareil : archive ajoutée à la main, liste
   vivante, sélection en cours. Ne subsiste qu'un identifiant nu, et uniquement
   tant que le fichier déployé contient encore la commande — le prochain export
   réécrit le bloc sans elle, et cet identifiant disparaît à son tour.
   Aucune sauvegarde n'est conservée : la commande n'est pas récupérable. */
function purgeArchived(ids) {
  const set = new Set(ids.map(String));
  const live = loadJSON('cave420_orders', []);
  // 0. Le client reste joignable (annuaire 📣) même une fois sa commande effacée
  recordPseudoChats(visibleArchive().concat(Array.isArray(live) ? live : []).filter(o => o && set.has(String(o.id))));
  // 1. Contenu : plus rien nulle part
  store('cave420_archive_added', archiveAddedOrders().filter(o => !set.has(String(o && o.id))));
  if (Array.isArray(live)) store('cave420_orders', live.filter(o => !set.has(String(o && o.id))));
  // 2. Identifiants : on ne garde que ceux qui servent encore à masquer
  const inArch = embeddedArchiveIds();
  store('cave420_archive_hidden', [...new Set(archiveHiddenIds().map(String).concat([...set]))].filter(k => inArch.has(k)));
  // Une commande supprimée ici doit rester bloquée tant que le fichier déployé
  // la liste encore dans orders-data — sinon elle revient au prochain
  // rechargement (le fichier n'a pas encore été redéployé sans elle).
  const inOrders = embeddedOrderIds();
  store('cave420_archive_removed', [...new Set(archiveRemovedIds().map(String).concat([...set]))].filter(k => inOrders.has(k)));
  // 3. Résidus d'affichage
  if (state.archiveOpen) set.forEach(k => { delete state.archiveOpen[k]; });
  state.selectedOrders = (state.selectedOrders || []).filter(x => !set.has(String(x)));
}
/* Au chargement : on oublie les identifiants devenus inutiles. Dès que le fichier
   est redéployé sans les commandes supprimées, plus rien sur l'appareil ne les
   nomme — même pas leur numéro. */
function pruneArchiveTraces() {
  try {
    const inArch = embeddedArchiveIds();
    const h0 = archiveHiddenIds().map(String), h = h0.filter(k => inArch.has(k));
    if (h.length !== h0.length) store('cave420_archive_hidden', h);
    const inOrders = embeddedOrderIds();
    const r0 = archiveRemovedIds().map(String), r = r0.filter(k => inOrders.has(k));
    if (r.length !== r0.length) store('cave420_archive_removed', r);
  } catch (e) {}
}
pruneArchiveTraces();
function visibleArchive() {
  const h = new Set(archiveHiddenIds().map(String));
  const seen = new Set();
  return ORDERS_ARCHIVE.concat(archiveAddedOrders())
    .filter(o => { const k = String(o && o.id); if (!o || h.has(k) || seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}
/* Déplace une commande de la liste vivante vers l'archive */
function archiveOrder(id) {
  const list = loadJSON('cave420_orders', []);
  const arr = Array.isArray(list) ? list : [];
  const o = arr.find(x => String(x.id) === String(id));
  if (!o) { showToast('Commande introuvable'); return; }
  if (!confirm('Archiver la commande #' + String(o.id).slice(-6).toUpperCase() + ' ?\n\nElle quitte la liste des commandes et rejoint l\'historique archivé.')) return;
  recordPseudoChats([o]);
  storeArchived([o]);
  store('cave420_orders', arr.filter(x => String(x.id) !== String(o.id)));
  state.selectedOrders = state.selectedOrders.filter(x => String(x) !== String(o.id));
  loadOrders(); showToast('Commande archivée 📚');
}
/* Range des commandes dans l'historique archivé (sans les retirer de la liste vivante). */
function storeArchived(orders) {
  const added = archiveAddedOrders(), removed = archiveRemovedIds();
  orders.forEach(o => {
    const slim = Object.assign({}, o);
    delete slim.unarchived_at;
    if (typeof slim.mailbox_photo === 'string') slim.mailbox_photo = true;
    if (!added.some(x => String(x.id) === String(o.id))) added.push(slim);
    if (removed.indexOf(String(o.id)) === -1) removed.push(String(o.id));
  });
  store('cave420_archive_added', added);
  store('cave420_archive_removed', removed);
}
/* L'inverse : la commande quitte l'historique et revient dans la page Commandes.
   Elle y reste 24 h à compter du désarchivage, puis retourne d'elle-même dans
   l'archive (jamais effacée par la purge automatique). */
function unarchiveOrder(id) {
  const k = String(id);
  const o = visibleArchive().find(x => String(x.id) === k);
  if (!o) { showToast('Commande introuvable'); return; }
  if (!confirm('Désarchiver la commande #' + k.slice(-6).toUpperCase() + ' ?\n\nElle quitte l’historique archivé et revient dans la page Commandes.')) return;
  const back = Object.assign({}, o, { unarchived_at: new Date().toISOString() });
  // Adoptée par cet appareil, sinon le filtrage des commandes tierces l'écarterait.
  if (back.guest_id !== guestId) { if (!back.orig_guest_id) back.orig_guest_id = back.guest_id; back.guest_id = guestId; back.admin_imported = true; }
  store('cave420_archive_added', archiveAddedOrders().filter(x => String(x && x.id) !== k));
  if (embeddedArchiveIds().has(k)) store('cave420_archive_hidden', [...new Set(archiveHiddenIds().map(String).concat([k]))]);
  store('cave420_archive_removed', archiveRemovedIds().map(String).filter(x => x !== k));
  const live = loadJSON('cave420_orders', []);
  const arr = (Array.isArray(live) ? live : []).filter(x => String(x && x.id) !== k);
  arr.push(back);
  arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  store('cave420_orders', arr);
  if (state.archiveOpen) delete state.archiveOpen[k];
  loadOrders(); showToast('Commande désarchivée ↩️');
}
function deleteArchivedOrder(id) {
  const o = visibleArchive().find(x => String(x.id) === String(id));
  const lbl = o ? '#' + String(o.id).slice(-6).toUpperCase() + ' — ' + fmt(o.total || 0) : 'cette commande';
  if (!confirm('Supprimer définitivement ' + lbl + ' de l’historique archivé ?\n\nLe détail est effacé de l’appareil : personne ne pourra le récupérer.')) return;
  purgeArchived([id]);
  render(); showToast('Commande effacée définitivement');
}
function renderArchivedOrders() {
  const list = visibleArchive();
  if (!list.length) return '<p class="hint">Aucune commande archivée.</p>';
  const open = state.archiveOpen || (state.archiveOpen = {});
  const total = list.reduce((s, o) => s + (o.total || 0), 0);
  const sum = `<div class="arch-sum"><span><b>${list.length}</b> commandes</span><span>Total <b>${fmt(total)}</b></span></div>`;
  const rows = list.map(o => {
    const id = String(o.id);
    const isOpen = !!open[id];
    const dt = new Date(o.created_at);
    const dateLbl = isNaN(dt.getTime()) ? '—' : dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
    const modeIcon = { pickup: '🏪', delivery: '🚗', mailbox: '📬' }[o.delivery_mode] || '';
    const who = o.telegram_id || o.customer_name || o.guest_id || 'inconnu';
    const head = `<div class="arch-head" data-action="archive-toggle" data-id="${esc(id)}"><span class="arch-date">${dateLbl}</span><span class="arch-who">${modeIcon} ${esc(who)}</span><span class="arch-tot">${fmt(o.total || 0)}</span><span class="arch-caret">▼</span></div>`;
    let body = '';
    if (isOpen) {
      const L = [];
      L.push(`<div class="arch-line">#${esc(String(o.id).slice(-6).toUpperCase())}${o.phone ? ' · 📞 ' + esc(o.phone) : ''}</div>`);
      const modeLbl = { pickup: '🏪 Retrait en boutique', delivery: '🚗 Livraison', mailbox: '📬 Boîte aux lettres' }[o.delivery_mode] || '';
      L.push(`<div class="arch-line">${modeLbl}${o.delivery_mode !== 'pickup' && o.address ? ' — ' + esc(o.address) : ''}</div>`);
      if (o.slot) L.push(`<div class="arch-line">🕐 ${esc(slotLabel(o.slot))}</div>`);
      const items = (o.items || []).map(i => `<div class="arch-line">• ${i.quantity}× ${esc(i.name)}${i.variant_label ? ' (' + esc(i.variant_label) + ')' : ''}${i.free ? ' 🎁' : ' — ' + fmt(i.price * i.quantity)}</div>`).join('');
      L.push(`<div class="arch-items">${items}</div>`);
      if (o.loyalty_used) L.push(`<div class="arch-line">🎁 Cagnotte utilisée : ${fmt(o.loyalty_used)}</div>`);
      if (o.notes) L.push(`<div class="arch-line">📝 ${esc(o.notes)}</div>`);
      L.push(`<div class="arch-actions"><button class="btn btn-secondary" data-action="archive-restore" data-id="${esc(id)}">↩️ Désarchiver</button><button class="btn btn-secondary arch-del" data-action="archive-delete" data-id="${esc(id)}">🗑️ Supprimer</button></div>`);
      body = `<div class="arch-body">${L.join('')}</div>`;
    }
    return `<div class="arch-row ${isOpen ? 'open' : ''}">${head}${body}</div>`;
  }).join('');
  return sum + rows;
}

/* ===== PAGE HISTORIQUE ARCHIVÉ ===== */
/* ===== MESSAGES AUX CLIENTS =====
   Annuaire « pseudo → identifiant Telegram » tenu sur CET appareil, jamais
   dans le fichier publié (qui est public). Chaque commande qui passe par
   l'appareil l'alimente (importée, validée, archivée, désarchivée, effacée ou
   purgée) et il survit à la suppression des commandes. Il sert à écrire
   librement à tous les clients depuis les Réglages. */
function pseudoChats() { const d = loadJSON('cave420_pseudo_chats', {}); return d && typeof d === 'object' && !Array.isArray(d) ? d : {}; }
/* Copie de secours dans IndexedDB : si le stockage rapide (localStorage) est
   vidé ou plein, l'annuaire n'est pas perdu. Les deux copies sont FUSIONNÉES
   (jamais écrasées par une liste plus courte) : la plus récente commande
   l'emporte pour chaque pseudo, et un retrait à la main reste un retrait. */
function mergePseudoDirs(a, b) {
  const off = Object.assign({}, a.off);
  Object.keys(b.off || {}).forEach(k => { off[k] = Math.max(off[k] || 0, b.off[k] || 0); });
  const chats = {};

    const e = src[k];
    if (!e || !e.id || (off[k] && (e.at || 0) <= off[k])) return;

  return { chats: chats, off: off };
}
async function syncPseudoBackup() {
  try {
    await null; // laisse le script finir de se charger (IndexedDB est préparée plus bas)
    const copie = (await idbGet('pseudo_chats')) || {};
    // Relu APRÈS l'attente : une commande enregistrée entre-temps n'est pas perdue.
    const local = { chats: pseudoChats(), off: loadJSON('cave420_pseudo_chats_off', {}) || {} };
    const m = mergePseudoDirs(local, copie);
    const canon = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    if (canon(m.chats) !== canon(local.chats) || canon(m.off) !== canon(local.off)) {
      store('cave420_pseudo_chats', m.chats); store('cave420_pseudo_chats_off', m.off);
      if (state.page === 'admin' && state.adminView === 'settings') render();
    }

  } catch (e) {}
}
function recordPseudoChats(orders) {
  const d = pseudoChats();
  const retires = loadJSON('cave420_pseudo_chats_off', {}) || {};
  const moi = String(tgUserId() || '');
  let changed = false;
  (orders || []).forEach(o => {
    const id = o && o.tg_chat_id; const k = orderPseudoKey(o);
    // Jamais son propre identifiant : une commande passée depuis ce téléphone
    // ne doit pas faire écrire le vendeur à lui-même.
    if (!id || !k || String(id) === moi) return;
    const at = new Date(o.created_at).getTime() || 0;
    // Retiré à la main : seule une commande plus récente le fait revenir.
    if (retires[k] && at <= retires[k]) return;
    const cur = d[k];
    if (cur && (cur.at > at || (cur.at === at && String(cur.id) === String(id)))) return;
    d[k] = { id: id, name: String(o.telegram_id || o.customer_name || k).trim().replace(/^@+/, ''), at: at };
    changed = true;
  });
  if (changed) { store('cave420_pseudo_chats', d); syncPseudoBackup(); }
}
function broadcastTargets() {

}
async function sendBroadcast() {
  const bc = state.broadcast; if (!bc || bc.sending) return;
  const ta = document.querySelector('[data-bc="text"]'); if (ta) bc.text = ta.value;
  const text = String(bc.text || '').trim();
  if (!text) { showToast('Écris d\'abord ton message'); return; }
  if (!tgReady()) { showToast('Telegram non configuré : relais, ou token + chat'); return; }
  const cibles = broadcastTargets();
  if (!cibles.length) { showToast('Aucun destinataire'); return; }
  if (!confirm(cibles.length > 1 ? 'Envoyer ce message à ' + cibles.length + ' clients ?' : 'Envoyer ce message à ' + cibles[0].name + ' ?')) return;
  bc.sending = true; bc.result = null; render();
  const ok = [], ko = [];
  for (let i = 0; i < cibles.length; i++) {
    const c = cibles[i];
    try { await sendTelegram(text, c.id); ok.push(c.name); }
    catch (e) { ko.push(c.name + ' (' + ((e && e.message) || 'échec') + ')'); }
    const btn = document.querySelector('[data-action="bc-send"]'); if (btn) btn.textContent = 'Envoi… ' + (i + 1) + '/' + cibles.length;
    // Reste bien sous la limite d'envoi de Telegram (une trentaine par seconde).
    if (i < cibles.length - 1) await new Promise(r => setTimeout(r, 150));
  }
  bc.sending = false; bc.result = { ok: ok.length, ko: ko.length };
  // Parti chez au moins un client : on vide, pour ne pas le renvoyer en double.
  if (ok.length) bc.text = '';
  render();
  showToast(ko.length ? '⚠️ ' + ok.length + ' envoyé(s), ' + ko.length + ' échec(s)' : '✅ Envoyé à ' + ok.length + (ok.length > 1 ? ' clients' : ' client'));
}

// Filet de sécurité : avant tout export, on relit les champs admin actuellement
// affichés (réglages, horaires, catégories) et on les réinjecte dans le catalogue,
// au cas où un événement de saisie n'aurait pas été capté. Garantit qu'aucune
// modification visible à l'écran ne « passe à la trappe » lors de l'export.
function flushVisibleAdminInputs() {
  try {
    let changed = false;
    document.querySelectorAll('[data-setting],[data-setting-eur],[data-setting-int],[data-setting-min],[data-hfield],[data-catfield],[data-catnum]').forEach(t => {
      const d = t.dataset;
      if (d.setting) { const v = (t.value || '').trim(); if (catalog.settings[d.setting] !== v) { catalog.settings[d.setting] = v; changed = true; } }
      else if (d.settingEur) { const v = parseQty(t.value) * 100; if (catalog.settings[d.settingEur] !== v) { catalog.settings[d.settingEur] = v; changed = true; } }
      else if (d.settingInt) { const v = parseQty(t.value) || 1; if (catalog.settings[d.settingInt] !== v) { catalog.settings[d.settingInt] = v; changed = true; } }
      else if (d.settingMin) { const v = Math.max(0, Math.round(parseQty(t.value) || 0)); if (catalog.settings[d.settingMin] !== v) { catalog.settings[d.settingMin] = v; changed = true; } }
      else if (d.hfield) {
        if (!catalog.settings.hours) catalog.settings.hours = {};
        const day = d.day; if (!catalog.settings.hours[day]) { catalog.settings.hours[day] = { open: true, start: '10:00', end: '23:00', no_delivery: false }; changed = true; }
        const v = (t.type === 'checkbox') ? t.checked : t.value;
        if (catalog.settings.hours[day][d.hfield] !== v) { catalog.settings.hours[day][d.hfield] = v; changed = true; }
      }
      else if (d.catfield && d.catid) { const c = catalog.categories.find(x => x.id === d.catid); if (c && c[d.catfield] !== t.value) { c[d.catfield] = t.value; changed = true; } }
      else if (d.catnum && d.catid) {
        const c = catalog.categories.find(x => x.id === d.catid);
        if (c) {
          const raw = parseQty(t.value);
          const v = (!t.value.trim() || !raw) ? undefined : raw;
          if (c[d.catnum] !== v) { if (v === undefined) delete c[d.catnum]; else c[d.catnum] = v; changed = true; }
        }
      }
    });
    if (changed) saveCatalog();
    return changed;
  } catch (e) { console.error('flushVisibleAdminInputs:', e); return false; }
}

/* Données exportées : catalogue (sans secret Telegram dès qu'un relais est en
   service), commandes et archive visible. Partagé par l'export complet et
   l'export léger. */
function exportData() {
  flushVisibleAdminInputs();
  catalog.version = Date.now();
  saveCatalog();
  // Dès qu'un relais est en service, aucun export ne doit republier le token :
  // il vit sur le relais. On exporte une copie expurgée — les réglages locaux
  // de l'appareil, eux, ne sont pas touchés. Sans cette garde, il suffisait
  // d'exporter depuis un appareil dont le stockage gardait l'ancien token pour
  // le renvoyer, sans le voir, dans la page servie à tous les visiteurs.
  const aExporter = JSON.parse(JSON.stringify(catalog, sansFormatsAuto));
  if (relayUrl()) {
    const es = aExporter.settings || (aExporter.settings = {});
    es.telegram_token = '';
    es.telegram_chat_id = '';
    es.telegram_chat_id_stock = '';
  }
  // L'archive est réécrite sans les commandes supprimées depuis l'admin : une fois
  // le fichier redéployé, la suppression devient définitive pour tout le monde.
  return { catalog: aExporter, orders: loadJSON('cave420_orders', []), archive: visibleArchive() };
}
const jsonForHtml = (v, indent) => JSON.stringify(v, null, indent || 0).replace(/</g, '\\u003c');
function buildExportedHtml() {
  const d = exportData();
  const catalogJson = jsonForHtml(d.catalog, 2);
  const ordersJson = jsonForHtml(d.orders);
  const catalogMarker = new RegExp('(<script type="application/json" id="catalog-data">)[\\s\\S]*?(</scr' + 'ipt>)');
  const ordersMarker = new RegExp('(<script type="application/json" id="orders-data">)[\\s\\S]*?(</scr' + 'ipt>)');
  if (!catalogMarker.test(SOURCE_HTML) || !ordersMarker.test(SOURCE_HTML)) return null;
  let out = SOURCE_HTML.replace(catalogMarker, (m, o, c) => o + '\n' + catalogJson + '\n' + c);
  out = out.replace(ordersMarker, (m, o, c) => o + ordersJson + c);
  const archiveMarker = new RegExp('(<script type="application/json" id="orders-archive">)[\\s\\S]*?(</scr' + 'ipt>)');
  if (archiveMarker.test(out)) {
    const archiveJson = jsonForHtml(d.archive);
    out = out.replace(archiveMarker, (m, o, c) => o + archiveJson + c);
  }
  return out;
}
/* Export léger : seulement les données, sans le code du site, et sans
   recopier les photos et vidéos déjà en ligne (celles du fichier chargé au
   démarrage). Chacune est remplacée par une courte empreinte « @media:… » que
   la synchro du dépôt remplace par l'original. Seuls les médias ajoutés
   depuis voyagent en entier : ~9 Mo tombent à quelques dizaines de Ko, ce
   qui passe même sur un réseau très faible. */
const MEDIA_MIN = 2000;
function mediaFingerprint(s) { const n = s.length, h = n >> 1; return '@media:' + n + ':' + s.slice(h, h + 40) + ':' + s.slice(-40); }
let _deployedMedia = null;
function deployedMedia() {
  if (_deployedMedia) return _deployedMedia;
  const set = new Set();
  const walk = o => {
    if (typeof o === 'string') { if (o.length > MEDIA_MIN && o.startsWith('data:')) set.add(o); }
    else if (Array.isArray(o)) o.forEach(walk);
    else if (o && typeof o === 'object') Object.keys(o).forEach(k => walk(o[k]));
  };
  walk(EMBEDDED);
  return (_deployedMedia = set);
}
function buildLightExport() {
  const d = exportData();
  const known = deployedMedia();
  const swap = v => JSON.parse(JSON.stringify(v), (k, x) => (typeof x === 'string' && x.length > MEDIA_MIN && known.has(x)) ? mediaFingerprint(x) : x);
  const block = (id, v, indent) => '<script type="application/json" id="' + id + '">' + (indent ? '\n' : '') + jsonForHtml(swap(v), indent) + (indent ? '\n' : '') + '</scr' + 'ipt>';
  return '<!DOCTYPE html>\n<html lang="fr"><head><meta charset="utf-8"><title>La Cave — export léger</title></head><body>\n'
    + '<p>Export léger La Cave du ' + esc(new Date().toLocaleString('fr-FR')) + ' (build ' + esc(BUILD) + ') : données seulement, à renvoyer pour la synchro. Ne pas déposer tel quel sur le site.</p>\n'
    + block('catalog-data', d.catalog, 2) + '\n' + block('orders-data', d.orders) + '\n' + block('orders-archive', d.archive) + '\n</body></html>\n';
}
async function sendTelegramDocument(blob, filename, legende) {
  const s = catalog.settings;
  const relai = relayUrl();
  const token = (s.telegram_token || '').trim();
  const chatId = (s.telegram_chat_id || '').trim();
  if (!relai && (!token || !chatId)) throw new Error('Telegram non configuré');
  const caption = (legende || '📄 Fichier du site à jour') + ' — ' + new Date().toLocaleString('fr-FR') + ' · build ' + BUILD;
  const fd = new FormData();
  // Par le relais, c'est lui qui connaît le destinataire et le token ; on ne lui
  // passe que la clé, la destination symbolique et le fichier.
  if (relai) { fd.append('key', relayKey()); fd.append('to', 'seller'); fd.append('filename', filename); }
  else fd.append('chat_id', chatId);
  fd.append('caption', caption);
  fd.append('document', blob, filename);
  // Filet anti-blocage : on abandonne une tentative qui traîne plutôt que de
  // rester coincé sur « Envoi… ». Le délai suit le poids du fichier (20 s, plus
  // 15 s par Mo) : un délai fixe coupait systématiquement les gros fichiers
  // avant la fin sur un réseau moyen.
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), Math.min(240000, 20000 + Math.ceil(blob.size / 1e6) * 15000));
  let res;
  const cible = relai ? relai + '/document' : 'https://api.telegram.org/bot' + token + '/sendDocument';
  try { res = await fetch(cible, { method: 'POST', body: fd, signal: ctrl.signal }); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'délai dépassé (réseau trop lent)' : (/fetch|network|load failed/i.test((e && e.message) || '') ? 'pas de connexion' : (e && e.message) || 'réseau')); }
  finally { clearTimeout(to); }
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || !data.ok) throw new Error((data && data.description) || 'HTTP ' + res.status);
}

/* File d'attente de l'export : si l'envoi échoue (pas de réseau, réseau qui
   coupe), le fichier préparé est gardé sur l'appareil et repart tout seul —
   dès que le réseau revient, toutes les 30 s tant que l'appli est ouverte, et
   à sa prochaine ouverture. Un nouvel export remplace celui en attente. */
const EXPORT_PENDING_KEY = 'pendingExport';
let _exportSending = false;
async function sendExportWithRetries(item, tentatives) {
  const blob = new Blob([item.html], { type: 'text/html' });
  let lastErr = null;
  for (let attempt = 1; attempt <= tentatives; attempt++) {
    try {
      await sendTelegramDocument(blob, item.filename, item.caption);
      return null;
    } catch (e) {
      lastErr = e;
      console.error('sendDocument (tentative ' + attempt + '):', e);
      if (attempt < tentatives) await new Promise(r => setTimeout(r, 2000 * attempt));
    }
  }
  return lastErr || new Error('erreur');
}
async function flushPendingExport(manuel) {
  if (_exportSending || !tgReady()) return;
  if (!manuel && typeof navigator !== 'undefined' && navigator.onLine === false) return;
  let item = null;
  try { item = await idbGet(EXPORT_PENDING_KEY); } catch (e) { return; }
  if (!item || !item.html) { if (state.exportPending) { state.exportPending = null; render(); } return; }
  _exportSending = true;
  if (manuel) showToast('Envoi de l\'export en attente…');
  const err = await sendExportWithRetries(item, manuel ? 3 : 1);
  _exportSending = false;
  if (!err) {
    // Un export plus récent a pu être mis en attente pendant l'envoi : on ne
    // supprime que celui qu'on vient d'envoyer.
    try { const cur = await idbGet(EXPORT_PENDING_KEY); if (cur && cur.at === item.at) await idbDel(EXPORT_PENDING_KEY); } catch (e) {}
    state.exportPending = null; render();
    showToast('📄 Export en attente envoyé sur Telegram ✓');
  } else if (manuel) showToast('⚠️ Toujours pas envoyé (' + (err.message || 'réseau') + ') — nouvel essai automatique dès que le réseau revient');
}
async function loadPendingExportStatus() {
  try { const item = await idbGet(EXPORT_PENDING_KEY); state.exportPending = item && item.html ? { at: item.at, size: item.html.length } : null; } catch (e) { state.exportPending = null; }
  render();
}

async function exportFile(complet) {
  let out;
  try { out = complet ? buildExportedHtml() : buildLightExport(); } catch (e) { console.error('export:', e); out = null; }
  if (!out) { showToast('⚠️ Export impossible'); return; }
  // Export complet nommé index.html : c'est le nom attendu par GitHub Pages, le
  // fichier peut donc être déposé tel quel. L'export léger porte un autre nom
  // pour ne jamais être confondu avec le fichier du site.
  const filename = complet ? 'index.html' : 'lacave-export.html';
  const caption = complet ? '📄 Fichier du site à jour' : '📄 Export léger (données)';
  // On travaille avec un Blob (toujours supporté) ; le constructeur File n'existe
  // pas dans certains WebViews (Android/Telegram) → on ne l'utilise que protégé.
  const blob = new Blob([out], { type: 'text/html' });
  // 1) Partage natif du téléphone si disponible (iOS surtout).
  try {
    if (typeof navigator !== 'undefined' && navigator.canShare && typeof File === 'function') {
      const file = new File([blob], filename, { type: 'text/html' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'La Cave 💥', text: 'Fichier du site à jour' });
        showToast('Fichier prêt à enregistrer/partager ✓');
        return;
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // partage annulé
    // sinon on tente les méthodes suivantes
  }
  // 2) Téléchargement classique : ne dépend d'aucun réseau, donc à tenter en
  //    premier. MAIS dans le navigateur intégré de Telegram (celui de cette
  //    mini-app), un clic <a download> ne déclenche souvent RIEN — sans
  //    erreur JS détectable. On ne peut donc pas se fier uniquement à lui.
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { console.error('download:', e); }
  // 3) Envoi Telegram, la méthode fiable dans le navigateur intégré de
  //    Telegram. Le fichier est d'abord mis en file d'attente sur l'appareil :
  //    si le réseau lâche, il repart tout seul plus tard au lieu d'être perdu.
  if (!tgReady()) { showToast('Fichier exporté ✓'); return; }
  const item = { html: out, filename, caption, at: Date.now() };
  try { await idbSet(EXPORT_PENDING_KEY, item); } catch (e) { console.error('file d\'attente export:', e); }
  _exportSending = true;
  showToast('Envoi du fichier' + (complet ? '' : ' (' + Math.max(1, Math.round(blob.size / 1024)) + ' Ko)') + '…');
  const err = await sendExportWithRetries(item, 3);
  _exportSending = false;
  if (!err) {
    try { const cur = await idbGet(EXPORT_PENDING_KEY); if (cur && cur.at === item.at) await idbDel(EXPORT_PENDING_KEY); } catch (e) {}
    state.exportPending = null; render();
    showToast('📄 Fichier exporté et envoyé sur Telegram ✓');
    return;
  }
  state.exportPending = { at: item.at, size: out.length }; render();
  showToast('📶 Réseau trop faible (' + (err.message || 'erreur') + ') — l\'export est gardé et partira tout seul dès que la connexion revient.');
}
window.addEventListener('online', () => flushPendingExport(false));
setInterval(() => flushPendingExport(false), 30000);
setTimeout(() => { loadPendingExportStatus(); flushPendingExport(false); }, 4000);

/* Synchro automatique vers le fichier serveur (Chrome/Edge, contexte sécurisé : https ou localhost) :
   on lie une fois le fichier .html réellement servi sur le disque via File System Access API, puis
   chaque validation de commande (nouvelle commande ou changement de statut) réécrit directement ce
   fichier avec le catalogue + les commandes à jour — plus besoin d'exporter/importer à la main. */
const FS_DB = 'cave420_fs', FS_STORE = 'handles', FS_KEY = 'serverFile';
function fsApiSupported() { return typeof window.showOpenFilePicker === 'function' && window.isSecureContext; }
function openFsDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(FS_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) { const db = await openFsDb(); return new Promise((res, rej) => { const tx = db.transaction(FS_STORE, 'readwrite'); tx.objectStore(FS_STORE).put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(key) { const db = await openFsDb(); return new Promise((res, rej) => { const tx = db.transaction(FS_STORE, 'readonly'); const r = tx.objectStore(FS_STORE).get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); }
async function idbDel(key) { const db = await openFsDb(); return new Promise((res, rej) => { const tx = db.transaction(FS_STORE, 'readwrite'); tx.objectStore(FS_STORE).delete(key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function refreshServerFileLinkStatus() {
  if (!fsApiSupported()) { state.serverFileLinked = null; render(); return; }
  try { const h = await idbGet(FS_KEY); state.serverFileLinked = !!h; } catch (e) { state.serverFileLinked = false; }
  render();
}
async function linkServerFile() {
  if (!fsApiSupported()) { showToast('⚠️ Indisponible : ouvre la page en HTTPS ou via http://localhost, avec Chrome/Edge'); return; }
  try {
    const [handle] = await window.showOpenFilePicker({ types: [{ description: 'Fichier HTML', accept: { 'text/html': ['.html'] } }] });
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { showToast('⚠️ Permission d\u2019écriture refusée'); return; }
    await idbSet(FS_KEY, handle);
    showToast('🔗 Fichier serveur lié — synchro automatique activée ✓');
    refreshServerFileLinkStatus();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.error('[link-server-file]', e); showToast('⚠️ Liaison impossible');
  }
}
async function unlinkServerFile() {
  try { await idbDel(FS_KEY); } catch (e) {}
  showToast('Liaison supprimée'); refreshServerFileLinkStatus();
}
async function autoSyncServerFile() {
  if (!fsApiSupported()) return;
  let handle;
  try { handle = await idbGet(FS_KEY); } catch (e) { return; }
  if (!handle) return;
  try {
    let perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return;
    const out = buildExportedHtml();
    if (!out) return;
    const writable = await handle.createWritable();
    await writable.write(out);
    await writable.close();
    showToast('🔗 Serveur synchronisé ✓');
  } catch (e) {
    console.error('[auto-sync]', e);
    showToast('⚠️ Synchro serveur échouée — relie le fichier à nouveau (Réglages)');
  }
}
refreshServerFileLinkStatus();

/* Export / Import des commandes : les commandes sont enregistrées uniquement dans le localStorage
   de l'appareil/origine qui les a reçues (fichier local, serveur http://..., Netlify...). Ces deux
   boutons permettent de faire un pont manuel entre ces historiques quand ils divergent (ou quand la
   synchro automatique ci-dessus n'est pas disponible, ex. Safari/iPhone). */
function exportOrders() {
  const list = loadJSON('cave420_orders', []);
  const arr = Array.isArray(list) ? list : [];
  if (!arr.length) { showToast('Aucune commande à exporter'); return; }
  const json = JSON.stringify(arr, null, 2);
  const blob = new Blob([json], { type: 'application/json' }); const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const a = document.createElement('a'); a.href = url; a.download = 'commandes-' + stamp + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); showToast(arr.length + ' commande(s) exportée(s) ✓');
}
function importOrdersFile() { document.getElementById('orders-import-input').click(); }
function mergeImportedOrders(imported) {
  if (!Array.isArray(imported)) { showToast('⚠️ Fichier invalide'); return; }
  const current = loadJSON('cave420_orders', []);
  const arr = Array.isArray(current) ? current.slice() : [];
  const byId = new Map(arr.map(o => [String(o.id), o]));
  let added = 0, updated = 0;
  imported.forEach(o => {
    if (!o || o.id == null) return;
    const key = String(o.id);
    if (byId.has(key)) { Object.assign(byId.get(key), o); updated++; }
    else { arr.push(o); byId.set(key, o); added++; }
  });
  arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  store('cave420_orders', arr);
  loadOrders();
  showToast('✅️ ' + added + ' ajoutée(s), ' + updated + ' mise(s) à jour');
}

/* ===== PHOTOS =====
   Partout dans l'appli, une photo est affichee en carre (object-fit: cover) :
   fiche produit, carte, panier, apercu admin. On stocke donc directement le
   carre central a la resolution reellement affichee. Avant, on bornait le
   GRAND cote a 1100 px : une photo en portrait 3/4 ne gardait que ~825 px de
   large, et la fiche produit plein ecran (1170 px sur un ecran x3) l'etirait
   -> le flou constate. PHOTO_SIZE couvre la fiche sans etirement.            */
const PHOTO_SIZE = 1200;
const PHOTO_MAX_CHARS = 400 * 1024;              // budget par photo (data URL)
const PHOTO_QUALITIES = [0.9, 0.86, 0.82, 0.78]; // on descend si le budget saute
// La photo de côté (gauche de la galerie) ne sert qu'à la fiche : un peu moins
// de pixels et un budget plus serré. 1000 px pour 1170 affichés sur un écran
// x3 : l'écart ne se voit pas, et elle pèse environ moitié moins.
const SIDE_PHOTO = { size: 1000, maxChars: 240 * 1024, qualities: [0.86, 0.82, 0.78, 0.74] };

function photoCanvas(side) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = side;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
  return cv;
}

// Carre central, reduit par paliers de moitie : un seul gros drawImage
// (3000 px -> 1200 px d'un coup) crenele et ecrase le detail fin.
function squarePhoto(img, size) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const side = Math.min(sw, sh);
  const sx = Math.round((sw - side) / 2), sy = Math.round((sh - side) / 2);
  const target = Math.min(size || PHOTO_SIZE, side);   // jamais d'agrandissement
  let step = target;
  while (step * 2 < side) step *= 2;             // plus grand palier utile
  let cv = photoCanvas(step);
  cv.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, step, step);
  while (step > target) {
    step = Math.max(target, Math.round(step / 2));
    const next = photoCanvas(step);
    next.getContext('2d').drawImage(cv, 0, 0, step, step);
    cv = next;
  }
  return cv;
}

function encodePhoto(cv, maxChars, qualities) {
  let data = '';
  for (const q of (qualities || PHOTO_QUALITIES)) {
    data = cv.toDataURL('image/jpeg', q);
    if (data.length <= (maxChars || PHOTO_MAX_CHARS)) break;
  }
  return data;
}

// opts (facultatif) : { size, maxChars, qualities } — voir SIDE_PHOTO.
function resizePhoto(file, cb, opts) {
  const o = opts || {};
  const reader = new FileReader();
  reader.onload = () => { const img = new Image(); img.onload = () => { try { cb(encodePhoto(squarePhoto(img, o.size), o.maxChars, o.qualities)); } catch (e) { console.error('photo:', e); showToast('⚠️ Photo trop lourde à traiter'); } }; img.onerror = () => showToast('Image illisible'); img.src = reader.result; };
  reader.readAsDataURL(file);
}

/* ===== VIDEO DU PRODUIT =====
   Une vidéo vit dans le fichier comme les photos, en data URL : son poids est
   donc le poids de l'appli pour tout le monde. On la recadre en carré (même
   cadrage que les photos), on la limite à VIDEO_MAX_SEC secondes et on la
   réencode en MP4 h264 — le seul format que lisent tous les téléphones. Si
   le navigateur ne sait pas réencoder, on garde le fichier tel quel à
   condition qu'il reste petit, sinon on refuse en l'expliquant.            */
// Qualité et fluidité d'abord, quitte à raccourcir : 720 px (la fiche s'affiche
// sur ~1 000 pixels réels d'un téléphone récent), 30 images/s à cadence
// régulière et 3 Mbit/s, sur 4 s au plus — ~1,5 Mo par vidéo. L'ancien réglage
// (540 px, 24 i/s, 500 kbit/s sur 8 s) donnait une image molle et saccadée.
const VIDEO_MAX_SEC = 4;
const VIDEO_SIZE = 720;
const VIDEO_FPS = 30;
const VIDEO_BPS = 3000000;
const VIDEO_KEEP_MAX = 2 * 1024 * 1024;   // fichier gardé tel quel en dessous
const VIDEO_HARD_MAX = 5 * 1024 * 1024;   // refus au-delà, réencodage compris

// Formats d'enregistrement, du meilleur au plus sûr : h264 High, puis Main,
// puis Baseline (niveau 3.1, nécessaire au 720 × 720 à 30 i/s). Si le
// téléphone annonce un profil mais échoue à l'enregistrer, on passe au suivant.
function recorderMimes() {
  if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return [];
  return ['video/mp4;codecs=avc1.64001F', 'video/mp4;codecs=avc1.4D401F', 'video/mp4;codecs=avc1.42E01F', 'video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .filter(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } });
}
function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('lecture impossible'));
    r.readAsDataURL(file);
  });
}
function reencodeVideo(file, onProgress, mime) {
  return new Promise((resolve, reject) => {
    const cv = document.createElement('canvas');
    if (!mime || typeof cv.captureStream !== 'function') { reject(new Error('pas de réencodage')); return; }
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.playsInline = true; v.preload = 'auto';
    let fait = false;
    const fini = (fn, arg) => { if (fait) return; fait = true; URL.revokeObjectURL(url); fn(arg); };
    v.onerror = () => fini(reject, new Error('vidéo illisible'));
    v.onloadedmetadata = () => {
      const side = Math.min(v.videoWidth, v.videoHeight);
      if (!side) { fini(reject, new Error('vidéo illisible')); return; }
      const duree = Math.min(v.duration || VIDEO_MAX_SEC, VIDEO_MAX_SEC);
      const taille = Math.min(VIDEO_SIZE, side - (side % 2));

async function prepareVideo(file, onProgress) {

  // dans ce cas on garde l'original, à condition qu'il se lise partout.
  const garde = async data => (lisiblePartout && file.size <= VIDEO_KEEP_MAX && file.size * 1.37 < data.length) ? await fileToDataURL(file) : data;

      const data = await blobToDataURL(new Blob(muxMp4H264(r.chunks, r.description, r.width, r.height), { type: 'video/mp4' }));
      if (data.length <= VIDEO_HARD_MAX * 1.37) return await garde(data);
      throw new Error('trop lourde');
    }
  } catch (e) { console.warn('encodage image par image:', e && e.message); }
  // 2) Secours : enregistrement en direct (MediaRecorder).
  for (const mime of recorderMimes()) {
    try {
      const data = await reencodeVideo(file, onProgress, mime);
      if (data && data.length <= VIDEO_HARD_MAX * 1.37) return await garde(data);
      break; // trop lourde : un autre format ne ferait pas mieux
    } catch (e) { console.warn('réencodage vidéo (' + mime + '):', e && e.message); }
  }
  if (file.size <= VIDEO_HARD_MAX && lisiblePartout) return await fileToDataURL(file);
  throw new Error('trop lourde');
}

/* Petite vibration au toucher des boutons : celle de Telegram (iPhone et
   Android) et, en plus, l'API de vibration du navigateur là où elle existe
   (Android) — le retour haptique de Telegram y suit le réglage « vibration
   au toucher » du téléphone, souvent coupé. Trois crans : forte pour les
   boutons principaux (Ajouter au panier, Commander, Valider, Enregistrer…),
   toute petite pour les quatre filtres ❤️ % 🆕 🔜 (« selection », le tic

  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.HapticFeedback && (!tg.isVersionAtLeast || tg.isVersionAtLeast('6.1'))) {
      if (force === 'selection') tg.HapticFeedback.selectionChanged(); else tg.HapticFeedback.impactOccurred(force);

    note(493.88, 0, 0.18, 0.05, 'triangle');   // un peu de corps, une octave plus bas
    note(1318.51, 0.075, 0.32, 0.14, 'sine');  // mi, au-dessus

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;

  else if (t.id === 'co-tg') { const f = formatTgValue(t.value); t.value = f; state.checkoutDraft.tg = f; }

    // donne 9 €, surtout pas 999 €.

    // l'indique (« Maximum … ») plutôt que d'avaler la frappe.

    // le champ perdrait le focus (et le clavier se fermerait) sur mobile.

    const te = state.tranchePicker.edit;
    if (d.trf && d.tri !== undefined) { const f = te.formats[Number(d.tri)]; if (f) f[d.trf] = t.value; }

  if (state.loyaltyEdit && d.lfield) state.loyaltyEdit.draft[d.lfield] = t.value;

/* Fenêtre 🖍 : formats rangés par prix (10 € en haut). Le bouton du haut

function trancheBoutonHaut(e) {

/* Range les formats remplis par prix croissant ; une ligne encore vide

function trierFormatsEdition(e) {

  const pleins = e.formats.map((f, i) => ({ f, i, p: parsePrice(f.prix) })).filter(x => x.p > 0);

/* Après affichage : centre la tranche voulue (comme une liste Android qui

function placerTranches(root, prevEdit, prevScroll) {
  const tp = state.tranchePicker, dlg = root.querySelector('.tr-dlg'); if (!tp || !dlg) return;
  const enEdition = dlg.classList.contains('tr-edit');
  const tete = dlg.querySelector('.tr-entete'), H = tete ? tete.offsetHeight : 0;
  // Puce de l'unité affichée toujours visible (la rangée défile de côté)
  const uns = dlg.querySelector('.tr-unites'), on = uns && uns.querySelector('.tr-unite.on');
  if (on) uns.scrollLeft += on.getBoundingClientRect().left - uns.getBoundingClientRect().left - (uns.clientWidth - on.offsetWidth) / 2;
  if (!enEdition && tp.centrerIdx != null) {
    const l = dlg.querySelector('.tr-ligne[data-idx="' + tp.centrerIdx + '"]');
    if (l) dlg.scrollTop = Math.max(0, l.offsetTop - H - (dlg.clientHeight - H - l.offsetHeight) / 2);
    tp.centrerIdx = null;
  } else if (!enEdition && tp.hautListe) { dlg.scrollTop = 0; tp.hautListe = false; }
  else if (!enEdition && tp.listeScroll != null && prevEdit) { dlg.scrollTop = tp.listeScroll; tp.listeScroll = null; }
  else if (prevEdit === enEdition) dlg.scrollTop = prevScroll;

  }
}

// Rattrapage async : si IndexedDB détient une copie plus récente que ce qui
// a pu être lu de façon synchrone au démarrage (ex. localStorage plein, resté
// sur une copie plus ancienne), on l'adopte dès qu'elle est disponible.
// Plus récente = une version plus haute, ou la même version modifiée plus tard
// sur l'appareil. Une version plus BASSE n'est jamais reprise : c'est qu'un
// fichier plus récent a été déployé depuis, et il fait autorité.
function idbCopyIsNewer(idbCat, cur) {
  if (!idbCat || !Array.isArray(idbCat.products) || !Array.isArray(idbCat.categories)) return false;
  const vi = idbCat.version || 0, vc = (cur && cur.version) || 0;
  if (vi !== vc) return vi > vc;
  return (idbCat.saved_at || 0) > ((cur && cur.saved_at) || 0);
}
