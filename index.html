<html lang="fr" style="--tg-color-scheme: dark; --tg-theme-bg-color: #212d3b; --tg-theme-section-bg-color: #1d2733; --tg-theme-secondary-bg-color: #151e27; --tg-theme-text-color: #ffffff; --tg-theme-hint-color: #7d8b99; --tg-theme-link-color: #5eabe1; --tg-theme-button-color: #229af0; --tg-theme-button-text-color: #ffffff; --tg-theme-header-bg-color: #242d39; --tg-theme-accent-text-color: #64b5ef; --tg-theme-section-header-text-color: #79c4fc; --tg-theme-subtitle-text-color: #7b8790; --tg-theme-destructive-text-color: #ee686f; --tg-theme-section-separator-color: #0d1218; --tg-theme-bottom-bar-bg-color: #151e27; --tg-viewport-height: 728px; --tg-viewport-stable-height: 728px; --tg-safe-area-inset-top: 0px; --tg-safe-area-inset-bottom: 0px; --tg-safe-area-inset-left: 0px; --tg-safe-area-inset-right: 0px; --tg-content-safe-area-inset-top: 0px; --tg-content-safe-area-inset-bottom: 0px; --tg-content-safe-area-inset-left: 0px; --tg-content-safe-area-inset-right: 0px;"><head>

<title>La Cave 💥</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --surface: #0A0A0B; --on-surface: #FFFFFF; --surface-secondary: #16161A;
  --surface-tertiary: #1F1F25; --brand: #0666EB; --brand-purple: #7B5FF6;
  --success: #22C55E; --warning: #F59E0B; --error: #EF4444;
  --border: #27272A; --border-strong: #3F3F46; --muted: #A1A1AA;
  --radius: 14px; --radius-lg: 22px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--surface); color: var(--on-surface); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
/* Fonds d'écran des pages Commandes (taxi), Panier (stand en vue large) et
   Passer commande (gros plan du stand), cf. majFond(). Chaque calque a les
   proportions des photos et couvre l'écran. Le gros plan correspond à la zone
   du stand agrandie ×3 dans la vue large : en zoomant la vue large de ×3
   autour de ce point (transform-origin) et le gros plan de ×1/3 → ×1, les deux
   photos restent superposées pendant le fondu. */
#fond-page { position: fixed; top: 0; bottom: 0; left: 50%; width: 100%; max-width: 480px; transform: translateX(-50%); overflow: hidden; z-index: 0; pointer-events: none; opacity: .6; } /* photos discrètes : transparentes sur le fond sombre */
.fond-calque { position: absolute; left: 50%; top: 50%; width: max(100%, calc(100vh * 768 / 1376)); aspect-ratio: 768 / 1376; background: center / 100% 100% no-repeat; opacity: 0; transform: translate(-50%, -50%); transform-origin: 58.6% 60.6%; transition: opacity .6s ease, transform .9s cubic-bezier(.45, 0, .2, 1); will-change: opacity, transform; }
#fond-page.charge-taxi .fc-taxi { background-image: url(fonds/taxi.jpg); }
#fond-page.charge-stand .fc-large { background-image: url(fonds/stand.jpg); }
#fond-page.charge-stand .fc-zoom { background-image: url(fonds/stand-zoom.jpg); }
.fond-calque.fc-zoom { transform: translate(-50%, -50%) scale(0.3333); }
#fond-page[data-zoom="zoom"] .fc-large { transform: translate(-50%, -50%) scale(3); }
#fond-page[data-zoom="zoom"] .fc-zoom { transform: translate(-50%, -50%) scale(1); }
#fond-page[data-vue="taxi"] .fc-taxi,
#fond-page[data-vue="stand"][data-zoom="large"] .fc-large,
#fond-page[data-vue="stand"][data-zoom="zoom"] .fc-zoom { opacity: 1; }
/* Zoom Panier ↔ Passer commande : la vue large (dessous) reste opaque pendant
   que le gros plan (dessus) apparaît ou s'efface : pas de baisse de lumière. */
#fond-page:not(.fige) .fc-large { transition: opacity 0s linear .9s, transform .9s cubic-bezier(.45, 0, .2, 1); }
#fond-page:not(.fige)[data-zoom="large"] .fc-large { transition: opacity 0s, transform .9s cubic-bezier(.45, 0, .2, 1); }
#fond-page:not(.fige) .fc-zoom { transition: opacity .9s ease, transform .9s cubic-bezier(.45, 0, .2, 1); }
/* Arrivée depuis une autre page : simple fondu, sans zoom. */
#fond-page.fige .fond-calque { transition: opacity .6s ease; }
.fond-voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,11,0.7) 0%, rgba(10,10,11,0.52) 35%, rgba(10,10,11,0.52) 65%, rgba(10,10,11,0.7) 100%); opacity: 0; transition: opacity .6s ease; }
#fond-page[data-vue="taxi"] .fond-voile, #fond-page[data-vue="stand"] .fond-voile { opacity: 1; }
/* Textes posés directement sur la photo : une ombre pour rester lisibles. */
body.avec-fond .content { text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.6); }
body.avec-fond .content .hint, body.avec-fond .content .empty p { color: #C9CDD3; }
/* Articles offerts (le marché) et Horaires (le chemin) : photo en fond de la
   fenêtre, aussi discrète que les fonds de page (~60 % sous un voile sombre).
   Le fond reste en place quand on fait défiler la liste. */
.modal.modal-cagnotte, .modal.modal-horaires { background: linear-gradient(180deg, rgba(22,22,26,0.82) 0%, rgba(22,22,26,0.71) 35%, rgba(22,22,26,0.71) 65%, rgba(22,22,26,0.82) 100%), var(--photo-modale) center / cover no-repeat, var(--surface-secondary); text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.6); }
.modal.modal-cagnotte { --photo-modale: url(fonds/marche.jpg); }
.modal.modal-horaires { --photo-modale: url(fonds/horaires.jpg); }
.modal.modal-cagnotte .modal-desc, .modal.modal-horaires .hint:not([style*="warning"]) { color: #C9CDD3; }
/* Horaires : jours et créneaux un peu transparents pour laisser voir la photo. */
.modal-horaires .hrs-day { background: rgba(31,31,37,0.55); }
.modal-horaires .hrs-day.today { background: rgba(34,197,94,0.12); }
.modal-horaires .hrs-window { background: rgba(22,22,26,0.6); }
.modal-horaires .hrs-window.live { background: rgba(34,197,94,0.15); }
.modal-horaires .slot-btn { background: rgba(31,31,37,0.55); }
.modal-horaires .slot-btn.slot-off { background: rgba(239,68,68,0.12); }
.modal-horaires .slot-btn.slot-delivery-off { background: rgba(245,158,11,0.12); }
@media (prefers-reduced-motion: reduce) { #fond-page .fond-calque { transition: opacity .3s ease !important; } }
.header { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 100; }
.header h1 { font-size: 20px; font-weight: 700; user-select: none; -webkit-user-select: none; cursor: default; }
.header-right { display: flex; align-items: center; gap: 10px; }
.hours-pill { height: 40px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-secondary); color: var(--on-surface); cursor: pointer; font-family: inherit; }
.logout-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(239,68,68,0.45); background: rgba(239,68,68,0.10); color: var(--error); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; padding: 0; }
.logout-btn svg { width: 18px; height: 18px; }
.logout-btn:active { transform: scale(0.92); }
.hours-pill .hp-ico { font-size: 16px; line-height: 1; }   /* même taille que 🛒 */
.open-pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.open-pill.open { background: rgba(34,197,94,0.15); color: var(--success); }
.open-pill.closed { background: rgba(239,68,68,0.15); color: var(--error); }
.cart-badge { position: relative; background: var(--surface-secondary); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); }
.cart-badge .count { position: absolute; top: -4px; right: -4px; background: var(--brand); color: white; font-size: 11px; font-weight: 700; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
.content { flex: 1; padding: 8px 16px 16px; overflow-y: auto; }
.tab-bar { display: flex; border-top: 1px solid var(--border); background: var(--surface-secondary); position: sticky; bottom: 0; z-index: 100; padding: 2px 6px calc(2px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 18px rgba(0,0,0,0.35); }   /* au-dessus des badges et logos des cartes qui défilent dessous */
.tab { flex: 1; padding: 7px 4px 8px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; transition: color 0.2s, transform 0.12s ease; }
/* Icône posée sur une pastille qui s'allume sous l'onglet actif */
.tab .tab-ico { position: relative; display: flex; align-items: center; justify-content: center; width: 54px; height: 30px; border-radius: 999px; font-size: 19px; line-height: 1; transition: background 0.25s ease, transform 0.25s cubic-bezier(.34,1.56,.64,1); }
.tab.active { color: var(--brand); }
.tab.active .tab-ico { background: rgba(6,102,235,0.18); transform: translateY(-1px) scale(1.08); box-shadow: inset 0 0 0 1px rgba(6,102,235,0.35); }
.tab:active { transform: scale(0.9); }
.tab:active .tab-ico { background: rgba(255,255,255,0.08); }
.tab .tab-count { position: absolute; top: -3px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--error); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--surface-secondary); }
.promo-banner { background: rgba(245,255,0,0.12); border: 1px solid rgba(245,255,0,0.35); border-radius: var(--radius); padding: 6px 12px; margin-bottom: 6px; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.35; color: #29b6f6; white-space: pre-line; }
.loyalty-banner-wrap { background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(123,95,246,0.12)); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius); padding: 6px 10px; margin-bottom: 8px; }
.loyalty-banner { display: flex; align-items: center; gap: 10px; }
.loyalty-banner .amt { font-size: 24px; font-weight: 800; color: var(--warning); line-height: 1.15; white-space: nowrap; }
.loyalty-gauge { margin-top: 5px; }
.loyalty-gauge .lg-track { position: relative; height: 16px; border-radius: 999px; background: rgba(125,139,153,0.22); overflow: hidden; }
.loyalty-gauge .lg-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, var(--warning), var(--brand)); transition: width 0.3s ease; }
/* Textes dans la jauge : le montant atteint au bout du remplissage, l'objectif
   au bout de la jauge, « prochain € offert » en transparence dans la plus
   grande des deux zones (masqué s'il n'y tient pas, cf. ajusterSacs). */
.loyalty-gauge .lg-txt { position: absolute; inset: 0; display: flex; align-items: center; font-size: 10px; font-weight: 700; line-height: 1; white-space: nowrap; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.loyalty-gauge .lg-zone { display: flex; align-items: center; height: 100%; min-width: 0; }
.loyalty-gauge .lg-zone.rempli { flex: 0 1 auto; }
.loyalty-gauge .lg-zone.reste { flex: 1 0 auto; }
.loyalty-gauge .lg-libre { flex: 1 1 0; min-width: 0; overflow: hidden; text-align: center; padding: 0 4px; font-weight: 600; opacity: 0.5; }
.loyalty-gauge .lg-pointe { flex: none; padding: 0 5px; }
.loyalty-gauge .lg-but { flex: none; padding: 0 8px 0 4px; color: rgba(255,255,255,0.85); }
.loyalty-gauge .lg-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.15); }
.loyalty-banner .lb-texte { flex: 1; min-width: 0; }
/* 💰 sur la ligne du montant, dans l'espace libre à sa droite (cf. ajusterSacs). */
.loyalty-banner .lb-sacs { flex: 1 1 0; min-width: 0; height: 28px; contain: size; display: grid; justify-content: end; align-content: center; column-gap: 1px; line-height: 1.1; overflow: hidden; font-size: 16px; }
.loyalty-banner .amt-row { display: flex; align-items: center; gap: 10px; }
/* Bannière cliquable (ouvre les articles offerts) : petite flèche sur le 🎁. */
.loyalty-banner-wrap[data-action] { cursor: pointer; transition: transform .12s ease; -webkit-tap-highlight-color: transparent; }
.loyalty-banner-wrap[data-action]:active { transform: scale(0.98); }
.loyalty-banner .lb-gift { position: relative; font-size: 22px; line-height: 1; }
.loyalty-banner .lb-gift::after { content: '›'; position: absolute; right: -7px; bottom: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 13px; font-weight: 900; line-height: 12px; text-align: center; box-shadow: 0 0 0 1.5px var(--surface); animation: lbPouls 2.4s ease-in-out infinite; }
@keyframes lbPouls { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.25); } 90% { transform: scale(0.95); } }
@media (prefers-reduced-motion: reduce) { .loyalty-banner .lb-gift::after { animation: none; } }
.status-banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); margin-bottom: 16px; }
.status-banner.open { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
.status-banner.closed { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
.status-banner .dot { font-size: 14px; }
.status-banner.open .dot { color: var(--success); }
.status-banner.closed .dot { color: var(--error); }
.status-banner .st-main { font-weight: 700; font-size: 15px; }
.status-banner .st-sub { font-size: 12px; color: var(--muted); }
.status-banner .hours-btn { flex: none; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: 1px solid currentColor; background: transparent; cursor: pointer; font-family: inherit; white-space: nowrap; }
.status-banner.open .hours-btn { color: var(--success); }
.status-banner.closed .hours-btn { color: var(--error); }
.hrs-status { font-weight: 600; }
.hrs-status.open { color: var(--success); }
.hrs-status.closed { color: var(--error); }
.hrs-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.hrs-day { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--surface-tertiary); flex-wrap: wrap; }
.hrs-day.today { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
.hrs-day-label { font-size: 13px; font-weight: 600; }
.hrs-day.today .hrs-day-label { color: var(--success); }
.hrs-windows { display: flex; flex-wrap: wrap; gap: 6px; }
.hrs-window { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-secondary); border: 1px solid var(--border); }
.hrs-window.closed { color: var(--muted); font-weight: 500; }
.hrs-window.live { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: var(--success); }
.hrs-window.past { opacity: 0.45; }
.hrs-day.clickable { cursor: pointer; }
.hrs-chevron { display: inline-block; vertical-align: 1px; width: 16px; height: 16px; margin-left: 8px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 14px; font-weight: 900; line-height: 15px; text-align: center; text-shadow: none; }
.hrs-chevron::before { content: '›'; display: inline-block; transform: rotate(90deg); transition: transform .2s ease; }
.hrs-chevron.ouvert::before { transform: rotate(-90deg); }
.wd-badge { font-size: 11px; }
.hrs-grid { flex-basis: 100%; margin-top: 8px; }
.slot-btn.slot-delivery-off { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.45); color: var(--warning); }
.categories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-bottom: 12px; }
.categories > .cat-chip { padding: 8px 4px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
.cat-chip { padding: 8px 16px; border-radius: 999px; background: var(--surface-secondary); border: 1px solid var(--border); font-size: 13px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
.cat-chip.active { background: var(--brand); border-color: var(--brand); color: white; }
/* Petit point jaune en haut à droite d'une case qui contient des nouveautés. */
.cat-chip { position: relative; }
.cat-chip .new-dot { position: absolute; top: 4px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: #FACC15; box-shadow: 0 0 5px rgba(250,204,21,0.8); pointer-events: none; }
.cat-chip.cat-icon .new-dot { right: 8px; }
/* Les quatre filtres de badges : rectangles aux angles plus vifs, teintés de
   la couleur de leur badge, pour ne pas les confondre avec les catégories. */
.cat-chip.cat-virtual { border-radius: 10px; padding: 6px 12px 6px 9px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.cat-chip.cat-virtual .cat-badge { margin-right: 0; vertical-align: 0; flex: none; }
.cat-chip.cat-wide { flex: 1 1 0; justify-content: center; }

.cat-chip.t-popular { background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.45); }
.cat-chip.t-coming { background: rgba(6,102,235,0.10); border-color: rgba(6,102,235,0.55); }
.cat-chip.t-new { background: rgba(22,163,74,0.14); border-color: rgba(22,163,74,0.85); }
.cat-chip.t-promo { background: rgba(234,179,8,0.13); border-color: rgba(234,179,8,0.85); }
.cat-chip.cat-virtual.active { color: #fff; }
.cat-chip.t-popular.active { background: #991B1B; border-color: #EF4444; }   /* rouge sombre : le ❤️ reste visible */
.cat-chip.t-coming.active { background: var(--brand); border-color: var(--brand); }
.cat-chip.t-new.active { background: #16A34A; border-color: #16A34A; }
.cat-chip.t-promo.active { background: #EAB308; border-color: #EAB308; }
.cat-row-wide { grid-column: 1 / -1; display: flex; gap: 8px; align-items: stretch; }
.cat-chip.cat-icon { flex: 1 1 0; min-width: 0; justify-content: center; padding: 7px 0; }
.cat-chip.cat-icon .cat-badge { width: 24px; height: 24px; font-size: 13px; }
/* Chaque filtre porte le logo du badge qu'il suit, aux mêmes couleurs que
   sur les produits : la puce et le badge se reconnaissent d'un coup d'œil. */
.cat-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #fff; line-height: 1; vertical-align: -5px; margin-right: 3px; }
.cat-chip.t-promo.active .cat-badge.b-promo { color: #0A0A0B; text-shadow: none; }   /* % noir sur le jaune plein */
/* ❤️, %, 🆕 et 🔜 sans rond, en plus gros ; le % blanc, noir sur le jaune
   plein une fois coché. */
.cat-badge.b-popular, .cat-badge.b-new, .cat-badge.b-coming, .cat-badge.b-promo { background: none; }
.cat-chip.cat-icon .cat-badge.b-popular, .cat-chip.cat-icon .cat-badge.b-new, .cat-chip.cat-icon .cat-badge.b-coming, .cat-chip.cat-icon .cat-badge.b-promo { font-size: 21px; }
.cat-chip.cat-icon .cat-badge.b-promo { font-size: 22px; font-weight: 900; }
.cat-chip.cat-icon .cat-badge.b-coming img { display: block; width: 24px; height: 24px; }   /* 🔜 en image (SOON_ICON) */
.products { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 12px; }
.product-card { background: var(--surface-secondary); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.2s; border: 1px solid var(--border); }
.product-card:active { transform: scale(0.97); }
.product-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center; display: block; }
.product-card .info { padding: 10px; position: relative; overflow: hidden; }
.product-card .info > :not(.card-deco) { position: relative; z-index: 1; }
.card-deco { position: absolute; inset: 0; pointer-events: none; opacity: 0.35; z-index: 0; }
.card-deco span { position: absolute; line-height: 1; filter: saturate(0.9); }
.product-card .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-card .price { font-size: 14px; font-weight: 700; color: var(--brand); }
.product-card .old-price { font-size: 12px; color: var(--muted); text-decoration: line-through; margin-left: 6px; }
.alt-btn { margin-top: 8px; width: 100%; background: rgba(6,102,235,0.12); color: var(--brand); border: 1px solid rgba(6,102,235,0.35); border-radius: 10px; font-size: 11.5px; font-weight: 700; padding: 7px 8px; cursor: pointer; line-height: 1.2; }
.alt-btn:active { transform: scale(0.97); }
.alt-item { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
.alt-item:active { border-color: var(--brand); }
.alt-item img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; }
.alt-item .alt-info { flex: 1; min-width: 0; }
.alt-item .alt-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.alt-item .alt-price { font-size: 13px; font-weight: 700; color: var(--brand); }
.alt-item .alt-go { color: var(--muted); font-size: 22px; font-weight: 700; flex: none; }
.mix-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; margin-left: 6px; padding: 2px 7px; border-radius: 999px; background: transparent; color: #3D8BFF; border: 1px solid rgba(6,102,235,0.75); vertical-align: middle; white-space: nowrap; line-height: 1.4; }
/* Simple « mix possible », sans incidence sur le montant annoncé : badge
   plein, flèches blanches ; quand le prix affiché dépend du mix, contour
   bleu seul, sans fond. */
.mix-badge.mix-plein { background: rgba(6,102,235,0.28); color: #fff; border-color: #0666EB; }
.mix-badge svg { display: block; }
/* Bas de la photo, sur une ligne : le logo 📷 à gauche, le prix des 10 g au
   milieu (dans l'angle gauche s'il n'y a pas de 📷), le logo 🎥/📷 à droite.
   Grille 1fr/auto/1fr : le prix reste centré, et ne se décale que du strict
   nécessaire quand un côté est plus large.
   RUPTURE prend la place du prix des 10 g, et le stock restant suit le 📷
   (ou prend l'angle gauche). Haut : logos ronds côte à côte à gauche. */
.corner-bar { position: absolute; left: 6px; right: 6px; bottom: 6px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 4px; z-index: 3; }
.cb-left, .cb-right { display: flex; align-items: center; gap: 4px; }
.cb-right { justify-content: flex-end; }
/* Stock, logo mix et prix des 10 g se suivent ; le logo mix se pose entre les
   deux cadres en mordant un peu sur chacun. Bleu plein, flèches blanches =
   mix possible ; contour bleu, flèches bleues = le prix annoncé en dépend.
   Un toucher ouvre le mix. */
.cb-group { display: flex; align-items: center; gap: 4px; }
.card-mix { position: relative; z-index: 1; flex: none; box-sizing: border-box; width: 20px; height: 20px; margin: 0 -8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #3D8BFF; background: transparent; border: 1px solid rgba(6,102,235,0.9); cursor: pointer; }
.card-mix:first-child { margin-left: 0; }
.card-mix:last-child { margin-right: 0; }
.card-mix svg { width: 12px; height: 12px; }
.card-mix.mix-plein { color: #fff; background: rgba(6,102,235,0.28); border-color: #0666EB; }
.products:not(.list-view) .price .mix-badge { display: none; }
.products.list-view .card-mix { display: none; }
.top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; column-gap: 4px; z-index: 2; }
/* Bandeau d'angle : la ligne du haut s'arrête avant sa diagonale. */
.products:not(.list-view) .img-wrap.has-ribbon .top-bar { right: 52px; }
.price10 { font-size: 10px; font-weight: 800; color: #0A0A0B; padding: 2px 7px; border-radius: 7px; border: 1px solid #FDE047; background: rgba(253,224,71,0.25); white-space: nowrap; line-height: 1.4; }
/* Tout ce qui est posé sur les photos des cartes est translucide : la photo
   transparaît sous les pastilles, les messages et le bandeau Nouveau. */
.product-card .badge-round { box-shadow: none; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
.product-card .badge-round.b-promo { background: none; border: 1.5px solid #7B5FF6; color: #0A0A0B; font-weight: 900; text-shadow: none; }   /* cartes : rond violet, sans fond */
.product-card .badge-round.b-promo.sur-sombre { color: #fff; }   /* photo sombre sous le % */
.product-card .badge-round.b-popular { background: none; border: none; }
.product-card .badge2 { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); border: 1px solid transparent; }
.product-card .badge2.b-rupture { background: rgba(239,68,68,0.28); border-color: rgba(239,68,68,0.95); }
.product-card .new-ribbon span { background: rgba(6,102,235,0.5); box-shadow: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.product-card .new-ribbon.coming span { background: rgba(56,189,248,0.55); }
.product-card .badge { position: absolute; top: 8px; left: 8px; background: var(--brand-purple); color: white; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.product-card .stock-badge { position: absolute; top: 8px; right: 8px; background: var(--error); color: white; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.product-card .img-wrap { position: relative; }
/* Au bout de la rangée des filtres : Grille/Liste (l'icône suit la vue) et
   Trier par (bleu dès qu'un tri ou une provenance est actif). */
.list-tools { display: flex; gap: 6px; flex: none; align-items: center; }
.tool-btn { position: relative; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--surface-secondary); border: 1px solid var(--border); color: var(--on-surface); cursor: pointer; padding: 0; transition: background .15s, border-color .15s; }
.tool-btn svg { width: 18px; height: 18px; }
.tool-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.tool-btn .tb-count { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #fff; color: var(--brand); font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; }
/* Menu Trier par : les tris actifs s'écrivent en bleu, avec la double flèche
   qui inverse le sens tout à droite ; les provenances en pastilles. */
.sort-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.35); }
.sort-menu { position: fixed; width: min(300px, calc(100vw - 32px)); overflow-y: auto; background: var(--surface-secondary); border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); animation: smIn .14s ease-out; }
@keyframes smIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.sort-menu.no-anim { animation: none; }
.sm-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.sm-row { display: flex; align-items: center; border-radius: 10px; }
.sm-row.on { background: rgba(6,102,235,0.14); }
.sm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: none; border: none; color: var(--on-surface); padding: 9px 10px; text-align: left; cursor: pointer; font: inherit; }
.sm-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
.sm-hint { font-size: 12px; color: var(--muted); }
.sm-row.on .sm-lbl, .sm-row.on .sm-hint { color: #3D8BFF; }
.sm-rev { flex: none; width: 40px; height: 40px; margin-right: 3px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid rgba(61,139,255,0.55); background: transparent; color: #3D8BFF; cursor: pointer; padding: 0; }
.sm-rev svg { width: 18px; height: 18px; }
.sm-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.sm-sub { font-size: 15px; font-weight: 600; padding: 6px 10px 2px; }
.sm-sub.on { color: #3D8BFF; }
.sm-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px 8px; }
.sm-chip { border: 1px solid var(--border-strong); background: var(--surface-tertiary); color: var(--on-surface); border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.sm-chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.sm-chip .sm-n { opacity: .6; font-size: 11px; margin-left: 3px; }
.sm-empty { font-size: 12px; color: var(--muted); }
.sm-reset { display: block; width: calc(100% - 8px); margin: 2px 4px 4px; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
.empty .btn { width: auto; padding: 10px 16px; margin-top: 12px; }
.products.list-view { grid-template-columns: 1fr; gap: 10px; }
.products.list-view .product-card { display: flex; align-items: stretch; }
.products.list-view .product-card .img-wrap { width: 96px; flex: none; }
.products.list-view .product-card img { width: 96px; height: 96px; aspect-ratio: 1 / 1; }
.products.list-view .product-card .info { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; }
.products.list-view .product-card .name { -webkit-line-clamp: 2; margin-bottom: 6px; font-size: 14px; }
/* Angle haut gauche : les logos ronds côte à côte (le centre de la photo
   reste dégagé), ou à défaut le stock restant. */
.badges-left { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.badge-logos, .badge-msgs { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.badge-logos { flex-direction: row; }
.product-card .badge2.b-lowstock { background: rgba(200,85,60,0.25); border-color: #C8553C; color: #0A0A0B; text-shadow: none; }
.badge2 { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; color: white; white-space: nowrap; }
.badge2.b-promo { background: var(--brand-purple); }
.badge2.b-popular { background: #38BDF8; color: #0A0A0B; }
.badge2.b-coming { background: #38BDF8; color: #0A0A0B; }
.badge2.b-lowstock { background: #C8553C; color: #0A0A0B; }
.badge2.b-rupture { background: var(--error); }
.badge2.b-new { background: var(--brand); }
/* Bandeau d'angle « Nouveau » (moins de 48 h) : bande bleue en diagonale dans
   l'angle haut droit de la vignette, rognée par le coin arrondi de la carte. */
.new-ribbon { position: absolute; top: 0; right: 0; width: 68px; height: 68px; overflow: hidden; pointer-events: none; z-index: 3; }
.new-ribbon.coming span { background: #38BDF8; }
.new-ribbon span { position: absolute; top: 12px; right: -26px; width: 100px; padding: 3px 0; background: var(--brand); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; text-align: center; line-height: 1.5; transform: rotate(45deg); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
/* En vue Liste la vignette ne fait que 96 px : bandeau réduit, et logos et
   messages un cran plus petits pour tenir à gauche de la diagonale. */
.products.list-view .new-ribbon { width: 50px; height: 50px; }
.products.list-view .new-ribbon span { top: 7px; right: -24px; width: 80px; font-size: 8px; padding: 2px 0; }
.products.list-view .top-bar { top: 6px; left: 6px; right: 6px; }
.products.list-view .badges-left { gap: 3px; }
.products.list-view .badge-logos, .products.list-view .badge-msgs { gap: 3px; }
/* Vue liste : le stock se range tout en haut, sur la ligne des logos (%, ❤️),
   quand il y a la place à gauche du bandeau d'angle ; sinon juste dessous. */
.products.list-view .top-bar { display: block; }
.products.list-view .badges-left { flex-direction: row; flex-wrap: wrap; align-items: center; }
.products.list-view .img-wrap.has-ribbon .top-bar { right: 36px; }
.products.list-view .badge-round { width: 22px; height: 22px; font-size: 11px; }
.products.list-view .badge2 { font-size: 9px; padding: 2px 6px; }
.badge-round { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 800; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35); line-height: 1; }
.badge-round.b-promo { background: none; box-shadow: none; font-size: 19px; font-weight: 900; }   /* % seul, sans rond */
.badge-round.b-popular { background: none; box-shadow: none; font-size: 19px; }
/* Mêmes pastilles que les cartes de l'accueil, mais en ligne : hors de l'image
   il n'y a plus de superposition, on les aligne donc et on réduit les rondes à
   la taille d'un texte de liste (sélecteur de cagnotte). */
.tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 3px; }
.tag-row .badge-round { width: 18px; height: 18px; font-size: 10px; box-shadow: none; }
.tag-row .badge-round.b-popular, .tag-row .badge-round.b-promo { font-size: 14px; }
.tag-row .badge2 { font-size: 9px; padding: 2px 6px; }
.card-dim { opacity: 0.55; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--surface-secondary); border-radius: var(--radius-lg) var(--radius-lg) 0 0; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; animation: slideUp 0.3s ease; }
.modal.no-anim { animation: none; }
.modal-nav-btn { position: absolute; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.55); border: none; color: white; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.modal-nav-btn.left { left: 14px; }
.modal-nav-btn.right { right: 14px; }
.modal-nav-btn:active { background: rgba(0,0,0,0.8); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal > img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center; display: block; }
/* Galerie de la fiche produit : bande qui se fait glisser au doigt, un cran par photo */
.photo-gal { position: relative; }
.photo-strip { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.photo-strip::-webkit-scrollbar { display: none; }
.photo-strip img, .photo-strip video { flex: 0 0 100%; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center; display: block; scroll-snap-align: center; scroll-snap-stop: always; -webkit-user-drag: none; user-select: none; background: #000; }
/* Vidéo hébergée à part (media/…) : rien n'est téléchargé tant que le client
   ne la demande pas. La case montre la photo principale assombrie et un
   bouton ; un toucher charge la vidéo, qui prend sa place. */
.photo-strip .gal-vid-lazy { flex: 0 0 100%; width: 100%; aspect-ratio: 1 / 1; position: relative; scroll-snap-align: center; scroll-snap-stop: always; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.photo-strip .gal-vid-lazy img { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; filter: blur(2px) brightness(.55); transform: scale(1.04); }
.gal-vid-play { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; border: none; background: none; color: #fff; font: inherit; font-weight: 700; font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.6); cursor: pointer; }
.gal-vid-play .rond { width: 74px; height: 74px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 30px; padding-left: 5px; box-shadow: 0 6px 22px rgba(0,0,0,.45); transition: transform .15s; }
.gal-vid-play:active .rond { transform: scale(.92); }
.gal-vid-lazy.charge .rond { animation: galpulse 1s ease-in-out infinite; }
@keyframes galpulse { 50% { opacity: .5; transform: scale(.94); } }
/* Les deux raccourcis de la galerie : la photo en plus à gauche, la vidéo à
   droite. Ils remplacent les points : on voit d'un coup ce qui existe.     */
.gal-icon { position: absolute; bottom: 10px; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(0,0,0,0.5); color: #fff; font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 4; opacity: 0.75; transition: opacity 0.2s, background 0.2s, transform 0.2s; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.gal-icon.left { left: 12px; }
.gal-icon.right { right: 12px; }
.gal-icon.on { opacity: 1; background: var(--brand); transform: scale(1.06); }
.gal-icon:active { opacity: 1; }
/* Les deux mêmes logos sur les cartes du catalogue, aux mêmes coins que dans
   la fiche : on sait avant d'ouvrir ce que le produit a en plus.          */
.media-dot { width: 24px; height: 24px; border-radius: 50%; background: rgba(10,10,11,0.15); border: 1px solid rgba(255,255,255,0.45); color: #fff; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.products.list-view .media-dot { width: 18px; height: 18px; font-size: 8px; }
.product-card .media-dot, .product-card .price10 { cursor: pointer; }
.products.list-view .corner-bar { left: 3px; right: 3px; bottom: 3px; column-gap: 3px; }
/* Ligne du bas trop pleine (voir ajusterBarres) : espacements resserrés,
   puis cadre jaune réduit au prix (« 90€ »), puis texte des cadres en 9 px,
   puis 📷 et 🎥 remontés d'un cran dans leurs angles, et « Plus que »
   retiré en tout dernier. */
.corner-bar.compact { column-gap: 2px; }
.products:not(.list-view) .corner-bar.compact { left: 4px; right: 4px; }
.corner-bar.compact .cb-left, .corner-bar.compact .cb-right, .corner-bar.compact .cb-group { gap: 2px; }
.corner-bar.compact .badge2 { padding-left: 3px; padding-right: 3px; }
.corner-bar.compact .price10 { padding-left: 4px; padding-right: 4px; }
.corner-bar.mini .badge2, .corner-bar.mini .price10 { font-size: 9px; letter-spacing: -0.15px; }
/* Le rond mix mord de 8 px sur ses deux voisins : de ce côté-là, leur texte
   garde toujours 8,5 px de marge pour ne jamais passer dessous (« Plus que
   3 g » entier), même resserré. */
.cb-group > .msgs-grille.avant-mix .badge2:last-child, .corner-bar.compact .cb-group > .msgs-grille.avant-mix .badge2:last-child { padding-right: 8.5px; }
.cb-group > .card-mix + .price10, .cb-group > .card-mix + .badge2, .corner-bar.compact .cb-group > .card-mix + .price10, .corner-bar.compact .cb-group > .card-mix + .badge2 { padding-left: 8.5px; }
.top-bar.compact .badge2 { padding-left: 3px; padding-right: 3px; letter-spacing: -0.2px; }
.corner-bar.court .p10-lbl, .corner-bar.sans-pq .pq-lbl, .top-bar.sans-pq .pq-lbl { display: none; }
.corner-bar.serre .cb-left .media-dot { position: absolute; left: 0; bottom: 24px; }
.corner-bar.serre .cb-right .media-dot { position: absolute; right: 0; bottom: 24px; }
.products.list-view .corner-bar.serre .media-dot { bottom: 19px; }
.products.list-view .price10 { font-size: 8px; padding: 1px 5px; border-radius: 5px; }
.products.list-view .msgs-grille, .products:not(.list-view) .msgs-liste { display: none; }
/* Une seule hauteur pour tout ce qui est posé sur la photo : les cadres (stock,
   RUPTURE, prix des 10 g) et le diamètre des logos ronds (%, ❤️, 📷, 🎥, mix) —
   20 px en grille, 16 px en liste. */
.product-card .badge2, .product-card .price10 { box-sizing: border-box; height: 20px; display: inline-flex; align-items: center; justify-content: center; padding-top: 0; padding-bottom: 0; line-height: 1; }
/* Cadres des cartes (stock, RUPTURE) : angles à peine arrondis comme le cadre
   jaune, et le plus courts possible. */
.product-card .badge2 { border-radius: 7px; padding-left: 5px; padding-right: 5px; }
.products.list-view .product-card .badge2 { border-radius: 5px; padding-left: 4px; padding-right: 4px; }
.product-card .badge-round, .product-card .media-dot { box-sizing: border-box; width: 20px; height: 20px; }
.product-card .badge-round { font-size: 11px; }
.product-card .media-dot { font-size: 10px; }
.products.list-view .product-card .badge2, .products.list-view .product-card .price10 { height: 16px; }
.products.list-view .product-card .badge-round, .products.list-view .product-card .media-dot { width: 16px; height: 16px; font-size: 8px; }
.product-card .badge-round.b-popular { font-size: 16px; }
.products.list-view .product-card .badge-round.b-popular { font-size: 13px; }
.product-card .badge-round.b-promo { font-size: 11px; }
.products.list-view .product-card .badge-round.b-promo { font-size: 8.5px; border-width: 1.2px; }
/* Roboto (Android) pose le % un peu haut dans le rond : on le redescend. */
html:not(.apple-emoji) .products:not(.list-view) .product-card .badge-round.b-promo { padding-top: 1px; }
.modal .modal-body { padding: 20px; }
.modal .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.modal .modal-desc { font-size: 14px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; white-space: pre-line; }
.modal .modal-origin { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.modal .modal-price { font-size: 22px; font-weight: 700; color: var(--brand); margin-bottom: 16px; }
.modal .stock-info { font-size: 12px; color: var(--muted); margin-bottom: 12px; padding: 8px 10px; background: var(--surface-tertiary); border-radius: var(--radius); }
.modal .stock-info.low { color: var(--warning); }
.modal .stock-info.empty { color: var(--error); }
.variants { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.variant-btn { padding: 10px 16px; border-radius: var(--radius); background: var(--surface-tertiary); border: 1px solid var(--border); color: var(--on-surface); font-size: 13px; cursor: pointer; transition: all 0.2s; text-align: left; }
.variant-btn.selected { background: var(--brand); border-color: var(--brand); color: white; }
.variant-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.variant-btn .variant-stock { display: block; font-size: 11px; opacity: 0.85; margin-top: 2px; }
.variant-btn.rupture { opacity: 0.6; cursor: pointer; border-style: dashed; }

.variant-btn.rupture.dead { cursor: default; opacity: 0.45; }

  box-shadow:0 30px 80px -30px rgba(24,12,48,.6);
  animation:cap-rise .6s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes cap-rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
#cap-card.cap-shake{animation:cap-shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes cap-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.cap-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid #e7e0d5}
.cap-badge{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(150deg,#6d28d9,#a855f7);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px #6d28d9}
.cap-badge svg{width:19px;height:19px}
.cap-htxt .k{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:14.5px}
.cap-htxt .s{font-size:11.5px;color:#6b6577}
.cap-prompt{padding:16px 18px 12px}
.cap-q{font-size:15.5px;line-height:1.45;color:#1a1726}
.cap-q b{color:#6d28d9;font-weight:600;background:#efe7fe;padding:1px 6px;border-radius:6px}
.cap-stage{position:relative;margin:4px 18px 0;border-radius:14px;overflow:hidden;border:1px solid #e7e0d5;cursor:crosshair;aspect-ratio:1/1;line-height:0;background:#dCE9F5;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cap-stage img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cap-scan{position:absolute;left:0;right:0;top:0;height:38%;background:linear-gradient(180deg,rgba(109,40,217,0),rgba(109,40,217,.28),rgba(255,255,255,.5));mix-blend-mode:screen;pointer-events:none;opacity:0}
.cap-stage.cap-scanning .cap-scan{animation:cap-sweep 1.15s ease-in-out 1;opacity:1}
@keyframes cap-sweep{0%{transform:translateY(-45%);opacity:.1}55%{opacity:.9}100%{transform:translateY(280%);opacity:0}}
.cap-ring{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border:2px solid rgba(109,40,217,.8);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .18s;box-shadow:0 0 0 6px rgba(109,40,217,.12)}
.cap-ring::before,.cap-ring::after{content:"";position:absolute;background:rgba(109,40,217,.85)}
.cap-ring::before{left:50%;top:8px;bottom:8px;width:1.5px;transform:translateX(-50%)}
.cap-ring::after{top:50%;left:8px;right:8px;height:1.5px;transform:translateY(-50%)}
.cap-stage:hover .cap-ring{opacity:1}
.cap-pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;display:grid;place-items:center;animation:cap-pop .25s ease both}
.cap-pin.bad{background:#e11d48;color:#fff;box-shadow:0 4px 12px -2px rgba(225,29,72,.6)}
.cap-pin.good{width:40px;height:40px;margin:-20px 0 0 -20px;background:#16a34a;color:#fff;box-shadow:0 6px 18px -3px rgba(22,163,74,.7)}
.cap-pin svg{width:15px;height:15px}.cap-pin.good svg{width:22px;height:22px}
@keyframes cap-pop{from{transform:scale(0)}to{transform:scale(1)}}
.cap-hintring{position:absolute;border:2.5px dashed rgba(109,40,217,.9);border-radius:50%;pointer-events:none;opacity:0;animation:cap-hintPulse 2.4s ease 3}
@keyframes cap-hintPulse{0%,100%{opacity:0;transform:scale(.8)}30%,70%{opacity:1;transform:scale(1)}}
.cap-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 16px}
.cap-status{font-size:13px;color:#6b6577;min-height:18px;display:flex;align-items:center;gap:7px}
.cap-status.err{color:#e11d48;font-weight:500}
.cap-status.ok{color:#16a34a;font-weight:600}
.cap-dots{display:flex;gap:4px}
.cap-dots i{width:7px;height:7px;border-radius:50%;background:#e7e0d5}
.cap-dots i.miss{background:#e11d48}
.cap-refresh{appearance:none;border:1px solid #e7e0d5;background:#fff;color:#1a1726;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.cap-refresh:hover{border-color:#6d28d9;color:#6d28d9}
.cap-refresh:active{transform:scale(.97)}
.cap-refresh svg{width:14px;height:14px}
.cap-done{padding:30px 22px 26px;text-align:center;display:none}
.cap-done.show{display:block;animation:cap-rise .5s both}
.cap-stamp{width:70px;height:70px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(150deg,#16a34a,#4ade80);display:grid;place-items:center;color:#fff;box-shadow:0 12px 26px -8px rgba(22,163,74,.6);animation:cap-stamp .5s cubic-bezier(.2,1.3,.4,1) both}
.cap-stamp svg{width:34px;height:34px}
@keyframes cap-stamp{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.cap-done h2{font-family:'Space Grotesk','Inter',sans-serif;font-size:21px;margin-bottom:6px;color:#1a1726}
.cap-done p{color:#6b6577;font-size:14px;margin-bottom:18px}
.cap-enter{appearance:none;border:none;cursor:pointer;font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:15px;color:#fff;background:linear-gradient(150deg,#6d28d9,#a855f7);padding:12px 26px;border-radius:12px;box-shadow:0 10px 22px -8px #6d28d9;transition:.15s}
.cap-enter:hover{transform:translateY(-1px)}
.cap-replay{display:block;margin:14px auto 0;background:none;border:none;color:#6b6577;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cap-replay:hover{color:#1a1726}
.cap-hide{display:none!important}

<script>

  // ouverture normale de l'appli, elle, garde la vérification humaine. Revérifié
  // aussi au 'load' (filet de sécurité si l'URL n'était pas encore établie).
  function hasOrderLink() { try { return /[?&#]order=/.test(location.search + location.hash); } catch (e) { return false; } }
  if (hasOrderLink()) document.body.classList.add('cap-solved');
  else window.addEventListener('load', function () { if (hasOrderLink()) document.body.classList.add('cap-solved'); });
  function init(){
  if (hasOrderLink()) return;
  var CH=[
    {id:'renard',label:'le renard',x:81,y:49.5,r:9,emoji:'🦊'},
    {id:'kiwi',label:'le kiwi',x:73.6,y:74.6,r:8.5,emoji:'🥝',extra:[{x:95,y:95.3,r:7}]},
    {id:'anges',label:'les pommes ailées (avec des ailes)',x:50.9,y:72.3,r:13,emoji:'🍎'},
    {id:'eclairs',label:'les éclairs (les éclairs jaunes)',x:84,y:6,r:9.5,emoji:'⚡️'},
    {id:'tracteur',label:'le tracteur',x:40,y:87.5,r:9.5,emoji:'🚜'},
    {id:'bonbons',label:'les bonbons',x:94.4,y:36.2,r:7,emoji:'🍬',extra:[{x:72.3,y:47.7,r:7},{x:74.6,y:63.4,r:7}]},
    {id:'ail',label:'l\u2019ail',x:72,y:39.9,r:7,emoji:'🧄',extra:[{x:96.3,y:54.6,r:7}]},
    {id:'ananas',label:'l\u2019ananas',x:13.1,y:42.2,r:7,emoji:'🍍',extra:[{x:31.2,y:61.2,r:7}]},
    {id:'banane',label:'la banane',x:56.5,y:45.4,r:7,emoji:'🍌',extra:[{x:39.8,y:61.6,r:7}]}
  ];
  var stage=document.getElementById('cap-stage'),ring=document.getElementById('cap-ring'),
      target=document.getElementById('cap-target'),status=document.getElementById('cap-status'),
      statusTx=document.getElementById('cap-statustxt'),dots=[].slice.call(document.getElementById('cap-dots').children),
      card=document.getElementById('cap-card'),challenge=document.getElementById('cap-challenge'),done=document.getElementById('cap-done');
  if(!stage||!challenge||!done){return;}
  var current=null,misses=0,solved=false;
  // Remise à zéro : le fichier peut avoir été exporté en état "résolu"
  document.body.classList.remove('cap-solved');
  document.body.classList.add('cap-lock');
  challenge.classList.remove('cap-hide');
  done.classList.remove('show');
  function pick(ex){var p=CH.filter(function(c){return c.id!==ex;});return p[Math.floor(Math.random()*p.length)];}
  function clearPins(){var n=stage.querySelectorAll('.cap-pin,.cap-hintring');for(var i=0;i<n.length;i++)n[i].remove();}
  function setCh(ex){current=pick(ex);misses=0;solved=false;target.textContent=current.label;status.className='cap-status';statusTx.textContent='Cliquez sur l\u2019élément demandé.';dots.forEach(function(d){d.className='';});clearPins();stage.classList.remove('cap-scanning');void stage.offsetWidth;stage.classList.add('cap-scanning');}
  function addPin(x,y,k){var p=document.createElement('div');p.className='cap-pin '+k;p.style.left=x+'%';p.style.top=y+'%';p.innerHTML=k==='good'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg>';stage.appendChild(p);}
  function zonesOf(ch){return [{x:ch.x,y:ch.y,r:ch.r}].concat(ch.extra||[]);}
  function showHint(){zonesOf(current).forEach(function(z){var h=document.createElement('div');h.className='cap-hintring';var d=z.r*2;h.style.left=(z.x-z.r)+'%';h.style.top=(z.y-z.r)+'%';h.style.width=d+'%';h.style.height=d+'%';stage.appendChild(h);setTimeout(function(){h.remove();},7200);});}
  function toPct(e){var r=stage.getBoundingClientRect();var cx=e.touches?e.touches[0].clientX:e.clientX;var cy=e.touches?e.touches[0].clientY:e.clientY;return{x:((cx-r.left)/r.width)*100,y:((cy-r.top)/r.height)*100};}
  function onClick(e){
    if(solved)return;var p=toPct(e);if(p.x<0||p.x>100||p.y<0||p.y>100)return;
    var hit=zonesOf(current).some(function(z){var dx=p.x-z.x,dy=p.y-z.y;return Math.sqrt(dx*dx+dy*dy)<=z.r;});
    if(hit){solved=true;clearPins();addPin(p.x,p.y,'good');status.className='cap-status ok';statusTx.textContent='✅️ Correct \u2014 bien joué !';setTimeout(succeed,650);}
    else{addPin(p.x,p.y,'bad');misses=Math.min(misses+1,3);dots.forEach(function(d,i){d.className=i<misses?'miss':'';});card.classList.remove('cap-shake');void card.offsetWidth;card.classList.add('cap-shake');status.className='cap-status err';statusTx.textContent=misses>=3?'❌️ Toujours pas. Voici un indice \u2014 la zone à viser.':'❌️ Ce n\u2019est pas ça. Cliquez précisément sur '+current.label+'.';if(misses>=3)showHint();}
  }
  function succeed(){
    challenge.classList.add('cap-hide');done.classList.add('show');
    // 1) Pseudo Telegram capté : entrée directe UNIQUEMENT s'il figure dans la
    //    liste en tant que pseudo PUBLIC (préfixé « @ »), ou si aucune liste n'est
    //    définie. Il servira pour le panier. Les pseudos non préfixés restent en
    //    saisie manuelle même si le @ Telegram correspond.
    var tgp = capturedTgPseudo();
    try {
      if (tgp) {
        var listAll = readAllowedPseudos();
        var pub = readPublicPseudos();
        // Le pseudo capté entre PRÉFIXÉ d'un « @ » : marqueur infalsifiable d'une
        // entrée automatique vérifiée par Telegram (les saisies manuelles voient
        // au contraire leur « @ » retiré). Il sert tel quel au panier et aux notifs.
        if (!listAll.length || pub.indexOf(normPseudo(tgp)) !== -1) { doUnlock('@' + tgp, true); return; }
      }
    } catch(e){}
    // 2) Pseudo valide saisi il y a moins d'1h : entrée directe (pas de ressaisie).
    try {
      var a = JSON.parse(localStorage.getItem('cave420_gate_auth')||'null');
      if (a && a.pseudo && a.ts && (Date.now()-a.ts) < 3600000) {
        var list = readAllowedPseudos();
        // refreshTs=true : la fenêtre d'1h glisse à chaque passage (compte depuis
        // la DERNIÈRE activité, pas depuis la saisie d'origine) — tant qu'il revient
        // au moins une fois par heure, il ne retape jamais son pseudo.
        if (!list.length || list.indexOf(normPseudo(a.pseudo)) !== -1) { doUnlock(a.pseudo, true); return; }
      }
    } catch(e){}
    // 3) Sinon on demande le pseudo. Si un @ Telegram a été capté (mais pas
    //    autorisé/liste vide), on le pré-remplit — l'info captée sert quand même.
    var inp = document.getElementById('cap-pseudo');
    if (inp) { if (tgp && !inp.value) inp.value = tgp; inp.focus(); }
  }
  // Normalise un pseudo pour comparaison : minuscules, sans le préfixe « @ ».
  function normPseudo(s){ return String(s||'').trim().replace(/^@+/, '').toLowerCase(); }
  // Liste brute des pseudos autorisés (telle que saisie, « @ » conservé).
  function readAllowedRaw(){
    try {
      var arr = null;
      try { arr = (catalog && catalog.settings && catalog.settings.allowed_pseudos) || null; } catch(e0){ arr = null; }
      if(!arr){ var raw0 = document.getElementById('catalog-data'); arr = raw0 ? (((JSON.parse(raw0.textContent) || {}).settings) || {}).allowed_pseudos : null; }
      return Array.isArray(arr) ? arr.map(function(x){ return String(x).trim(); }).filter(Boolean) : [];
    } catch(e){ return []; }
  }
  // Tous les pseudos autorisés (normalisés) — pour la saisie manuelle.
  function readAllowedPseudos(){ return readAllowedRaw().map(normPseudo).filter(Boolean); }
  // Pseudos PUBLICS (préfixés « @ »), normalisés — seuls ceux-ci ouvrent l'entrée
  // automatique via le pseudo Telegram capté. Les autres restent en saisie manuelle.
  function readPublicPseudos(){ return readAllowedRaw().filter(function(x){ return x.charAt(0) === '@'; }).map(normPseudo).filter(Boolean); }
  // Pseudo Telegram PUBLIC de l'utilisateur, lu depuis les données d'init de la
  // Mini App (hash #tgWebAppData). Renvoie null si aucun @username public.
  function capturedTgPseudo(){
    try {
      var h = location.hash || '';
      var m = h.match(/tgWebAppData=([^&]+)/);
      if(!m) return null;
      var q = decodeURIComponent(m[1]);
      var um = q.match(/(?:^|&)user=([^&]+)/);
      if(!um) return null;
      var u = JSON.parse(decodeURIComponent(um[1]));
      if(u && u.username) return String(u.username).trim();
      return null;
    } catch(e){ return null; }
  }
  // Envoi direct au chat du vendeur, en lisant le token dans le fichier lui-même
  // (fonctionne donc aussi en navigation privée, sans stockage local).
  // Renvoie une promesse : tenue si Telegram a bien accepté le message, rompue
  // avec la cause exacte sinon. Le portail l'ignore (envoi au fil de l'eau),
  // mais le bouton de test de l'admin l'attend pour annoncer un vrai résultat.
  function gateNotify(text){
    return new Promise(function(resolve, reject){
      var raw = document.getElementById('catalog-data');
      if(!raw){ reject(new Error('bloc catalog-data introuvable')); return; }
      var s;
      try { var c = JSON.parse(raw.textContent); s = (c && c.settings) || {}; }
      catch(e){ reject(new Error('réglages illisibles dans le fichier')); return; }
      // Relais configuré : on n'envoie que le texte, le token vit sur le relais
      // et ne figure donc plus dans cette page. Sinon, envoi direct comme avant.
      var relai = String(s.relay_url || '').trim().replace(/\/+$/, '');
      var url, body;
      if(relai){
        url = relai;
        body = JSON.stringify({ key: String(s.relay_key || '').trim(), to: 'seller', text: text });
      } else {
        var token = (s.telegram_token || '').trim();
        var chatId = (s.telegram_chat_id || '').trim();
        if(!token || !chatId){ reject(new Error('ni relais ni token/chat ID dans le fichier déployé')); return; }
        url = 'https://api.telegram.org/bot' + token + '/sendMessage';
        body = JSON.stringify({ chat_id: chatId, text: text });
      }
      // keepalive : la requête survit si la page change juste après l'entrée.
      var opts = { method:'POST', headers:{'Content-Type':'application/json'}, body:body, keepalive:true };
      function send(reste){
        fetch(url, opts).then(function(r){
          if(r.ok){ resolve(); return; }
          // Un token révoqué (401) ou un chat ID invalide (400) ne guérira pas
          // en réessayant : on remonte la cause tout de suite. Seules les pannes
          // serveur (5xx) méritent une nouvelle tentative.
          r.json().then(function(d){ return (d && d.description) || ''; }, function(){ return ''; })
            .then(function(desc){
              if(r.status >= 500 && reste > 0){ setTimeout(function(){ send(reste-1); }, 1200); return; }
              reject(new Error('Telegram HTTP ' + r.status + (desc ? ' — ' + desc : '')));
            });
        }).catch(function(e){
          if(reste > 0){ setTimeout(function(){ send(reste-1); }, 1200); return; }
          reject(new Error((e && e.message) || 'réseau injoignable'));
        });
      }
      send(2);
    });
  }
  // Exposée pour le bouton de test dans Admin → Telegram : permet de vérifier que
  // la notification d'entrée part bien depuis CET appareil / ce réseau.
  try { window.__gateNotify = gateNotify; } catch(e){}
  function notifyEntry(pseudo){
    var emoji = (current && current.emoji) ? (' ' + current.emoji) : '';
    var who = (pseudo && String(pseudo).trim()) ? String(pseudo).trim() : "Quelqu'un";
    gateNotify("🚪 " + who + " vient d'entrer sur la boutique" + emoji)
      .catch(function(e){ console.error('[telegram] notif entrée :', e && e.message); });
  }
  // Tentative avec un pseudo qui n'est pas dans la liste : on prévient quand même,
  // pour savoir qui essaie d'entrer. Une seule notification par pseudo essayé.
  var triedPseudos = {};
  function notifyRejected(pseudo){
    var who = String(pseudo || '').trim();
    if(!who) return;
    var k = normPseudo(who);
    if(triedPseudos[k]) return;
    triedPseudos[k] = 1;
    gateNotify("⛔ Tentative d'entrée avec un pseudo NON reconnu : « " + who + " »")
      .catch(function(e){
        // L'alerte n'est jamais partie : on relâche le verrou anti-doublon pour
        // que la prochaine tentative avec ce pseudo puisse encore prévenir.
        delete triedPseudos[k];
        console.error('[telegram] notif pseudo refusé :', e && e.message);
      });
  }
  function doUnlock(pseudo, refreshTs){
    window.__sessionPseudo = pseudo;
    // L'appli recharge la cagnotte attachée à ce pseudo (si elle est déjà chargée)
    try { if (typeof window.__onPseudoUnlock === 'function') window.__onPseudoUnlock(pseudo); } catch(e){}
    // refreshTs=true : nouvelle saisie → l'heure de validité repart de maintenant.
    if (refreshTs) { try { localStorage.setItem('cave420_gate_auth', JSON.stringify({ pseudo: pseudo, ts: Date.now() })); } catch (e) {} }
    document.body.classList.add('cap-solved');
    document.body.classList.remove('cap-lock');
    notifyEntry(pseudo);
  }
  function unlock(){
    var inp = document.getElementById('cap-pseudo');
    var errEl = document.getElementById('cap-pseudo-err');
    // Le « @ » est réservé aux entrées Telegram vérifiées : on le retire d'une
    // saisie manuelle pour qu'un pseudo tapé ne puisse jamais se faire passer pour
    // un pseudo public capté automatiquement.
    var pseudo = (inp ? inp.value : '').trim().replace(/^@+/, '').trim();
    if(errEl) errEl.textContent = '';
    if(!pseudo){ if(errEl) errEl.textContent = 'Entrez votre pseudo'; if(inp) inp.focus(); return; }
    var list = readAllowedPseudos();
    if(list.length && list.indexOf(normPseudo(pseudo)) === -1){ notifyRejected(pseudo); if(errEl) errEl.textContent = 'Pseudo non reconnu — envoyez un message pour en proposer un valide'; if(inp){ inp.focus(); if(inp.select) inp.select(); } return; }
    doUnlock(pseudo, true);
  }
  function replay(){document.body.classList.remove('cap-solved');document.body.classList.add('cap-lock');done.classList.remove('show');challenge.classList.remove('cap-hide');setCh(current&&current.id);}
  stage.addEventListener('mousemove',function(e){var r=stage.getBoundingClientRect();ring.style.left=(e.clientX-r.left)+'px';ring.style.top=(e.clientY-r.top)+'px';});
  stage.addEventListener('pointerdown',function(e){e.preventDefault();var r=stage.getBoundingClientRect();ring.style.left=(e.clientX-r.left)+'px';ring.style.top=(e.clientY-r.top)+'px';});
  var lastTapAt=0;
  function handleTap(e){e.preventDefault&&e.preventDefault();var now=Date.now();if(now-lastTapAt<350)return;lastTapAt=now;onClick(e);}
  stage.addEventListener('pointerup',handleTap);
  stage.addEventListener('click',handleTap);
  document.getElementById('cap-refresh').addEventListener('click',function(){setCh(current&&current.id);});
  document.getElementById('cap-enter').addEventListener('click',unlock);
  (function(){ var cp=document.getElementById('cap-pseudo'); if(cp){ cp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); unlock(); } }); } })();
  document.getElementById('cap-replay').addEventListener('click',replay);
  setCh(null);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>

function pinHash(s) { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return 'h' + h.toString(36); }
function configuredPinHash() { const h = (typeof catalog !== 'undefined') && catalog.settings && catalog.settings.admin_pin_hash; if (h) return h; const legacy = loadJSON('cave420_pin', null); if (typeof legacy === 'string' && legacy) return pinHash(legacy); return pinHash('0000'); }

/* Copie de secours du catalogue dans IndexedDB : capacité largement
   supérieure à localStorage (qui plafonne autour de 5-10 Mo selon
   l'appareil), sans rapport avec le poids des photos. localStorage reste la
   lecture rapide et synchrone au démarrage ; cette copie protège contre une
   perte de modifications si le catalogue dépasse son quota. */
const CATALOG_DB = 'cave420_catdb', CATALOG_STORE = 'kv', CATALOG_KEY = 'catalog';
// Connexion mise en cache : ré-ouvrir indexedDB.open() à chaque sauvegarde
// (le catalogue se sauvegarde très souvent) laissait des connexions
// s'accumuler sans jamais se fermer, ralentissant l'app de plus en plus au
// fil d'une session — d'où un export qui mettait de plus en plus de temps à
// se lancer.
let _catalogDbPromise = null;
function openCatalogDb() {
  if (!_catalogDbPromise) {
    _catalogDbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(CATALOG_DB, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(CATALOG_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { _catalogDbPromise = null; reject(req.error); };
    });
  }
  return _catalogDbPromise;
}
async function idbSaveCatalog(obj) {
  const db = await openCatalogDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(CATALOG_STORE, 'readwrite');
    tx.objectStore(CATALOG_STORE).put(obj, CATALOG_KEY);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbLoadCatalog() {
  const db = await openCatalogDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(CATALOG_STORE, 'readonly');
    const r = tx.objectStore(CATALOG_STORE).get(CATALOG_KEY);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => rej(r.error);
  });
}

// La copie IndexedDB est lue dès le départ. Tant qu'on ne sait pas si elle est
// plus récente que celle de localStorage, aucune écriture du catalogue ne part
// (voir persistCatalogRaw) : sinon la copie périmée lue au démarrage pourrait
// écraser la bonne avant même qu'on l'ait regardée.
const _idbCatalogAtStart = idbLoadCatalog().catch(() => null);
// Remplacée plus bas par la promesse qui tranche entre les deux copies.
let _idbCatalogRescue = _idbCatalogAtStart;

/* Prix « par unité en plus » (p.pas, en centimes) : au-delà du plus grand
   format, chaque unité ajoute ce montant (Poliakov : 20 €, puis +15 € par
   bouteille). Les formats qui en découlent sont générés à la volée (auto),
   pour que panier, mix et stock les traitent comme les autres, mais ne sont
   jamais enregistrés ni affichés dans les listes de formats. */
const PAS_MAX = 20;
function etendreFormatsPas(cat) {
  ((cat || catalog || {}).products || []).forEach(p => {
    if (!Array.isArray(p.variants)) return;
    if (p.variants.some(v => v && v.auto)) p.variants = p.variants.filter(v => v && !v.auto);
    const pas = Number(p.pas) || 0;
    if (pas <= 0 || !p.variants.length) return;
    const dernier = p.variants.reduce((a, v) => variantUnits(v) > variantUnits(a) ? v : a);
    const u0 = variantUnits(dernier), unite = p.stock_unit || '', entier = wholeUnits(p);
    for (let k = 1; k <= PAS_MAX; k++) {
      const n = Math.round((u0 + k) * 1000) / 1000;
      if (p.variants.some(v => Math.abs(variantUnits(v) - n) < 1e-6)) continue;
      p.variants.push({ label: entier ? countLabel(n, unite) : grStr(n) + unite, price: dernier.price + k * pas, units: n, auto: true });
    }
  });
}
const sansFormatsAuto = (k, v) => (k === 'variants' && Array.isArray(v)) ? v.filter(x => !(x && x.auto)) : v;
function aDesFormatsAuto() { return ((catalog && catalog.products) || []).some(p => Number(p.pas) > 0); }
function formatsListes(p) { return (p.variants || []).filter(v => !v.auto); }

  // Les réglages DÉPLOYÉS font autorité (horaires, minimums, cagnotte…) : c'est
  // tout l'intérêt de publier un fichier à jour. On ne récupère du local que ce
  // qui est propre à l'appareil et absent/plus ancien dans le fichier :
  //  - les identifiants Telegram s'ils manquent dans le fichier ;
  //  - un code PIN changé plus récemment en local (arbitrage par horodatage).
  // Avec un relais, un fichier sans token n'est pas un oubli mais un choix :
  // le ressusciter depuis le stockage local le ferait réapparaître dans l'admin,
  // et brouillerait la lecture de ce qui est réellement publié.

  if (!(es.relay_url || '').trim() && (_ks.relay_url || '').trim()) es.relay_url = _ks.relay_url;
  if (!(es.relay_key || '').trim() && (_ks.relay_key || '').trim()) es.relay_key = _ks.relay_key;
  if ((_ks.admin_pin_set_at || 0) > (es.admin_pin_set_at || 0)) { es.admin_pin_hash = _ks.admin_pin_hash; es.admin_pin_set_at = _ks.admin_pin_set_at; }
  persistCatalogRaw();
}

{

{

/* Migration : anciens catalogues (un stock par variante) → un seul stock total mutualisé */
(function migrateSharedStock() {
  if (loadJSON('cave420_stock_v3', false)) return;
  (catalog.products || []).forEach(p => {
    if (p.variants && p.variants.length) {
      // On n'unifie QUE les valeurs réellement non définies vers « illimité ».
      // Un stock à 0 est une RUPTURE volontaire et doit être préservé (sinon, sur
      // un chargement neuf — navigation privée — tous les 0 repasseraient illimités).
      if (p.stock_quantity === undefined || p.stock_quantity === null) p.stock_quantity = null;
      p.variants.forEach(v => {
        if (v.units == null) { const m = String(v.label || '').match(/[\d.,]+/); v.units = m ? (parseFloat(m[0].replace(',', '.')) || 1) : 1; }
        delete v.stock_quantity;
      });

/* Commandes embarquées : si ce fichier a été exporté/synchronisé avec un instantané des commandes
   (via la synchro automatique ou un export), on les fusionne dans le localStorage de cet appareil
   au chargement. Ainsi, ouvrir une copie fraîchement synchronisée rattrape l'historique tout seul.

   CONFIDENTIALITÉ : un appareil client (non-admin) ne doit JAMAIS stocker les commandes d'autres
   clients. On ne conserve/fusionne donc que les commandes de cet appareil (même guest_id). Seul
   l'appareil admin (ayant déjà déverrouillé le mode admin, ou en cours de déverrouillage) garde
   l'historique complet. Le fichier PUBLIÉ ne contient plus aucune commande (le site est public :
   noms, adresses…) : ce bloc reste vide en ligne et ne sert qu'aux exports, qui restent privés.
   Rien n'est perdu pour autant : les commandes reçues par l'admin sont adoptées avec le
   guest_id de son appareil (importOrderFromUrl) et survivent à ce filtrage. */
function mergeEmbeddedOrders(forceAdmin) {
  // Admin = uniquement pendant la session déverrouillée en cours (aucun flag
  // persistant). À chaque (ré)ouverture, l'appareil repart « client » et les
  // commandes tierces sont repurgées ; l'admin les recharge en se déverrouillant.
  const isAdminDevice = forceAdmin === true;
  let embedded = [];
  try { const raw = document.getElementById('orders-data'); embedded = raw ? JSON.parse(raw.textContent) : []; } catch (e) { embedded = []; }
  if (!Array.isArray(embedded)) embedded = [];
  const current = loadJSON('cave420_orders', []);
  const originalLen = Array.isArray(current) ? current.length : 0;
  let arr = Array.isArray(current) ? current.slice() : [];
  if (!isAdminDevice) {
    arr = arr.filter(o => o && o.guest_id === guestId);
    embedded = embedded.filter(o => o && o.guest_id === guestId);
  }
  // Une commande archivée à la main ne doit pas revenir depuis le bloc embarqué
  const gone = new Set(archiveRemovedIds().map(String));
  if (gone.size) { arr = arr.filter(o => !gone.has(String(o.id))); embedded = embedded.filter(o => !gone.has(String(o.id))); }
  const byId = new Map(arr.map(o => [String(o.id), o]));
  let changed = arr.length !== originalLen; // une purge des commandes tierces compte comme un changement
  embedded.forEach(o => {
    if (!o || o.id == null) return;
    const key = String(o.id);
    const existing = byId.get(key);
    if (!existing) { arr.push(o); byId.set(key, o); changed = true; }
    else if (JSON.stringify(existing) !== JSON.stringify(o)) { Object.assign(existing, o); changed = true; }
  });
  if (changed) { arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); store('cave420_orders', arr); }
}

// Purge automatique : on supprime définitivement les commandes de plus de
// 24 heures (suppression pure, sans restitution de stock ni de cagnotte).
// Exception : une commande désarchivée à la main compte ses 24 h à partir du
// désarchivage, puis retourne dans l'archive au lieu d'être effacée.
const ORDER_MAX_AGE_MS = 24 * 60 * 60 * 1000;   // 24 heures
function purgeOldOrders() {
  const list = loadJSON('cave420_orders', []);
  if (!Array.isArray(list) || !list.length) return;
  const now = Date.now();
  const kept = list.filter(o => {
    if (!o || !(o.unarchived_at || o.created_at)) return true; // on garde ce qu'on ne peut pas dater
    const t = new Date(o.unarchived_at || o.created_at).getTime();
    if (isNaN(t)) return true;
    return (now - t) <= ORDER_MAX_AGE_MS;
  });
  if (kept.length === list.length) return;
  const gone = list.filter(o => kept.indexOf(o) === -1);
  // Le client reste joignable (annuaire 📣) même une fois sa commande partie
  recordPseudoChats(gone.filter(o => o.admin_imported));
  const back = gone.filter(o => o.unarchived_at);
  if (back.length) storeArchived(back);
  store('cave420_orders', kept);
}

// localStorage reste la copie rapide, lue de façon synchrone au démarrage.
// IndexedDB (capacité largement supérieure, sans lien avec le poids des
// photos) sert de copie de secours : si le catalogue dépasse le quota
// localStorage, c'est elle qui évite de perdre des modifications non encore
// ré-exportées — les photos, elles, ne changent jamais de résolution.
// Le catalogue se sauvegarde très souvent (jusqu'à chaque frappe sur
// certains champs) ; sérialiser plusieurs Mo de photos en base64 à CHAQUE
// frappe rendait l'app de plus en plus lente au fil d'une session (et
// l'export avec, puisqu'il part du même catalogue). On ne réécrit donc
// réellement qu'une fois les modifications calmées, sans jamais perdre la
// toute dernière version : state.categories/products, eux, restent à jour
// immédiatement (c'est juste une réaffectation de référence, pas coûteux).
function persistCatalogRaw() {
  clearTimeout(_persistTimer);
  _persistTimer = setTimeout(() => {
    // On attend d'avoir tranché entre les deux copies du démarrage (promesse
    // déjà résolue passé les premières secondes : l'attente ne coûte alors rien).
    _idbCatalogRescue.then(() => {
      // Horodatage de la dernière modification locale. `version` ne bouge qu'à
      // l'export ou au déploiement : deux copies de même version ne se
      // départageaient pas, et à la réouverture c'était la plus ancienne —
      // celle de localStorage, bloquée au quota — qui l'emportait. Une photo
      // ajoutée à un catalogue déjà lourd disparaissait ainsi au redémarrage.
      catalog.saved_at = Date.now();
      // Une fois le catalogue avéré trop gros pour localStorage, on arrête de
      // le re-tenter (le JSON à écrire coûte du temps même quand ça échoue, et
      // un catalogue chargé de photos ne redescend pas sous le quota en cours
      // de session) — IndexedDB prend seul le relais jusqu'au rechargement.
      // Les formats « +1 » (auto) ne s'enregistrent jamais : ils se recalculent.
      const auto = aDesFormatsAuto();
      let json = null;
      if (!_localStorageCatalogBroken || auto) json = JSON.stringify(catalog, sansFormatsAuto);
      if (!_localStorageCatalogBroken) {
        try { localStorage.setItem('cave420_catalog', json); }
        catch (e) { _localStorageCatalogBroken = true; }
      }
      idbSaveCatalog(auto ? JSON.parse(json) : catalog).catch(err => {
        console.error('sauvegarde IndexedDB:', err);
        // Plus aucune copie à jour sur l'appareil : il faut le dire.
        if (_localStorageCatalogBroken) showToast('⚠️ Mémoire pleine : exporte le fichier avant de fermer l\'appli');
      });
    });
  }, 800);
}
function saveCatalog() {
  try { etendreFormatsPas(); } catch (e) {}
  try { clampFlashCounters(); } catch (e) {}
  persistCatalogRaw();
  state.categories = catalog.categories; state.products = catalog.products;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(c) { return ((c || 0) / 100).toFixed(2).replace('.', ',') + ' €'; }
// Cagnotte : toujours un nombre entier d'euros, jamais de centimes — pas de ",00".
function fmtEuros(c) { return Math.round((c || 0) / 100) + ' €'; }
function centsToStr(c) { return ((c || 0) / 100).toFixed(2).replace('.', ','); }
function parsePrice(s) { s = String(s || '').replace(/\s|€/g, '').replace(',', '.'); if (!s) return null; const n = parseFloat(s); return isNaN(n) || n < 0 ? null : Math.round(n * 100); }
function parseQty(s) { const n = parseInt(String(s || '').trim(), 10); return isNaN(n) || n < 0 ? 0 : n; }
/* Pseudo Telegram (ou numéro) : 2 formats acceptés uniquement —
   1) un seul mot attaché, sans majuscule (ex: "toto_44")
   2) 10 chiffres commençant par 0 (ex numéro de tel), avec un espace auto entre chaque paire de chiffres */
function formatTgValue(raw) {
  const v = String(raw || '');
  const digitsOnly = v.replace(/\s+/g, '');
  if (digitsOnly !== '' && /^\d+$/.test(digitsOnly)) {
    const d = digitsOnly.slice(0, 10);
    return d.replace(/(\d{2})(?=\d)/g, '$1 ');
  }
  return v.toLowerCase().replace(/\s+/g, '');
}
function isValidTgValue(raw) {
  const v = String(raw || '').trim();
  if (!v) return true;
  const digitsOnly = v.replace(/\s+/g, '');
  if (/^\d+$/.test(digitsOnly)) return /^0\d{9}$/.test(digitsOnly);
  return /^[a-z0-9_]+$/.test(v);
}
/* Parse un nombre décimal en acceptant la virgule OU le point (ex : "1,3" ou "1.3") */
function parseNum(s) { s = String(s ?? '').replace(/\s/g, '').replace(',', '.'); if (s === '') return 0; const n = parseFloat(s); return isNaN(n) || n < 0 ? 0 : n; }
/* Arrondi à 3 décimales pour éviter les artefacts de calcul flottant sur les stocks */
function round3(n) { return Math.round((Number(n) + Number.EPSILON) * 1000) / 1000; }
/* Affichage FR d'un nombre (virgule décimale, sans zéros inutiles) */
function numFr(n) { return String(n).replace('.', ','); }

function showToast(m) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

/* ===== STOCK MUTUALISÉ ===== */
// Une bouteille de la catégorie Alcool vaut 4 flashs, et inversement. En revanche
// le produit Flash compte son stock EN FLASHS : « 1 flash » y retire 1 unité.
const FLASHS_PER_BOTTLE = 4;
function isFlashLabel(s) { return /flash/i.test(String(s || '')); }
function variantUnits(v) {
  if (v.units != null && v.units !== '') { const n = parseFloat(v.units); if (!isNaN(n) && n > 0) return n; }
  const m = String(v.label || '').match(/[\d.,]+/);
  if (m) { const n = parseFloat(m[0].replace(',', '.')); if (!isNaN(n) && n > 0) return n; }
